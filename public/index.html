<script>
function updateDateTime() {

    const now = new Date();

    const day = String(now.getDate()).padStart(2, '0');
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const year = now.getFullYear();

    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const seconds = String(now.getSeconds()).padStart(2, '0');

    document.getElementById("dateTime").textContent =
        `${day}-${month}-${year} ${hours}:${minutes}:${seconds}`;
}

updateDateTime();
setInterval(updateDateTime, 1000);
</script>

<script>

function formatPostTime(unixTimestamp){

    const now = Date.now();
    const postTime = unixTimestamp * 1000;

    const diffMinutes =
        Math.floor((now - postTime) / 60000);

    const diffHours =
        Math.floor(diffMinutes / 60);

    if(diffMinutes < 2){
        return "Just now";
    }

    if(diffMinutes < 60){
        return `${diffMinutes} minutes ago`;
    }

    if(diffHours < 24){
        return diffHours === 1
            ? "1 hour ago"
            : `${diffHours} hours ago`;
    }

    return new Date(postTime)
        .toLocaleDateString("en-IN",{
            day:"2-digit",
            month:"short",
            year:"numeric"
        });
}

function updateTimes(){

    document
    .querySelectorAll(".time")
    .forEach(el=>{

        const ts =
            Number(el.dataset.time);

        el.textContent =
            formatPostTime(ts);

    });

}

function linkifyText(text){

    text = text.replace(
        /(https?:\/\/[^\s]+)/g,
        '<a href="$1" target="_blank" class="post-link">$1</a>'
    );

    text = text.replace(
        /(^|\s)(#[a-zA-Z0-9_\u0900-\u097F]+)/g,
        function(match,space,tag){

            const keyword =
                tag.slice(1);

            return `${space}<a href="/search/?q=${encodeURIComponent(keyword)}" class="post-tag">${tag}</a>`;

        }
    );

    return text;

}

let allPosts = [];
let currentPage = 0;
const postsPerPage = 20;

async function loadFeed(){

    const feed =
        document.getElementById(
            "channelFeed"
        );

    

    feed.innerHTML = Array(5).fill(`

                <div
                    class="skeleton"
                    style="
                    height:14px;
                    width:60%;">
                </div>

            </div>

        </article>

    `).join("");

   const feedSources = [

{
    url:"https://poster.yojnaportal.com/channel.json",
    name:"Yojna Portal Poster",
    logo:"https://poster.yojnaportal.com/favicon.ico"
},

    url:"https://www.gajabtools.com/channel.json",

},

{
    url:"https://www.yojnaportal.com/channel.json",
    name:"Yojna Portal",
    logo:"https://www.yojnaportal.com/favicon.ico"
}

];

    try{

        let posts = [];

       const results =
await Promise.allSettled(

    feedSources.map(source=>

        fetch(source.url)
        .then(r=>r.json())
        .then(data=>

            data.map(post=>({

                ...post,

                sourceName:
                    source.name,

                sourceLogo:
                    source.logo

            }))

        )

    )

);
        results.forEach(result=>{

            if(
                result.status === "fulfilled"
            ){

                posts.push(
                    ...result.value
                );

            }

        });

        posts.sort(
            (a,b)=>
            new Date(b.date) -
            new Date(a.date)
        );

        allPosts = posts;

        feed.innerHTML = "";

        renderPosts();
        updateSavedButtons();
    }catch(err){

        console.error(err);

        feed.innerHTML =
            "<h3>Feed loading failed</h3>";

    }

}

        document.getElementById(
            "channelFeed"
        );

    const start =
        currentPage * postsPerPage;

    const end =
        start + postsPerPage;

    const chunk =
        allPosts.slice(start,end);

    if(chunk.length === 0){
        return;
    }

    feed.insertAdjacentHTML(

        "beforeend",

        chunk.map(post=>`

        <article class="post-card">

</div>

<div

</div>
    
                </div>

</button>
            <div class="menu-wrap">

    <button class="menu-btn">⋮</button>
    
    <div class="menu-dropdown">

        <a href="${post.url}" target="_blank">

        </button>

        <button
            class="share-btn"
            data-title="${post.title}"
            data-url="${post.url}">
            🖇️ Share Link
        </button>
      
    </div>




    </div>
            </div>
           
                <div class="post-body">
               
                <div
    class="post-text ${post.image ? 'collapsed' : ''}">
           ${ linkifyText(  post.description || "" ) }
    
</div>
            </div>

            ${
                post.image
                ? `
                <div class="post-image">
                    <a href="${post.url}">
                        <img
                            src="${post.image}"
                            alt="${post.title}">
                    </a>
                </div>
                `
                : ""
            }

        
           
            <div class="post-footer">
               
                <a
                    href="${post.url}"
                    target="_blank"
                    class="action-btn">
                    🔗
                </a>

                <button
                    class="action-btn copy-btn"
                    data-text="${(post.description||'').replace(/"/g,'&quot;')}">

                <button

                    data-text="${(post.description||'').replace(/"/g,'&quot;')}"
                    data-url="${post.url}">
                    📤
                </button>

            </div>

        </article>

        `).join("")

    );

    updateTimes();
updateSavedButtons();

}

<script>
document.addEventListener("click",function(e){

    const btn =
        e.target.closest(".save-btn");

    if(!btn) return;

    const post =
        JSON.parse(
            btn.dataset.post
                .replace(/&#39;/g,"'")
        );

    let savedPosts =
        JSON.parse(
            localStorage.getItem(
                "savedPosts"
            ) || "[]"
        );

    const exists =
        savedPosts.find(
            p => p.url === post.url
        );

    if(exists){

        savedPosts =
            savedPosts.filter(
                p => p.url !== post.url
            );

        btn.innerHTML =
            "⭐ Save";

        btn.classList.remove(
            "saved"
        );

    }else{

        savedPosts.unshift(post);

        btn.innerHTML =
            "★ Saved";

        btn.classList.add(
            "saved"
        );

    }

    localStorage.setItem(
        "savedPosts",
        JSON.stringify(savedPosts)
    );

});
</script>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const currentPath = window.location.pathname;

    document.querySelectorAll(".bottom-nav .nav-item")
    .forEach(link => {

        link.classList.remove("active");

        const linkPath = new URL(link.href).pathname;

        if(
            currentPath === linkPath ||
            (linkPath !== "/" && currentPath.startsWith(linkPath))
        ){
            link.classList.add("active");

    });
