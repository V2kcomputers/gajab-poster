<script>
function updateDateTime() {

    const now = new Date();

    const day = String(now.getDate()).padStart(2, '0');
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const year = now.getFullYear();

    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const seconds = String(now.getSeconds()).padStart(2, '0');

    document.getElementById("dateTime").textContent =
        `${day}-${month}-${year} ${hours}:${minutes}:${seconds}`;
}

updateDateTime();
setInterval(updateDateTime, 1000);
</script>

<script>
    const savedPosts =
JSON.parse(
    localStorage.getItem(
        "savedPosts"
    ) || "[]"
);

const feed =
document.getElementById(
    "savedFeed"
);

feed.innerHTML = savedPosts.map(post=>`

<article class="post-card">

    <div class="post-header">

    <div class="avatar">
        <img
            src="${post.sourceLogo}"
            alt="${post.sourceName}">
    </div>

    <div class="meta">

        <div class="title">

            ${post.sourceName}

            <span class="verified-badge">
                ✓
            </span>

        </div>

        <div class="date">
            Saved Post
        </div>

    </div>
    <a
    href="${post.url}"
    target="_blank"
    class="header-share-btn">

 <button
    class="header-save-btn save-btn">
    🔗 Open  
</button> </a>
    <div class="menu-wrap">

        <button class="menu-btn">
            ⋮
        </button>

        <div class="menu-dropdown">

            <a
                href="${post.url}"
                target="_blank">

                🔗 Open

            </a>
            <button
    class="action-btn share-post"
    data-title="${post.title || ''}"
    data-text="${post.description || ''}"
    data-url="${post.url}">
    📤
</button>
            <button
                class="remove-saved"
                data-url="${post.url}">

                🗑️ Remove

            </button>

        </div>

    </div>

</div>
    ${
        post.image
        ? `
        <div class="post-image">

            <a
                href="${post.url}"
                target="_blank">

                <img
                    src="${post.image}"
                    alt="${post.title}">

            </a>

        </div>
        `
        : ""
    }

    <div class="post-body">

        <div class="post-text">

            ${post.description || ""}

        </div>

    </div>

    <div class="post-footer">

        <a
            href="${post.url}"
            target="_blank"
            class="action-btn">

            🔗

        </a>
        <button
    class="action-btn share-post"
    data-title="${post.title || ''}"
    data-text="${post.description || ''}"
    data-url="${post.url}">
    📤
</button>
        <button
            class="action-btn remove-saved"
            data-url="${post.url}">

            🗑️

        </button>

    </div>

</article>

`).join("");
if(savedPosts.length===0){

    feed.innerHTML = `

    <article class="post-card">

        <div class="post-body">

            No saved posts found.

        </div>

    </article>

    `;

}
document.addEventListener(
"click",
function(e){

    const btn =
    e.target.closest(
        ".remove-saved"
    );

    if(!btn) return;

    const url =
    btn.dataset.url;

    let posts =
    JSON.parse(
        localStorage.getItem(
            "savedPosts"
        ) || "[]"
    );

    posts =
    posts.filter(
        p => p.url !== url
    );

    localStorage.setItem(
        "savedPosts",
        JSON.stringify(posts)
    );

    btn.closest(
        ".post-card"
    ).remove();

});
</script>
<script>
    document.addEventListener("click",function(e){

    if(e.target.classList.contains("menu-btn")){

        const menu =
            e.target.nextElementSibling;

        document
            .querySelectorAll(".menu-dropdown")
            .forEach(m=>{

                if(m!==menu){
                    m.classList.remove("show");
                }

            });

        menu.classList.toggle("show");
        return;
    }

    document
        .querySelectorAll(".menu-dropdown")
        .forEach(m=>
            m.classList.remove("show")
        );

});
</script>
<script>
document.addEventListener("click", async function(e){

    const btn = e.target.closest(".share-post");

    if(!btn) return;

    const title = btn.dataset.title || "";
    const text  = btn.dataset.text || "";
    const url   = btn.dataset.url || "";

    const shareText =
`${title}

${text}

${url}`;

    if(navigator.share){

        try{

            await navigator.share({
                title: title,
                text: text,
                url: url
            });

        }catch(err){}

    }else{

        window.open(
            "https://wa.me/?text=" +
            encodeURIComponent(shareText),
            "_blank"
        );

    }

});
</script>

<script>
function moveMenu(){

    const menu = document.getElementById("mainMenu");

    if(window.innerWidth <= 768){

        document
            .getElementById("menuFooter")
            .appendChild(menu);

    }else{

        document
            .getElementById("menuHeader")
            .appendChild(menu);

    }

    menu.style.display = "block";
}

moveMenu();

window.addEventListener("resize", moveMenu);
</script>
<script>
document.addEventListener("DOMContentLoaded", () => {

    const currentPath = window.location.pathname;

    document.querySelectorAll(".bottom-nav .nav-item")
    .forEach(link => {

        link.classList.remove("active");

        const linkPath = new URL(link.href).pathname;

        if(
            currentPath === linkPath ||
            (linkPath !== "/" && currentPath.startsWith(linkPath))
        ){
            link.classList.add("active");
        }

    });

});
</script>
