<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  background:#edf0f5;
  overflow:hidden;
}

 

.editor{
  display:flex;
  width:100%;
  height:100vh;
}

 

.left-icons{

  width:70px;

  background:#fff;

  border-right:1px solid #ddd;

  display:flex;

  flex-direction:column;

  align-items:center;

  padding:10px 0;

  gap:12px;

  z-index:1000;

}

.left-icons button{

  width:52px;
  height:52px;

  border:none;

  border-radius:16px;

  background:#f5f5f5;

  font-size:22px;

  cursor:pointer;

  transition:.2s;

}

.left-icons button:hover{

  background:#0a9b32;
  color:#fff;

}

 

.left-panel{

  width:280px;

  background:#fff;

  border-right:1px solid #ddd;

  overflow:auto;

  padding:20px;

}

.panel{
  display:none;
}

.panel.active{
  display:block;
}

.panel h2{
  margin-bottom:20px;
}


 

.top-toolbar{

  display:flex;

  align-items:center;

  gap:12px;

  padding:12px;

  overflow-x:auto;

}

.tool-item{

  position:relative;

  flex:none;

}

.tool-control{

  position:absolute;

  top:65px;

  left:50%;

  transform:translateX(-50%);

  min-width:260px;

  background:#f5f5f5;

  border:1px solid #ddd;

  border-radius:24px;

  padding:20px;

  box-shadow:
  0 10px 35px rgba(0,0,0,.12);

  display:none;

  z-index:999999;

}

 



.tool-control.show{
  display:block;
}

.tool-control input[type=color]{

  width:70px;
  height:50px;

  border:none;

  background:none;

}

.tool-control input[type=range]{

  width:160px;

}

.align-popup{

  display:none;

  gap:8px;

}

.align-popup.show{
  display:flex;
}

.mini-btn{

  width:32px;
  height:32px;

  font-size:18px;

}

.delete-btn{

  background:#ffe5e5;

  color:#d10000;

}



 

.tool-group{

  display:flex;

  align-items:center;

  gap:8px;

  padding-right:10px;

  border-right:1px solid #e5e5e5;

  flex:none;

}

.tool-group:last-child{
  border-right:none;
}
 

.top-toolbar{

  position:fixed;

  top:10px;

  left:50%;

  transform:translateX(-50%);

  display:flex;

  align-items:center;

  gap:8px;

  padding:8px 12px;

  background:#f7f7f7;

  border:1px solid #dcdcdc;

  border-radius:22px;

  box-shadow:
  0 5px 20px rgba(0,0,0,.08);

  z-index:99999;

  overflow:visible;  

}

 

.tool-item{

  position:relative;

  flex:none;

}

 

.tool-control{

  position:absolute;

  top:65px;

  left:50%;

  transform:translateX(-50%);

  min-width:260px;

  background:#f5f5f5;

  border:1px solid #ddd;

  border-radius:24px;

  padding:20px;

  box-shadow:
  0 10px 35px rgba(0,0,0,.12);

  display:none;

  z-index:999999;

}

 

.tool-control.show{
  display:block;
}

 

.control-title{

  font-size:15px;

  font-weight:700;

  margin-bottom:14px;

}

 

.range-row{

  display:flex;

  align-items:center;

  gap:14px;

  margin-bottom:22px;

}

.range-row input[type=range]{

  flex:1;

}

 

.range-value{

  width:52px;

  height:48px;

  border-radius:14px;

  border:1px solid #ddd;

  background:#fff;

  text-align:center;

  font-size:20px;

}

 

.align-tools{

  display:flex;

  gap:10px;

  margin-top:10px;

}

.align-tools .icon-btn{

  flex:1;

}

 

.icon-btn{

  width:46px;

  height:46px;

  border:none;

  border-radius:14px;

  background:#ececec;

  cursor:pointer;

  font-size:22px;

  transition:.2s;

}

.icon-btn:hover{

  background:#e2d7ff;

  color:#6d28d9;

}

 

.icon-btn.active{

  background:#e2d7ff;

  color:#6d28d9;

}

 

.top-toolbar::-webkit-scrollbar{
  display:none;
}

.top-toolbar{
  scrollbar-width:none;
}
 

.tool-select{

  height:42px;

  border:none;

  border-radius:12px;

  padding:0 14px;

  background:#f5f5f5;

  font-size:15px;

  font-weight:600;

  outline:none;

}

 

.icon-btn{

  width:40px;

  height:40px;

  border:none;

  border-radius:12px;

  background:#f3f3f3;

  font-size:20px;

  cursor:pointer;

  transition:.2s;

}

.icon-btn:hover{

  background:#ede9fe;

  color:#6d28d9;

}

 

.toolbar-text-btn{

  border:none;

  background:none;

  font-size:15px;

  font-weight:600;

  cursor:pointer;

  padding:0 8px;

  color:#333;

}

 

.size-box{

  background:#f5f5f5;

  border-radius:14px;

  padding:4px;

}

.size-box input{

  width:60px;

  border:none;

  background:transparent;

  text-align:center;

  font-size:18px;

  font-weight:700;

  outline:none;

}

 

.color-box{

  position:relative;

}

.color-box input[type=color]{

  width:34px;

  height:8px;

  border:none;

  background:none;

  cursor:pointer;

}

.tool-icon{

  font-size:28px;

  font-weight:700;

}

 

.canvas-area{

  flex:1;

  overflow:auto;

  padding-top:70px;

  display:flex;

  justify-content:center;

  align-items:flex-start;

}

.canvas-wrapper{

  position:relative;

  width:794px;
  height:1123px;

  background:#fff;

  margin:20px;

  overflow:hidden;

  box-shadow:
  0 10px 40px rgba(0,0,0,.15);

}

.canvas-container{
  touch-action:none;
}

 

.right-panel{

  width:320px;

  background:#fff;

  border-left:1px solid #ddd;

  padding:20px;

  overflow:auto;

}

.right-panel h2{
  margin-bottom:20px;
}

.export-btn{

  width:100%;

  border:none;

  padding:14px;

  border-radius:14px;

  background:#0a9b32;

  color:#fff;

  font-weight:700;

  margin-bottom:12px;

  cursor:pointer;

}

 

.text-style{

  padding:18px;

  border-radius:14px;

  background:#f6f6f6;

  margin-bottom:15px;

  cursor:pointer;

  font-weight:700;

}

.neon{

  background:#000;

  color:#0ff;

  text-shadow:
  0 0 10px #0ff,
  0 0 20px #0ff;

}

 

.shape-grid{

  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:10px;

}

.shape-btn{

  height:70px;

  border:none;

  border-radius:16px;

  background:#f4f4f4;

  font-size:30px;

  cursor:pointer;

}

 

.upload-box{

  border:2px dashed #ccc;

  padding:30px;

  border-radius:20px;

  text-align:center;

  cursor:pointer;

  margin-bottom:20px;

}

.recent-images{

  display:grid;

  grid-template-columns:repeat(2,1fr);

  gap:10px;

}

.recent-images img{

  width:100%;

  border-radius:14px;

  cursor:pointer;

}

.effect-box{
  display:none;
  width:100%;
  margin-top:10px;
  padding:12px;
  border-radius:12px;
  background:#1f1f1f;
  border:1px solid rgba(255,255,255,0.08);
}

.effect-box.active{
  display:block;
}

.effect-control{
  margin-bottom:14px;
}

.effect-control label{
  display:block;
  font-size:13px;
  margin-bottom:6px;
  color:#000;
}

.effect-control input[type="range"]{
  width:100%;
}

.effect-control input[type="color"]{
  width:100%;
  height:45px;
  border:none;
  background:none;
  cursor:pointer;
}

.effect-grid{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.effect-btn{
  padding:12px;
  border:none;
  border-radius:12px;
  background:#2b2b2b;
  color:#fff;
  cursor:pointer;
  font-size:15px;
  transition:0.2s;
}

.effect-btn:hover{
  background:#3b3b3b;
}

 

.effect-custom-box{

  margin-top:20px;

  padding:15px;

  border-radius:18px;

  background:#f7f7f7;

}

.effect-control{

  margin-bottom:15px;

}

.effect-control label{

  display:block;

  margin-bottom:8px;

  font-size:14px;

  font-weight:700;

}

.effect-control input[type=range]{

  width:100%;

}

.effect-control input[type=color]{

  width:100%;

  height:45px;

  border:none;

  border-radius:12px;

}
.mobile-show {display: none;}
@media(max-width:768px){

  body{
    overflow:hidden;
  }

  .editor{
    flex-direction:column;
  }

   

  .left-icons{

    position:fixed;

    bottom:0;

    left:0;

    width:100%;

    height:75px;

    flex-direction:row;

    justify-content:flex-start;

    overflow-x:auto;

    gap:12px;

    padding:10px;

    border-right:none;

    border-top:1px solid #ddd;

    z-index:99999;

    background:#fff;

  }

  .left-icons button{

    min-width:55px;

    height:55px;

    border-radius:16px;

    font-size:24px;

    flex:none;

  }

   

  .left-panel{

    position:fixed;

    left:0;

    right:0;

    bottom:75px;

    width:100%;

    height:260px;

    z-index:9999;

    border-radius:20px 20px 0 0;

    display:none;

    overflow:auto;

    box-shadow:
    0 -5px 30px rgba(0,0,0,.15);

  }

  .left-panel.show{
    display:block;
  }

   

  .right-panel{
    display:none;
  }

   

  .top-toolbar{

    position:fixed;

    left:0;

    right:0;

    bottom:335px;

    top:auto;

    height:auto;

    padding:12px;

    white-space:nowrap;

    display:none;

    gap:10px;

  }

  .top-toolbar.show{
    display:flex;
  }

   

  .canvas-area{

    width:100%;

    overflow:auto;

    padding:
    10px
    10px
    180px
    10px;

    display:block;

  }

  .canvas-wrapper{

    width:100%;

    height:auto;

    max-width:100%;

    margin:0 auto;

  }
  .right-panel{

    position:fixed;

    left:0;

    right:0;

    bottom:75px;

    width:100%;

    height:300px;

    background:#fff;

    z-index:99999;

    border-radius:20px 20px 0 0;

    overflow:auto;

    display:none;

    padding:20px;

    box-shadow:
    0 -5px 30px rgba(0,0,0,.15);

  }

  .right-panel.show{
    display:block;
  }
  .mobile-show {display: block;}


}

 

::-webkit-scrollbar{
  width:6px;
  height:6px;
}

::-webkit-scrollbar-thumb{
  background:#bbb;
  border-radius:20px;
}

</style>

<body>

<div class="editor">

  

  <div class="left-icons">
    <button onclick="toggleToolbar()" class="mobile-show">
    🎛️
  </button>


     <button onclick="openPanel('textPanel')">
    🅣
  </button>

  <button onclick="openPanel('shapePanel')">
    ⬜
  </button>

  <button onclick="openPanel('imagePanel')">
    🖼️
  </button>

  <button onclick="openPanel('toolPanel')">
    ✏️
  </button>

  

  <button onclick="openPanel('fontPanel')">
    🔤
  </button>

  

  <button onclick="openPanel('effectPanel')">
    ✨
  </button>

  

  
  

  <button onclick="toggleExportPanel()" class="mobile-show">
    ⬇️
  </button>

  </div>

  

  <div class="left-panel">
    

<div
class="panel"
id="fontPanel"
>

  <h2>Fonts</h2>

  <div class="font-grid">

    <button
    class="font-btn"
    style="font-family:Poppins"
    onclick="setFontFamily('Poppins')"
    >
      Poppins
    </button>

    <button
    class="font-btn"
    style="font-family:Arial"
    onclick="setFontFamily('Arial')"
    >
      Arial
    </button>

    <button
    class="font-btn"
    style="font-family:Impact"
    onclick="setFontFamily('Impact')"
    >
      Impact
    </button>

    <button
    class="font-btn"
    style="font-family:Georgia"
    onclick="setFontFamily('Georgia')"
    >
      Georgia
    </button>

  </div>

</div>



<div class="panel" id="effectPanel">

  <h2>Effects</h2>

  <div class="effect-grid">

    
    <button
      class="effect-btn"
      onclick="toggleEffectControls('shadowControls'); applyShadow();">
      Shadow
    </button>

    <div class="effect-custom-box effect-box" id="shadowControls">

      <div class="effect-control">
        <label>Shadow X</label>

        <input
          type="range"
          id="shadowX"
          min="-50"
          max="50"
          value="0"
          oninput="updateShadowEffect()">
      </div>

      <div class="effect-control">
        <label>Shadow Y</label>

        <input
          type="range"
          id="shadowY"
          min="-50"
          max="50"
          value="0"
          oninput="updateShadowEffect()">
      </div>

      <div class="effect-control">
        <label>Shadow Blur</label>

        <input
          type="range"
          id="shadowBlur"
          min="0"
          max="100"
          value="20"
          oninput="updateShadowEffect()">
      </div>

      <div class="effect-control">
        <label>Shadow Color</label>

        <input
          type="color"
          id="shadowColor"
          value="#00ffff"
          oninput="updateShadowEffect()">
      </div>

    </div>



    
    <button
      class="effect-btn"
      onclick="toggleEffectControls('outlineControls'); applyOutline();">
      Outline
    </button>

    <div class="effect-custom-box effect-box" id="outlineControls">

      <div class="effect-control">
        <label>Outline Width</label>

        <input
          type="range"
          id="outlineWidth"
          min="0"
          max="20"
          value="2"
          oninput="updateOutlineEffect()">
      </div>

      <div class="effect-control">
        <label>Outline Color</label>

        <input
          type="color"
          id="outlineColor"
          value="#000000"
          oninput="updateOutlineEffect()">
      </div>

    </div>



    
    <button
      class="effect-btn"
      onclick="toggleEffectControls('neonControls'); applyNeon();">
      Neon
    </button>

    <div class="effect-custom-box effect-box" id="neonControls">

      <div class="effect-control">
        <label>Neon Color</label>

        <input
          type="color"
          id="neonColor"
          value="#00ffff"
          oninput="applyNeon()">
      </div>

    </div>



    
    <button
      class="effect-btn"
      onclick="toggleEffectControls('goldControls'); applyGold();">
      Gold
    </button>

    <div class="effect-custom-box effect-box" id="goldControls">

      <div class="effect-control">
        <label>Gold Intensity</label>

        <input
          type="range"
          min="0"
          max="100"
          value="60"
          oninput="applyGold()">
      </div>

    </div>



    
    <button
      class="effect-btn"
      onclick="toggleEffectControls('redGlowControls'); applyRedGlow();">
      Red Glow
    </button>

    <div class="effect-custom-box effect-box" id="redGlowControls">

      <div class="effect-control">
        <label>Glow Strength</label>

        <input
          type="range"
          min="0"
          max="100"
          value="40"
          oninput="applyRedGlow()">
      </div>

    </div>



    
    <button
      class="effect-btn"
      onclick="toggleEffectControls('whiteOutlineControls'); applyWhiteOutline();">
      White Outline
    </button>

    <div class="effect-custom-box effect-box" id="whiteOutlineControls">

      <div class="effect-control">
        <label>White Outline Size</label>

        <input
          type="range"
          min="0"
          max="20"
          value="3"
          oninput="applyWhiteOutline()">
      </div>

    </div>



    
    <button
      class="effect-btn"
      onclick="toggleEffectControls('gradientControls'); applyGradient();">
      Gradient
    </button>

    <div class="effect-custom-box effect-box" id="gradientControls">

      <div class="effect-control">
        <label>Gradient 1</label>

        <input
          type="color"
          value="#ff0000"
          oninput="applyGradient()">
      </div>

      <div class="effect-control">
        <label>Gradient 2</label>

        <input
          type="color"
          value="#ffff00"
          oninput="applyGradient()">
      </div>

    </div>



    
    <button
      class="effect-btn"
      onclick="toggleEffectControls('curveControls'); applyCurve();">
      Curve
    </button>

    <div class="effect-custom-box effect-box" id="curveControls">

      <div class="effect-control">
        <label>Curve Radius</label>

        <input
          type="range"
          min="-300"
          max="300"
          value="0"
          oninput="applyCurve()">
      </div>

    </div>



    
    <button
      class="effect-btn"
      onclick="resetTransform()">
      Reset Transform
    </button>



    
    <button
      class="effect-btn"
      onclick="removeEffects()">
      Reset
    </button>

  </div>

</div>

    

    <div
    class="panel active"
    id="textPanel"
    >

      <h2>Add Text</h2>

      <div
      class="text-style"
      onclick="addText('Heading Text',50)"
      >
        Heading
      </div>

      <div
      class="text-style"
      onclick="addText('Sub Heading',32)"
      >
        Sub Heading
      </div>

      <div
      class="text-style neon"
      onclick="addNeonText()"
      >
        Neon Text
      </div>

    </div>

    

    <div
    class="panel"
    id="shapePanel"
    >

      <h2>Shapes</h2>

      <div class="shape-grid">

        <button
        class="shape-btn"
        onclick="addRect()"
        >
          ▭
        </button>

        <button
        class="shape-btn"
        onclick="addCircle()"
        >
          ◯
        </button>

        <button
        class="shape-btn"
        onclick="addTriangle()"
        >
          △
        </button>

      </div>

    </div>

    

    <div
    class="panel"
    id="imagePanel"
    >

      <h2>Images</h2>

      <div
      class="upload-box"
      onclick="imageUpload.click()"
      >
        Upload Image
      </div>

      <input
      type="file"
      id="imageUpload"
      hidden
      accept="image/*"
      >

      <div
      class="recent-images"
      id="recentImages"
      ></div>

    </div>

    

    <div
    class="panel"
    id="toolPanel"
    >

      <h2>Tools</h2>

      <button
      class="export-btn"
      onclick="enableDrawing()"
      >
        Pencil
      </button>

      <button
      class="export-btn"
      onclick="disableDrawing()"
      >
        Select
      </button>

    </div>

  </div>

  

  <div
  style="
  flex:1;
  display:flex;
  flex-direction:column;
  "
  >


<div class="top-toolbar">
  

<select id="fontFamily" class="tool-select">
  <option>Poppins</option>
  <option>Arial</option>
  <option>Impact</option>
  <option>Georgia</option>
</select>

<button
  class="icon-btn"
  onclick="changeFontSize(-2)"
>
  −
</button>

<input
  type="number"
  id="fontSize"
  value="36"
  min="10"
  max="300"
>

<button
  class="icon-btn"
  onclick="changeFontSize(2)"
>
  +
</button>

<span class="tool-icon">
  A
</span>

<input
  type="color"
  id="fontColor"
  value="#7c3aed"
>

<button
  class="icon-btn"
  onclick="makeBold()"
  title="Bold"
>
  <b>B</b>
</button>

<button
  class="icon-btn"
  onclick="makeItalic()"
  title="Italic"
>
  <i>I</i>
</button>

<button
  class="icon-btn"
  onclick="makeUnderline()"
  title="Underline"
>
  <u>U</u>
</button>

  

  <div class="tool-item">

    <button
      class="icon-btn"
      onclick="toggleToolControl('fontColorControl')"
    >
      <span
        id="fontColorIcon"
        style="
        color:#7c3aed;
        font-weight:900;
        font-size:22px;
        "
      >
        A
      </span>
    </button>

    <div
      class="tool-control"
      id="fontColorControl"
    >

      <input
        type="color"
        id="fontColor"
        value="#7c3aed"
      >

    </div>

  </div>

  

  <div class="tool-item">

    <button
      class="icon-btn"
      onclick="toggleToolControl('fontSizeControl')"
    >
      🔠
    </button>

    <div
      class="tool-control"
      id="fontSizeControl"
    >

      <div class="size-box">

        <button
          class="icon-btn mini-btn"
          onclick="changeFontSize(-2)"
        >
          −
        </button>

        <input
          type="number"
          id="fontSize"
          value="36"
          min="10"
          max="300"
        >

        <button
          class="icon-btn mini-btn"
          onclick="changeFontSize(2)"
        >

function fitCanvasToMobile(){

  const wrapper =
  document.querySelector(".canvas-wrapper");

  if(window.innerWidth <= 768){

    const scale =
    wrapper.clientWidth / 794;

    wrapper.style.height =
    (1123 * scale) + "px";

    canvas.setZoom(scale);

    canvas.setDimensions({

      width:794 * scale,
      height:1123 * scale

    });

  }else{

    canvas.setZoom(1);

    canvas.setDimensions({

      width:794,
      height:1123

    });

    wrapper.style.height =
    "1123px";

  }

  autoFitImages();

canvas.renderAll();

}

function autoFitImages(){

        left:0

function openPanel(id){

    currentPanel === id &&
    leftPanel.classList.contains("show")

    toolbar.classList.remove("show");

    currentPanel = null;

  document

    panel.classList.remove("active");

<script>




let history = [];
let historyStep = -1;
let isRedoing = false;

 

function saveHistory(){

  if(isRedoing) return;

  historyStep++;

  if(historyStep < history.length){

    history.length = historyStep;

  }

  history.push(
    JSON.stringify(canvas)
  );

}

 

saveHistory();

 

canvas.on(
  "object:added",
  saveHistory
);

canvas.on(
  "object:modified",
  saveHistory
);

canvas.on(
  "object:removed",
  saveHistory
);

 

function undo(){

  if(historyStep <= 0) return;

  isRedoing = true;

  historyStep--;

  canvas.loadFromJSON(

    history[historyStep],

    function(){

      canvas.renderAll();

      isRedoing = false;

    }

  );

}

 

function redo(){

  if(
    historyStep >=
    history.length - 1
  ) return;

  isRedoing = true;

  historyStep++;

  canvas.loadFromJSON(

    history[historyStep],

    function(){

      canvas.renderAll();

      isRedoing = false;

    }

  );

}




function layerUp(){

  const obj =
  canvas.getActiveObject();

  if(!obj) return;

  canvas.bringForward(obj);

  canvas.renderAll();

  saveHistory();

}




function layerDown(){

  const obj =
  canvas.getActiveObject();

  if(!obj) return;

  canvas.sendBackwards(obj);

  canvas.renderAll();

  saveHistory();

}




function toggleLock(){

  const obj =
  canvas.getActiveObject();

  if(!obj) return;

  const lockBtn =
  document.getElementById(
    "lockBtn"
  );

  const isLocked =
  obj.isLocked === true;

  


  if(isLocked){

    obj.set({

      selectable:true,
      evented:true,

      lockMovementX:false,
      lockMovementY:false,

      lockScalingX:false,
      lockScalingY:false,

      lockRotation:false,

      hasControls:true,
      hasBorders:true,

      opacity:1,

      isLocked:false

    });

    
    if(lockBtn){

      lockBtn.innerHTML = "🔓";

    }

    
    addLockIcon(obj,false);

  }

  


  else{

    obj.set({

      selectable:true,
      evented:true,

      lockMovementX:true,
      lockMovementY:true,

      lockScalingX:true,
      lockScalingY:true,

      lockRotation:true,

      hasControls:false,
      hasBorders:false,

      opacity:1,

      isLocked:true

    });

    
    if(lockBtn){

      lockBtn.innerHTML = "🔒";

    }

    
    addLockIcon(obj,true);

  }

  canvas.setActiveObject(obj);

  canvas.renderAll();

  saveHistory();

}




canvas.on(
  "mouse:down",
  function(opt){

    if(!opt.target) return;

    const obj =
    opt.target;

    
    if(obj.excludeFromExport) return;

    if(obj.isLocked){

      canvas.setActiveObject(obj);

      canvas.renderAll();

    }

  }
);




function duplicateLayer(){

  const obj =
  canvas.getActiveObject();

  if(!obj) return;

  obj.clone(function(cloned){

    cloned.set({

      left:obj.left + 25,
      top:obj.top + 25

    });

    canvas.add(cloned);

    canvas.setActiveObject(cloned);

    canvas.renderAll();

    saveHistory();

  });

}




function deleteLayer(){

  const obj =
  canvas.getActiveObject();

  if(!obj) return;

  canvas.remove(obj);

  canvas.renderAll();

  saveHistory();

}







document.addEventListener(

  "keydown",

  function(e){

    const obj =
    canvas.getActiveObject();

    if(!obj) return;

    


    const isEditingText =

      (
        obj.type === "textbox" ||
        obj.type === "i-text"
      )

      &&

      obj.isEditing;

    


    if(

      (
        e.key === "Delete" ||
        e.key === "Backspace"
      )

      &&

      !isEditingText

    ){

      e.preventDefault();

      canvas.remove(obj);

      canvas.renderAll();

      saveHistory();

    }

    


    if(
      e.ctrlKey &&
      e.key.toLowerCase() === "z"
    ){

      e.preventDefault();

      undo();

    }

    


    if(
      e.ctrlKey &&
      e.key.toLowerCase() === "y"
    ){

      e.preventDefault();

      redo();

    }

  }

);




function applySelectedTextColor(color){

  const obj =
  canvas.getActiveObject();

  if(
    !obj ||
    (
      obj.type !== "textbox" &&
      obj.type !== "i-text"
    )
  ) return;

  


  if(

    obj.selectionStart !==
    obj.selectionEnd

  ){

    obj.setSelectionStyles(

      {

        fill:color

      },

      obj.selectionStart,

      obj.selectionEnd

    );

  }

  


  else{

    obj.set(
      "fill",
      color
    );

  }

  canvas.renderAll();

  saveHistory();

}




function applySelectedBold(){

  const obj =
  canvas.getActiveObject();

  if(
    !obj ||
    (
      obj.type !== "textbox" &&
      obj.type !== "i-text"
    )
  ) return;

  if(

    obj.selectionStart !==
    obj.selectionEnd

  ){

    obj.setSelectionStyles(

      {

        fontWeight:"bold"

      },

      obj.selectionStart,

      obj.selectionEnd

    );

  }

  else{

    obj.set(

      "fontWeight",

      obj.fontWeight ===
      "bold"

      ? "normal"
      : "bold"

    );

  }

  canvas.renderAll();

  saveHistory();

}




function applySelectedItalic(){

  const obj =
  canvas.getActiveObject();

  if(
    !obj ||
    (
      obj.type !== "textbox" &&
      obj.type !== "i-text"
    )
  ) return;

  if(

    obj.selectionStart !==
    obj.selectionEnd

  ){

    obj.setSelectionStyles(

      {

        fontStyle:"italic"

      },

      obj.selectionStart,

      obj.selectionEnd

    );

  }

  else{

    obj.set(

      "fontStyle",

      obj.fontStyle ===
      "italic"

      ? "normal"
      : "italic"

    );

  }

  canvas.renderAll();

  saveHistory();

}

</script>

document

.addEventListener(

<script>
  


function toggleToolControl(id){

  document
  .querySelectorAll(".tool-control")
  .forEach(box=>{

    if(box.id !== id){

      box.classList.remove("show");

    }

  });

  document
  .getElementById(id)
  .classList.toggle("show");

}




document
.getElementById("fontColor")
.addEventListener(
  "input",
  function(){

    applySelectedTextColor(
      this.value
    );

  }
);




function justifyAlign(){

  const obj =
  canvas.getActiveObject();

  if(!obj) return;

  obj.set(
    "textAlign",
    "justify"
  );

  canvas.renderAll();

}




document.addEventListener(
  "click",
  function(e){

    if(
      !e.target.closest(".tool-item")
    ){

      document
      .querySelectorAll(".tool-control")
      .forEach(box=>{

        box.classList.remove("show");

      });

    }

  }
);

<script>
  


function initCanvasDragDrop(){

  const canvasContainer =
  canvas.upperCanvasEl;

  


  [
    "dragenter",
    "dragover",
    "dragleave",
    "drop"
  ].forEach(eventName=>{

    canvasContainer.addEventListener(

      eventName,

      function(e){

        e.preventDefault();

        e.stopPropagation();

      },

      false

    );

  });

  


  [
    "dragenter",
    "dragover"
  ].forEach(eventName=>{

    canvasContainer.addEventListener(

      eventName,

      function(){

        canvasContainer.style.outline =
        "3px dashed #7c3aed";

        canvasContainer.style.outlineOffset =
        "-6px";

      },

      false

    );

  });

  


  [
    "dragleave",
    "drop"
  ].forEach(eventName=>{

    canvasContainer.addEventListener(

      eventName,

      function(){

        canvasContainer.style.outline =
        "none";

      },

      false

    );

  });

  


  canvasContainer.addEventListener(

    "drop",

    function(e){

      const dt =
      e.dataTransfer;

      const files =
      dt.files;

      if(!files.length) return;

      [...files].forEach(file=>{

        if(
          !file.type.startsWith(
            "image/"
          )
        ) return;

        const reader =
        new FileReader();

        reader.onload =
        function(event){

          fabric.Image.fromURL(

            event.target.result,

            function(img){

               

              const pointer =
              canvas.getPointer(e);

              img.set({

                left:pointer.x,
                top:pointer.y,

                originX:"center",
                originY:"center"

              });

               

              if(
                img.width > 500
              ){

                img.scaleToWidth(300);

              }

              canvas.add(img);

              canvas.setActiveObject(img);

              canvas.renderAll();

              saveRecentImage(
                event.target.result
              );

              saveHistory();

            }

          );

        };

        reader.readAsDataURL(file);

      });

    },

    false

  );

}




initCanvasDragDrop();
</script>
