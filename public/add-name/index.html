<link rel="stylesheet" href="http://localhost:1313/css/editor/add-name.min.9297a7abf4cd0644ff82dbe7194eb3ef5a7f0e4fdf89bc6236cbf0e635f99091.css" integrity="sha256-kpenq/TNBkT/gtvnGU6z71p/Dk/fibxiNsvw5jX5kJE=">

<title>Professional Poster Editor</title>

href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700;900&display=swap"
rel="stylesheet"
/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>

<style>

</style>


</head>

<body>

<div class="editor">

  

  <div class="left-icons">
    <button onclick="toggleToolbar()" class="mobile-show">
    🎛️
  </button>


     <button onclick="openPanel('textPanel')">
    🅣
  </button>

  <button onclick="openPanel('shapePanel')">
    ⬜
  </button>

  <button onclick="openPanel('imagePanel')">
    🖼️
  </button>

  <button onclick="openPanel('toolPanel')">
    ✏️
  </button>

  

  <button onclick="openPanel('fontPanel')">
    🔤
  </button>

  

  <button onclick="openPanel('effectPanel')">
    ✨
  </button>
  <button onclick="openPanel('imageEffectPanel')">
  🪄
</button>

  

  
  

  <button onclick="toggleExportPanel()" class="mobile-show">
    ⬇️
  </button>

  </div>

  

  <div class="left-panel">


    

<div
class="panel"
id="imageEffectPanel"
>

<h2>Image Effects</h2>

<div class="effect-grid">

  

<button
class="effect-btn"
onclick="enableCropMode()"
onmousedown="event.preventDefault()"
>
  ✂️ Crop
</button>
<button
class="effect-btn"
id="applyCropBtn"
onclick="applyCrop()"
onmousedown="event.preventDefault()"
style="display:none;"
>
  ✅ Apply Crop
</button>

  

  <div class="effect-control">

    <label>Brightness</label>

    <input
    type="range"
    id="brightnessRange"
    min="-1"
    max="1"
    step="0.1"
    value="0"
    oninput="applyImageFilters()"
    >

  </div>

  

  <div class="effect-control">

    <label>Contrast</label>

    <input
    type="range"
    id="contrastRange"
    min="-1"
    max="1"
    step="0.1"
    value="0"
    oninput="applyImageFilters()"
    >

  </div>

  

  <div class="effect-control">

    <label>Saturation</label>

    <input
    type="range"
    id="saturationRange"
    min="-1"
    max="1"
    step="0.1"
    value="0"
    oninput="applyImageFilters()"
    >

  </div>

  

  <div class="effect-control">

    <label>Blur</label>

    <input
    type="range"
    id="blurRange"
    min="0"
    max="1"
    step="0.01"
    value="0"
    oninput="applyImageFilters()"
    >

  </div>

  

  <button
  class="effect-btn"
  onclick="toggleGrayscale()"
  >
    Black & White
  </button>

  

  <button
  class="effect-btn"
  onclick="resetImageFilters()"
  >
    Reset Effects
  </button>

</div>

</div>
    

<div
class="panel"
id="fontPanel"
>

  <h2>Fonts</h2>

  <div class="font-grid">

    <button
    class="font-btn"
    style="font-family:Poppins"
    onclick="setFontFamily('Poppins')"
    >
      Poppins
    </button>

    <button
    class="font-btn"
    style="font-family:Arial"
    onclick="setFontFamily('Arial')"
    >
      Arial
    </button>

    <button
    class="font-btn"
    style="font-family:Impact"
    onclick="setFontFamily('Impact')"
    >
      Impact
    </button>

    <button
    class="font-btn"
    style="font-family:Georgia"
    onclick="setFontFamily('Georgia')"
    >
      Georgia
    </button>

  </div>

</div>



<div class="panel" id="effectPanel">

  <h2>Effects</h2>

  <div class="effect-grid">

    
    <button
      class="effect-btn"
      onclick="toggleEffectControls('shadowControls'); applyShadow();">
      Shadow
    </button>

    <div class="effect-custom-box effect-box" id="shadowControls">

      <div class="effect-control">
        <label>Shadow X</label>

        <input
          type="range"
          id="shadowX"
          min="-50"
          max="50"
          value="0"
          oninput="updateShadowEffect()">
      </div>

      <div class="effect-control">
        <label>Shadow Y</label>

        <input
          type="range"
          id="shadowY"
          min="-50"
          max="50"
          value="0"
          oninput="updateShadowEffect()">
      </div>

      <div class="effect-control">
        <label>Shadow Blur</label>

        <input
          type="range"
          id="shadowBlur"
          min="0"
          max="100"
          value="20"
          oninput="updateShadowEffect()">
      </div>

      <div class="effect-control">
        <label>Shadow Color</label>

        <input
          type="color"
          id="shadowColor"
          value="#00ffff"
          oninput="updateShadowEffect()">
      </div>

    </div>



    
    <button
      class="effect-btn"
      onclick="toggleEffectControls('outlineControls'); applyOutline();">
      Outline
    </button>

    <div class="effect-custom-box effect-box" id="outlineControls">

      <div class="effect-control">
        <label>Outline Width</label>

        <input
          type="range"
          id="outlineWidth"
          min="0"
          max="20"
          value="2"
          oninput="updateOutlineEffect()">
      </div>

      <div class="effect-control">
        <label>Outline Color</label>

        <input
          type="color"
          id="outlineColor"
          value="#000000"
          oninput="updateOutlineEffect()">
      </div>

    </div>



    
    <button
      class="effect-btn"
      onclick="toggleEffectControls('neonControls'); applyNeon();">
      Neon
    </button>

    <div class="effect-custom-box effect-box" id="neonControls">

      <div class="effect-control">
        <label>Neon Color</label>

        <input
          type="color"
          id="neonColor"
          value="#00ffff"
          oninput="applyNeon()">
      </div>

    </div>



    
    <button
      class="effect-btn"
      onclick="toggleEffectControls('goldControls'); applyGold();">
      Gold
    </button>

    <div class="effect-custom-box effect-box" id="goldControls">

      <div class="effect-control">
        <label>Gold Intensity</label>

        <input
          type="range"
          min="0"
          max="100"
          value="60"
          oninput="applyGold()">
      </div>

    </div>



    
    <button
      class="effect-btn"
      onclick="toggleEffectControls('redGlowControls'); applyRedGlow();">
      Red Glow
    </button>

    <div class="effect-custom-box effect-box" id="redGlowControls">

      <div class="effect-control">
        <label>Glow Strength</label>

        <input
          type="range"
          min="0"
          max="100"
          value="40"
          oninput="applyRedGlow()">
      </div>

    </div>



    
    <button
      class="effect-btn"
      onclick="toggleEffectControls('whiteOutlineControls'); applyWhiteOutline();">
      White Outline
    </button>

    <div class="effect-custom-box effect-box" id="whiteOutlineControls">

      <div class="effect-control">
        <label>White Outline Size</label>

        <input
          type="range"
          min="0"
          max="20"
          value="3"
          oninput="applyWhiteOutline()">
      </div>

    </div>



    
    <button
      class="effect-btn"
      onclick="toggleEffectControls('gradientControls'); applyGradient();">
      Gradient
    </button>

    <div class="effect-custom-box effect-box" id="gradientControls">

      <div class="effect-control">
        <label>Gradient 1</label>

        <input
          type="color"
          value="#ff0000"
          oninput="applyGradient()">
      </div>

      <div class="effect-control">
        <label>Gradient 2</label>

        <input
          type="color"
          value="#ffff00"
          oninput="applyGradient()">
      </div>

    </div>



    
    <button
      class="effect-btn"
      onclick="toggleEffectControls('curveControls'); applyCurve();">
      Curve
    </button>

    <div class="effect-custom-box effect-box" id="curveControls">

      <div class="effect-control">
        <label>Curve Radius</label>

        <input
          type="range"
          min="-300"
          max="300"
          value="0"
          oninput="applyCurve()">
      </div>

    </div>



    
    <button
      class="effect-btn"
      onclick="resetTransform()">
      Reset Transform
    </button>



    
    <button
      class="effect-btn"
      onclick="removeEffects()">
      Reset
    </button>

  </div>

</div>

    

    <div
    class="panel active"
    id="textPanel"
    >

      <h2>Add Text</h2>

      <div
      class="text-style"
      onclick="addText('Heading Text',50)"
      >
        Heading
      </div>

      <div
      class="text-style"
      onclick="addText('Sub Heading',32)"
      >
        Sub Heading
      </div>

      <div
      class="text-style neon"
      onclick="addNeonText()"
      >
        Neon Text
      </div>

    </div>

    

    <div
    class="panel"
    id="shapePanel"
    >

      <h2>Shapes</h2>

      <div class="shape-grid">

        <button
        class="shape-btn"
        onclick="addRect()"
        >
          ▭
        </button>

        <button
        class="shape-btn"
        onclick="addCircle()"
        >
          ◯
        </button>

        <button
        class="shape-btn"
        onclick="addTriangle()"
        >
          △
        </button>

      </div>

    </div>

    

    <div
    class="panel"
    id="imagePanel"
    >

      <h2>Images</h2>

      <div
      class="upload-box"
      onclick="imageUpload.click()"
      >
        Upload Image
      </div>

      <input
      type="file"
      id="imageUpload"
      hidden
      accept="image/*"
      >

      <div
      class="recent-images"
      id="recentImages"
      ></div>

    </div>

    

    <div
    class="panel"
    id="toolPanel"
    >

      <h2>Tools</h2>

      <button
      class="export-btn"
      onclick="enableDrawing()"
      >
        Pencil
      </button>

      <button
      class="export-btn"
      onclick="disableDrawing()"
      >
        Select
      </button>

    </div>

  </div>

  

  <div
  style="
  flex:1;
  display:flex;
  flex-direction:column;
  "
  >


<div class="top-toolbar">
  

<select id="fontFamily" class="tool-select">
  <option>Poppins</option>
  <option>Arial</option>
  <option>Impact</option>
  <option>Georgia</option>
</select>

<button
  class="icon-btn"
  onclick="changeFontSize(-2)"
>
  −
</button>

<input
  type="number"
  id="fontSize"
  value="36"
  min="10"
  max="300"
>

<button
  class="icon-btn"
  onclick="changeFontSize(2)"
>
  +
</button>

<span class="tool-icon">
  A
</span>

<input
  type="color"
  id="fontColor"
  value="#7c3aed"
>

<button
  class="icon-btn"
  onclick="makeBold()"
  title="Bold"
>
  <b>B</b>
</button>

<button
  class="icon-btn"
  onclick="makeItalic()"
  title="Italic"
>
  <i>I</i>
</button>

<button
  class="icon-btn"
  onclick="makeUnderline()"
  title="Underline"
>
  <u>U</u>
</button>

  

  <div class="tool-item">

    <button
      class="icon-btn"
      onclick="toggleToolControl('fontColorControl')"
    >
      <span
        id="fontColorIcon"
        style="
        color:#7c3aed;
        font-weight:900;
        font-size:22px;
        "
      >
        A
      </span>
    </button>

    <div
      class="tool-control"
      id="fontColorControl"
    >

      <input
        type="color"
        id="fontColor"
        value="#7c3aed"
      >

    </div>

  </div>

  

  <div class="tool-item">

    <button
      class="icon-btn"
      onclick="toggleToolControl('fontSizeControl')"
    >
      🔠
    </button>

    <div
      class="tool-control"
      id="fontSizeControl"
    >

      <div class="size-box">

        <button
          class="icon-btn mini-btn"
          onclick="changeFontSize(-2)"
        >
          −
        </button>

        <input
          type="number"
          id="fontSize"
          value="36"
          min="10"
          max="300"
        >

        <button
          class="icon-btn mini-btn"
          onclick="changeFontSize(2)"
        >
          +
        </button>

      </div>

    </div>

  </div>

  

  <div class="tool-item">

    <button
      class="icon-btn"
      onclick="toggleToolControl('alignControl')"
    >
      ☰
    </button>

    <div
      class="tool-control align-popup"
      id="alignControl"
    >

      <button
        class="icon-btn"
        onclick="alignLeft()"
      >
        ⬅
      </button>

      <button
        class="icon-btn"
        onclick="alignCenter()"
      >
        ⬍
      </button>

      <button
        class="icon-btn"
        onclick="alignRight()"
      >
        ➡
      </button>

      <button
        class="icon-btn"
        onclick="justifyAlign()"
      >
        ☷
      </button>

    </div>

  </div>

  

  <div class="tool-item">

    <button
      class="icon-btn"
      onclick="toggleToolControl('opacityControl')"
    >
      ◐
    </button>

    <div
      class="tool-control"
      id="opacityControl"
    >

      <input
        type="range"
        id="objectOpacity"
        min="0"
        max="1"
        step="0.01"
        value="1"
      >

    </div>

  </div>

  

  <div class="tool-item">

    <button
      class="icon-btn"
      onclick="toggleToolControl('bgControl')"
    >
      🎨
    </button>

    <div
      class="tool-control"
      id="bgControl"
    >

      <input
        type="color"
        id="canvasBgColor"
        value="#ffffff"
      >

    </div>

  </div>

  

  <div class="tool-item">

  <button
    class="icon-btn"
    id="lockBtn"
    onclick="toggleLock()"
  >
    🔓
  </button>

</div>

  

  <div class="tool-item">

    <button
      class="icon-btn"
      onclick="duplicateLayer()"
    >
      ⧉
    </button>

  </div>

  

  <div class="tool-item">

    <button
      class="icon-btn delete-btn"
      onclick="deleteLayer()"
    >
      🗑
    </button>

  </div>

  

  <div class="tool-item">

    <button
      class="icon-btn"
      onclick="undo()"
    >
      ↶
    </button>

  </div>

  

  <div class="tool-item">

    <button
      class="icon-btn"
      onclick="redo()"
    >
      ↷
    </button>

  </div>
  <button
class="effect-btn"
id="applyCropBtn"
onclick="applyCrop()"
style="display:none;"
>
  ✅ Apply Crop
</button>

</div>

    

    <div class="canvas-area">

      <div class="canvas-wrapper">

        <canvas
        id="canvas"
        width="794"
        height="1123"
        ></canvas>

      </div>

    </div>

  </div>

  

  <div class="right-panel">

    <h2>Project Title</h2>

    <input
    type="text"
    id="projectTitle"
    value="Title Name"
    style="
    width:100%;
    height:50px;
    padding:10px;
    border-radius:14px;
    border:2px solid #ddd;
    margin-bottom:20px;
    font-size:18px;
    font-weight:700;
    "
    >

    <h2>Export</h2>

    <button
    class="export-btn"
    onclick="downloadPNG()"
    >
      Download PNG
    </button>

    <button
    class="export-btn"
    onclick="downloadJPG()"
    >
      Download JPG
    </button>
    <button
class="export-btn"
onclick="downloadTransparentPNG()"
>
  Transparent PNG
</button>

    <button
    class="export-btn"
    onclick="printCanvas()"
    >
      Print
    </button>

    <button
    class="export-btn"
    onclick="downloadJSON()"
    >
      Save Project
    </button>

    <button
    class="export-btn"
    onclick="loadJSON()"
    >
      Load Project
    </button>

    <h2 style="margin-top:30px;">
      Canvas Size
    </h2>

    <select
    id="canvasSize"
    style="
    width:100%;
    height:50px;
    border-radius:14px;
    padding:10px;
    "
    >

      <option value="794x1123">
        A4
      </option>

      <option value="1080x1080">
        Instagram Post
      </option>

      <option value="1920x1080">
        YouTube Thumbnail
      </option>

    </select>

  </div>

</div>

      <script src="http://localhost:1313/js/pages/disabled.min.1175cdc4e51f136c5f2943e2315c233af1bc5ddd220b676292b2d6ec47e2c7c7.js" integrity="sha256-EXXNxOUfE2xfKUPiMVwjOvG8Xd0iC2dikrLW7Efix8c=" defer></script>
    
  

</body>
