<!DOCTYPE html>
<html lang="en">
<head><script src="/livereload.js?mindelay=10&amp;v=2&amp;port=1313&amp;path=livereload" data-no-instant defer></script>
<meta charset="UTF-8">
<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>Professional Poster Editor</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700;900&display=swap"
rel="stylesheet"
/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  background:#edf0f5;
  overflow:hidden;
}

 

.editor{
  display:flex;
  width:100%;
  height:100vh;
}

 

.left-icons{

  width:70px;

  background:#fff;

  border-right:1px solid #ddd;

  display:flex;

  flex-direction:column;

  align-items:center;

  padding:10px 0;

  gap:12px;

  z-index:1000;

}

.left-icons button{

  width:52px;
  height:52px;

  border:none;

  border-radius:16px;

  background:#f5f5f5;

  font-size:22px;

  cursor:pointer;

  transition:.2s;

}

.left-icons button:hover,
.left-icons button.active{

  background:#0a9b32;
  color:#fff;

}

 

.left-panel{

  width:280px;

  background:#fff;

  border-right:1px solid #ddd;

  overflow:auto;

  padding:20px;

}

.panel{
  display:none;
}

.panel.active{
  display:block;
}

.panel h2{
  margin-bottom:20px;
}

 

.top-toolbar{

  position:fixed;

  top:0;

  left:350px;

  right:320px;

  height:60px;

  background:#fff;

  border-bottom:1px solid #ddd;

  display:flex;

  align-items:center;

  gap:10px;

  padding:0 15px;

  z-index:999;

}

.top-toolbar input,
.top-toolbar select{

  height:38px;

  border:1px solid #ccc;

  border-radius:8px;

  padding:0 10px;

}

.toolbar-btn{

  border:none;

  padding:10px 14px;

  border-radius:10px;

  background:#f3f3f3;

  cursor:pointer;

  font-weight:700;

}

 

.top-title{

  position:fixed;

  top:6px;

  left:80%;

  transform:translateX(-50%);

  background:#fff;

  border:4px solid #000;

  padding:5px 25px;

  font-size:8px;

  font-weight:900;

  z-index:99999;
  display: none;

}

 

.canvas-area{

  flex:1;

  overflow:auto;

  padding-top:70px;

  display:flex;

  justify-content:center;

  align-items:flex-start;

}

.canvas-wrapper{

  background:#fff;

  margin:20px;

  box-shadow:
  0 10px 40px rgba(0,0,0,.15);

}

 

.right-panel{

  width:320px;

  background:#fff;

  border-left:1px solid #ddd;

  padding:20px;

  overflow:auto;

}

.right-panel h2{
  margin-bottom:20px;
}

.export-btn{

  width:100%;

  border:none;

  padding:14px;

  border-radius:14px;

  background:#0a9b32;

  color:#fff;

  font-weight:700;

  margin-bottom:12px;

  cursor:pointer;

}

 

.text-style{

  padding:18px;

  border-radius:14px;

  background:#f6f6f6;

  margin-bottom:15px;

  cursor:pointer;

  font-weight:700;

}

.neon{

  background:#000;

  color:#0ff;

  text-shadow:
  0 0 10px #0ff,
  0 0 20px #0ff;

}

 

.shape-grid{

  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:10px;

}

.shape-btn{

  height:70px;

  border:none;

  border-radius:16px;

  background:#f4f4f4;

  font-size:30px;

  cursor:pointer;

}

 

.upload-box{

  border:2px dashed #ccc;

  padding:30px;

  border-radius:20px;

  text-align:center;

  cursor:pointer;

  margin-bottom:20px;

}

.recent-images{

  display:grid;

  grid-template-columns:repeat(2,1fr);

  gap:10px;

}

.recent-images img{

  width:100%;

  border-radius:14px;

  cursor:pointer;

}

 

@media(max-width:768px){

  .left-panel,
  .right-panel{
    display:none;
  }

  .top-toolbar{

    left:70px;
    right:0;

    overflow:auto;

  }

  .top-title{
    font-size:18px;
  }

}
 

.mobile-panel{
  display:none;
}

@media(max-width:768px){

  body{
    overflow:hidden;
  }

  .editor{
    flex-direction:column;
  }

   

  .left-icons{

    position:fixed;

    bottom:0;

    left:0;

    width:100%;

    height:75px;

    flex-direction:row;

    justify-content:flex-start;

    overflow-x:auto;

    gap:12px;

    padding:10px;

    border-right:none;

    border-top:1px solid #ddd;

    z-index:99999;

    background:#fff;

  }

  .left-icons button{

    min-width:55px;

    height:55px;

    border-radius:16px;

    font-size:24px;

    flex:none;

  }

   

  .left-panel{

    position:fixed;

    left:0;

    right:0;

    bottom:75px;

    width:100%;

    height:260px;

    z-index:9999;

    border-radius:20px 20px 0 0;

    display:none;

    overflow:auto;

    box-shadow:
    0 -5px 30px rgba(0,0,0,.15);

  }

  .left-panel.show{
    display:block;
  }

   

  .right-panel{
    display:none;
  }

   

.top-toolbar{

    position:fixed;

    left:0;

    right:0;

    bottom:335px;

    top:auto;

    height:auto;

    padding:12px;

    overflow-x:auto;

    white-space:nowrap;

    display:none;

    gap:10px;

    border-top:1px solid #ddd;

    box-shadow:
    0 -5px 20px rgba(0,0,0,.1);

  }

  .top-toolbar.show{
    display:flex;
  }


  .top-toolbar input,
  .top-toolbar select,
  .toolbar-btn{

    flex:none;

  }

   

  .canvas-area{

    padding-top:10px;

    padding-bottom:170px;

    overflow:auto;

  }

  .canvas-wrapper{

    width:100%;

    margin:10px;

  }

  canvas{

    width:100% !important;

    height:auto !important;

  }

}

</style>
</head>
<body>



<div
class="top-title"
id="topLiveTitle"
>
Title Name
</div>

<div class="editor">

  

  <div class="left-icons">

  <button
onclick="toggleTextTools()"
>
  🅣
</button>

    <button
    onclick="openPanel('shapePanel')"
    >
      ⬜
    </button>

    <button
    onclick="openPanel('imagePanel')"
    >
      🖼️
    </button>

    <button
    onclick="openPanel('toolPanel')"
    >
      ✏️
    </button>

  </div>

  

  <div class="left-panel">

    

    <div
    class="panel active"
    id="textPanel"
    >

      <h2>Add Text</h2>

      <div
      class="text-style"
      onclick="addText('Heading Text',50)"
      >
        Heading
      </div>

      <div
      class="text-style"
      onclick="addText('Sub Heading',32)"
      >
        Sub Heading
      </div>

      <div
      class="text-style neon"
      onclick="addNeonText()"
      >
        Neon Text
      </div>

    </div>

    

    <div
    class="panel"
    id="shapePanel"
    >

      <h2>Shapes</h2>

      <div class="shape-grid">

        <button
        class="shape-btn"
        onclick="addRect()"
        >
          ▭
        </button>

        <button
        class="shape-btn"
        onclick="addCircle()"
        >
          ◯
        </button>

        <button
        class="shape-btn"
        onclick="addTriangle()"
        >
          △
        </button>

      </div>

    </div>

    

    <div
    class="panel"
    id="imagePanel"
    >

      <h2>Images</h2>

      <div
      class="upload-box"
      onclick="imageUpload.click()"
      >
        Upload Image
      </div>

      <input
      type="file"
      id="imageUpload"
      hidden
      accept="image/*"
      >

      <h3 style="margin-bottom:10px;">
        Recent Images
      </h3>

      <div
      class="recent-images"
      id="recentImages"
      ></div>

    </div>

    

    <div
    class="panel"
    id="toolPanel"
    >

      <h2>Tools</h2>

      <button
      class="export-btn"
      onclick="enableDrawing()"
      >
        Pencil
      </button>

      <button
      class="export-btn"
      onclick="disableDrawing()"
      >
        Select
      </button>

    </div>

  </div>

  

  <div style="flex:1; display:flex; flex-direction:column;">

    

    <div class="top-toolbar">

      <select id="fontFamily">

        <option>Poppins</option>
        <option>Arial</option>
        <option>Impact</option>

      </select>

      <input
      type="number"
      id="fontSize"
      value="36"
      min="10"
      max="200"
      >

      <input
      type="color"
      id="fontColor"
      value="#7c1414"
      >

      <button
      class="toolbar-btn"
      onclick="makeBold()"
      >
        Bold
      </button>

      <button
      class="toolbar-btn"
      onclick="alignLeft()"
      >
        Left
      </button>

      <button
      class="toolbar-btn"
      onclick="alignCenter()"
      >
        Center
      </button>

      <button
      class="toolbar-btn"
      onclick="alignRight()"
      >
        Right
      </button>

    </div>

    

    <div class="canvas-area">

      <div class="canvas-wrapper">

        <canvas
        id="canvas"
        width="794"
        height="1123"
        ></canvas>

      </div>

    </div>

  </div>

  

  <div class="right-panel">

    <h2>Project Title</h2>

    <input
    type="text"
    id="projectTitle"
    value="Title Name"
    style="
    width:100%;
    height:50px;
    padding:10px;
    border-radius:14px;
    border:2px solid #ddd;
    margin-bottom:20px;
    font-size:18px;
    font-weight:700;
    "
    >

    <h2>Export</h2>

    <button
    class="export-btn"
    onclick="downloadPNG()"
    >
      Download PNG
    </button>

    <button
    class="export-btn"
    onclick="downloadJPG()"
    >
      Download JPG
    </button>

    <button
    class="export-btn"
    onclick="printCanvas()"
    >
      Print
    </button>

    <button
    class="export-btn"
    onclick="downloadPDF()"
    >
      Download PDF
    </button>

    <h2 style="margin-top:30px;">
      Canvas Size
    </h2>

    <select
    id="canvasSize"
    style="
    width:100%;
    height:50px;
    border-radius:14px;
    padding:10px;
    "
    >

      <option value="794x1123">
        A4
      </option>

      <option value="1080x1080">
        Instagram Post
      </option>

      <option value="1920x1080">
        YouTube Thumbnail
      </option>

    </select>

  </div>

</div>

<script>




const canvas =
new fabric.Canvas(
  "canvas",
  {
    preserveObjectStacking:true
  }
);



function openPanel(id){

  document
  .querySelectorAll(".panel")
  .forEach(panel=>{

    panel.classList.remove("active");

  });

  document
  .getElementById(id)
  .classList.add("active");

   

  if(window.innerWidth <= 768){

    document
    .querySelector(".left-panel")
    .classList.add("show");

  }
  document.addEventListener("click",function(e){

  if(window.innerWidth > 768) return;

  const panel =
  document.querySelector(".left-panel");

  const icons =
  document.querySelector(".left-icons");

  const toolbar =
  document.querySelector(".top-toolbar");

  if(
    !panel.contains(e.target)
    &&
    !icons.contains(e.target)
    &&
    !toolbar.contains(e.target)
  ){

    panel.classList.remove("show");

    toolbar.classList.remove("show");

  }

});

}




function addText(text,size){

  const textbox =
  new fabric.Textbox(
    text,
    {

      left:100,
      top:100,

      fontSize:size,

      fontFamily:'Poppins',

      fill:'#000',

      fontWeight:'700'

    }
  );

  canvas.add(textbox);

  canvas.setActiveObject(textbox);

}

function addNeonText(){

  const text =
  new fabric.Textbox(
    "NEON TXT",
    {

      left:150,
      top:150,

      fontSize:40,

      fill:'#00ffff',

      shadow:'0 0 20px #00ffff',

      fontWeight:'900'

    }
  );

  canvas.add(text);

}




function addRect(){

  const rect =
  new fabric.Rect({

    left:100,
    top:100,

    width:300,
    height:120,

    fill:'#7c1414',

    rx:20,
    ry:20

  });

  canvas.add(rect);

}

function addCircle(){

  const circle =
  new fabric.Circle({

    left:100,
    top:100,

    radius:80,

    fill:'#0a9b32'

  });

  canvas.add(circle);

}

function addTriangle(){

  const triangle =
  new fabric.Triangle({

    left:100,
    top:100,

    width:150,
    height:150,

    fill:'#ff9900'

  });

  canvas.add(triangle);

}




const imageUpload =
document.getElementById(
  "imageUpload"
);

imageUpload.addEventListener(
  "change",
  function(e){

    const file =
    e.target.files[0];

    if(!file) return;

    const reader =
    new FileReader();

    reader.onload =
    function(f){

      fabric.Image.fromURL(
        f.target.result,
        function(img){

          img.set({

            left:50,
            top:50

          });

          img.scaleToWidth(400);

          canvas.add(img);

          saveRecentImage(
            f.target.result
          );

        }
      );

    };

    reader.readAsDataURL(file);

  }
);




function saveRecentImage(src){

  let images =
  JSON.parse(
    localStorage.getItem(
      "recentImages"
    ) || "[]"
  );

  images.unshift(src);

  images =
  images.slice(0,6);

  localStorage.setItem(
    "recentImages",
    JSON.stringify(images)
  );

  loadRecentImages();

}

function loadRecentImages(){

  const container =
  document.getElementById(
    "recentImages"
  );

  container.innerHTML = "";

  let images =
  JSON.parse(
    localStorage.getItem(
      "recentImages"
    ) || "[]"
  );

  images.forEach(src=>{

    const img =
    document.createElement("img");

    img.src = src;

    img.onclick = ()=>{

      fabric.Image.fromURL(
        src,
        function(image){

          image.set({

            left:100,
            top:100

          });

          image.scaleToWidth(300);

          canvas.add(image);

        }
      );

    };

    container.appendChild(img);

  });

}

loadRecentImages();




function enableDrawing(){

  canvas.isDrawingMode = true;

}

function disableDrawing(){

  canvas.isDrawingMode = false;

}




document
.getElementById("fontSize")
.addEventListener(
  "input",
  function(){

    const obj =
    canvas.getActiveObject();

    if(obj){

      obj.set(
        "fontSize",
        parseInt(this.value)
      );

      canvas.renderAll();

    }

  }
);

document
.getElementById("fontColor")
.addEventListener(
  "input",
  function(){

    const obj =
    canvas.getActiveObject();

    if(obj){

      obj.set(
        "fill",
        this.value
      );

      canvas.renderAll();

    }

  }
);

document
.getElementById("fontFamily")
.addEventListener(
  "change",
  function(){

    const obj =
    canvas.getActiveObject();

    if(obj){

      obj.set(
        "fontFamily",
        this.value
      );

      canvas.renderAll();

    }

  }
);

function makeBold(){

  const obj =
  canvas.getActiveObject();

  if(obj){

    obj.set(
      "fontWeight",
      obj.fontWeight === 'bold'
      ? 'normal'
      : 'bold'
    );

    canvas.renderAll();

  }

}

function alignLeft(){

  const obj =
  canvas.getActiveObject();

  if(obj){

    obj.set(
      "textAlign",
      "left"
    );

    canvas.renderAll();

  }

}

function alignCenter(){

  const obj =
  canvas.getActiveObject();

  if(obj){

    obj.set(
      "textAlign",
      "center"
    );

    canvas.renderAll();

  }

}

function alignRight(){

  const obj =
  canvas.getActiveObject();

  if(obj){

    obj.set(
      "textAlign",
      "right"
    );

    canvas.renderAll();

  }

}




const projectTitle =
document.getElementById(
  "projectTitle"
);

const topLiveTitle =
document.getElementById(
  "topLiveTitle"
);

projectTitle.addEventListener(
  "input",
  function(){

    topLiveTitle.innerHTML =
    this.value;

    localStorage.setItem(
      "project_title",
      this.value
    );

  }
);

 

const savedTitle =
localStorage.getItem(
  "project_title"
);

if(savedTitle){

  projectTitle.value =
  savedTitle;

  topLiveTitle.innerHTML =
  savedTitle;

}




function downloadPNG(){

  const fileName =
  (
    projectTitle.value ||
    "poster"
  ).trim();

  const link =
  document.createElement("a");

  link.download =
  fileName + ".png";

  link.href =
  canvas.toDataURL({
    format:'png',
    quality:1
  });

  link.click();

}

function downloadJPG(){

  const fileName =
  (
    projectTitle.value ||
    "poster"
  ).trim();

  const link =
  document.createElement("a");

  link.download =
  fileName + ".jpg";

  link.href =
  canvas.toDataURL({
    format:'jpeg',
    quality:1
  });

  link.click();

}

function printCanvas(){

  const data =
  canvas.toDataURL();

  const win =
  window.open("");

  win.document.write(`
    <img
    src="${data}"
    style="width:100%;"
    onload="window.print();"
    >
  `);

}

function downloadPDF(){

  alert(
    "Add jsPDF library for real PDF export"
  );

}




document
.getElementById("canvasSize")
.addEventListener(
  "change",
  function(){

    const size =
    this.value.split("x");

    canvas.setWidth(
      parseInt(size[0])
    );

    canvas.setHeight(
      parseInt(size[1])
    );

    canvas.renderAll();

  }
);




const params =
new URLSearchParams(
  window.location.search
);

const imageURL =
params.get("img");

const titleURL =
params.get("tittle");

 

if(titleURL){

  const decodedTitle =
  decodeURIComponent(
    titleURL
  );

  projectTitle.value =
  decodedTitle;

  topLiveTitle.innerHTML =
  decodedTitle;

}

 

if(imageURL){

  const decodedImage =
  decodeURIComponent(
    imageURL
  );

  fabric.Image.fromURL(

    decodedImage +

    (
      decodedImage.includes("?")
      ? "&"
      : "?"
    ) +

    "t=" + Date.now(),

    function(img){

      const canvasWidth =
      canvas.getWidth();

      img.scaleToWidth(
        canvasWidth
      );

      img.set({

        left:0,
        top:0,

        selectable:true

      });

      canvas.add(img);

      canvas.sendToBack(img);

       

      const footer =
      new fabric.Rect({

        left:0,

        top:
        img.getScaledHeight() - 30,

        width:
        canvas.getWidth(),

        height:120,

        fill:'#7c1414',

        selectable:true

      });

      canvas.add(footer);

      footer.sendToBack();

      canvas.renderAll();

    },

    {

      crossOrigin:'anonymous'

    }

  );

}

</script>
<script>
  function toggleTextTools(){

  openPanel("textPanel");

  if(window.innerWidth <= 768){

    document
    .querySelector(".top-toolbar")
    .classList.toggle("show");

  }
  

}
</script>

</body>
</html>
