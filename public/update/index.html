<script>
function updateDateTime() {

    const now = new Date();

    const day = String(now.getDate()).padStart(2, '0');
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const year = now.getFullYear();

    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const seconds = String(now.getSeconds()).padStart(2, '0');

    document.getElementById("dateTime").textContent =
        `${day}-${month}-${year} ${hours}:${minutes}:${seconds}`;
}

updateDateTime();
setInterval(updateDateTime, 1000);
</script>

            : 'light'
    );
});

    <div class="yp-feed-container">
        
        <div id="ypFilterHeader" class="yp-filter-header">
            <button class="yp-back-btn" id="ypBackBtn">&#8592; Back</button>
            <div class="yp-filter-title" id="ypFilterLabel">Filtered Feed</div>
        </div>

        
        <div id="ypPostFeed"></div>

        
        <div id="ypLoadingSkeletons"></div>

        
        <div id="ypScrollSentinel" style="height: 20px;"></div>
    </div>

    <script>
        

        const API_URL = "https://yojnaportals.com/wp-json/yp-social/v1/feed";

        const FeedApp = {
            state: {
                page: 1,
                per_page: 3,
                loading: false,
                hasMore: true,
                sender: '',
                hashtag: '',
                renderedIds: new Set(),
                targetPostId: null
            },

            init() {
                this.parseHashNavigation();
                this.bindGlobalEvents();
                this.setupIntersectionObserver();
                this.loadBatch();
            },

            parseHashNavigation() {
                const hash = window.location.hash;
                if (hash.startsWith('#post-')) {
                    this.state.targetPostId = parseInt(hash.replace('#post-', ''), 10);
                }
            },

            bindGlobalEvents() {
                window.addEventListener('hashchange', () => {
                    const oldTarget = this.state.targetPostId;
                    this.parseHashNavigation();
                    if (this.state.targetPostId && this.state.targetPostId !== oldTarget) {
                        this.locateAndFocusPost(this.state.targetPostId);
                    }
                });

                document.getElementById('ypBackBtn').addEventListener('click', () => {
                    this.state.sender = '';
                    this.state.hashtag = '';
                    document.getElementById('ypFilterHeader').classList.remove('active');
                    this.resetAndReload();
                });

                document.addEventListener('click', (e) => {
                    if (!e.target.closest('.yp-menu-trigger') && !e.target.closest('.yp-dropdown')) {
                        document.querySelectorAll('.yp-dropdown').forEach(d => d.classList.remove('show'));
                    }
                });
            },

           setupIntersectionObserver() {
                const sentinel = document.getElementById('ypScrollSentinel');
                const observer = new IntersectionObserver((entries) => {
                    if (entries[0].isIntersecting && !this.state.loading && this.state.hasMore) {
                        this.loadBatch();
                    }
                }, { rootMargin: '400px' });
                observer.observe(sentinel);

                
                window.addEventListener('scroll', () => {
                    if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
                        if (!this.state.loading && this.state.hasMore) {
                            this.loadBatch();
                        }
                    }
                }, { passive: true });
            },

            async loadBatch() {
                if (this.state.loading || !this.state.hasMore) return;
                this.state.loading = true;
                this.renderSkeletons(true);

                try {
                    const endpoint = new URL(API_URL);
                    endpoint.searchParams.set('page', this.state.page);
                    endpoint.searchParams.set('per_page', this.state.per_page);
                    if (this.state.sender) endpoint.searchParams.set('sender', this.state.sender);
                    if (this.state.hashtag) endpoint.searchParams.set('hashtag', this.state.hashtag);

                    const res = await fetch(endpoint.toString(), {
                        method: 'GET',
                        headers: { 'Accept': 'application/json' }
                    });

                    if (!res.ok) throw new Error(`HTTP Error ${res.status}`);

                    const data = await res.json();
                    this.renderSkeletons(false);

                    if (data.items && data.items.length > 0) {
                        data.items.forEach(item => this.renderPostCard(item));
                        this.state.page++;
                        this.state.hasMore = data.has_more;

                        if (this.state.targetPostId) {
                            const found = document.getElementById(`post-${this.state.targetPostId}`);
                            if (found) {
                                this.locateAndFocusPost(this.state.targetPostId);
                                this.state.targetPostId = null;
                            } else if (this.state.hasMore) {
                                this.state.loading = false;
                                this.loadBatch();
                                return;
                            }
                        }

                        
                        if (this.state.hasMore && document.body.offsetHeight <= window.innerHeight) {
                            this.state.loading = false;
                            this.loadBatch();
                        }
                    } else {
                        this.state.hasMore = false;
                        if (this.state.page === 1) {
                            document.getElementById('ypPostFeed').innerHTML = '<div class="yp-msg-alert">No posts found in this feed.</div>';
                        }
                    }
                } catch (err) {
                    this.renderSkeletons(false);
                    document.getElementById('ypPostFeed').innerHTML = `<div class="yp-msg-alert">Failed loading content: ${err.message}</div>`;
                } finally {
                    this.state.loading = false;
                }
            },

            resetAndReload() {
                this.state.page = 1;
                this.state.hasMore = true;
                this.state.renderedIds.clear();
                document.getElementById('ypPostFeed').innerHTML = '';
                this.loadBatch();
            },

            filterBySender(senderId, senderName) {
                this.state.sender = senderId;
                this.state.hashtag = '';
                document.getElementById('ypFilterLabel').textContent = `Posts by ${senderName}`;
                document.getElementById('ypFilterHeader').classList.add('active');
                this.resetAndReload();
            },

            filterByHashtag(tag) {
                this.state.hashtag = tag;
                this.state.sender = '';
                document.getElementById('ypFilterLabel').textContent = `Hashtag: #${tag}`;
                document.getElementById('ypFilterHeader').classList.add('active');
                this.resetAndReload();
            },

            async loadBatch() {
                if (this.state.loading) return;
                this.state.loading = true;
                this.renderSkeletons(true);

                try {
                    const endpoint = new URL(API_URL);
                    endpoint.searchParams.set('page', this.state.page);
                    endpoint.searchParams.set('per_page', this.state.per_page);
                    if (this.state.sender) endpoint.searchParams.set('sender', this.state.sender);
                    if (this.state.hashtag) endpoint.searchParams.set('hashtag', this.state.hashtag);

                    const res = await fetch(endpoint.toString(), {
                        method: 'GET',
                        headers: { 'Accept': 'application/json' }
                    });

                    if (!res.ok) throw new Error(`HTTP Error ${res.status}`);

                    const data = await res.json();
                    this.renderSkeletons(false);

                    if (data.items && data.items.length > 0) {
                        data.items.forEach(item => this.renderPostCard(item));
                        this.state.page++;
                        this.state.hasMore = data.has_more;

                        if (this.state.targetPostId) {
                            const found = document.getElementById(`post-${this.state.targetPostId}`);
                            if (found) {
                                this.locateAndFocusPost(this.state.targetPostId);
                                this.state.targetPostId = null;
                            } else if (this.state.hasMore) {
                                this.state.loading = false;
                                this.loadBatch();
                                return;
                            }
                        }
                    } else {
                        this.state.hasMore = false;
                        if (this.state.page === 1) {
                            document.getElementById('ypPostFeed').innerHTML = '<div class="yp-msg-alert">No posts found in this feed.</div>';
                        }
                    }
                } catch (err) {
                    this.renderSkeletons(false);
                    document.getElementById('ypPostFeed').innerHTML = `<div class="yp-msg-alert">Failed loading content: ${err.message}</div>`;
                } finally {
                    this.state.loading = false;
                }
            },

            renderSkeletons(show) {
                const holder = document.getElementById('ypLoadingSkeletons');
                if (!show) {
                    holder.innerHTML = '';
                    return;
                }
                let html = '';
                for (let i = 0; i < 2; i++) {
                    html += `
                        <div class="yp-skeleton yp-anim-pulse">
                            <div class="yp-sk-head">
                                <div class="yp-sk-avatar"></div>
                                <div class="yp-sk-lines">
                                    <div class="yp-sk-line" style="width: 40%;"></div>
                                    <div class="yp-sk-line" style="width: 25%;"></div>
                                </div>
                            </div>
                            <div class="yp-sk-line" style="width: 90%;"></div>
                            <div class="yp-sk-line" style="width: 70%;"></div>
                            <div class="yp-sk-media"></div>
                        </div>
                    `;
                }
                holder.innerHTML = html;
            },

            renderPostCard(post) {
                if (this.state.renderedIds.has(post.id)) return;
                this.state.renderedIds.add(post.id);

                const card = document.createElement('article');
                card.className = 'yp-card';
                card.id = `post-${post.id}`;

                const formattedText = this.formatWhatsAppText(post.content || '');
                const timeAgo = this.formatTimeAgo(post.publish_at);

                card.innerHTML = `
                    <div class="yp-header">
                        <img class="yp-avatar" src="${post.sender_logo || 'data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'40\' height=\'40\' fill=\'%23ccc\'><rect width=\'40\' height=\'40\'/></svg>'}" alt="${post.sender}" data-sender-id="${post.sender_id}" data-sender-name="${post.sender}" />
                        <div class="yp-meta">
                            <span class="yp-sender-name" data-sender-id="${post.sender_id}" data-sender-name="${post.sender}">${post.sender}</span>
                            <span class="yp-time">${timeAgo}</span>
                        </div>
                        <button class="yp-menu-trigger" aria-label="Menu">&#8942;</button>
                        <div class="yp-dropdown">
                            ${post.type === 'image' && post.image_download_allowed ? `<button class="yp-dl-img-btn" data-id="${post.id}">📥 Download Image</button>` : ''}
                            <button class="yp-copy-text-btn">📋 Copy Text</button>
                            <button class="yp-copy-link-btn" data-id="${post.id}">🔗 Copy Post Link</button>
                            <button class="yp-smart-share-btn" data-id="${post.id}">↗ Share Post</button>
                        </div>
                    </div>

                    <div class="yp-body">
                        ${post.title ? `<div class="yp-post-title">${this.escapeHTML(post.title)}</div>` : ''}
                        <div class="yp-content-text collapsed">${formattedText}</div>
                        <button class="yp-toggle-expand" style="display:none;">More</button>
                    </div>

                    ${this.renderMedia(post)}
                    ${this.renderPoll(post)}

                    ${post.link_url ? `
                        <div class="yp-details-bar">
                            <a href="${encodeURI(post.link_url)}" target="_blank" rel="noopener noreferrer" class="yp-details-btn">🔗 Complete Details</a>
                        </div>
                    ` : ''}

                    <div class="yp-actions">
                        <div class="yp-action-group">
                            <button class="yp-action-btn yp-like-btn" data-id="${post.id}">
                                <span>❤️</span> <span class="yp-like-count">${post.likes}</span>
                            </button>
                            <div class="yp-action-static" title="Total Views">
                                <span>👁️</span> <span class="yp-view-count">${post.views}</span>
                            </div>
                        </div>
                        <button class="yp-action-btn yp-smart-share-btn" data-id="${post.id}" title="Share Post">
                            <span>↪️</span> <span class="yp-share-count">${post.shares || 0}</span>
                        </button>
                    </div>
                `;

                this.attachCardInteractions(card, post);
                document.getElementById('ypPostFeed').appendChild(card);
                this.recordViewCounter(post.id, card);
            },

            renderMedia(post) {
                if (post.type === 'image' && post.image_url) {
                    return `
                        <div class="yp-media-box">
                            <img class="yp-zoomable-img" src="${encodeURI(post.image_url)}" alt="Post Image" loading="lazy" />
                            <div class="yp-floating-heart">❤️</div>
                        </div>
                    `;
                }

                if (post.type === 'video' && post.video_url) {
                    const embed = this.getVideoEmbedUrl(post.video_url);
                    if (embed.type === 'iframe') {
                        return `<div class="yp-media-box"><iframe src="${embed.url}" allowfullscreen loading="lazy"></iframe></div>`;
                    }
                    if (embed.type === 'video') {
                        return `<div class="yp-media-box"><video src="${embed.url}" controls playsinline preload="metadata"></video></div>`;
                    }
                }
                return '';
            },

            renderPoll(post) {
                if (post.type !== 'poll' || !post.poll_data || !post.poll_data.options) return '';
                const opts = post.poll_data.options;
                const totalVotes = opts.reduce((acc, cur) => acc + (parseInt(cur.votes, 10) || 0), 0);
                const hasVoted = Boolean(localStorage.getItem(`yp_voted_${post.id}`));

                let optionsHTML = '';
                opts.forEach((opt) => {
                    const votes = parseInt(opt.votes, 10) || 0;
                    const pct = totalVotes > 0 ? Math.round((votes / totalVotes) * 100) : 0;
                    optionsHTML += `
                        <div class="yp-poll-item ${hasVoted ? 'voted' : ''}" data-post-id="${post.id}" data-opt-id="${opt.id}">
                            ${hasVoted ? `<div class="yp-poll-progress" style="width: ${pct}%"></div>` : ''}
                            <span class="yp-poll-label">${this.escapeHTML(opt.text)}</span>
                            ${hasVoted ? `<span class="yp-poll-meta">${pct}% (${votes})</span>` : ''}
                        </div>
                    `;
                });

                return `
                    <div class="yp-poll-box" id="poll-${post.id}">
                        <div class="yp-poll-q">${this.escapeHTML(post.poll_data.question)}</div>
                        <div class="yp-poll-options">${optionsHTML}</div>
                    </div>
                `;
            },

            attachCardInteractions(card, post) {
                const bodyText = card.querySelector('.yp-content-text');
                const moreBtn = card.querySelector('.yp-toggle-expand');

                if (bodyText.scrollHeight > bodyText.clientHeight + 5 || (post.content && post.content.includes('\n'))) {
                    moreBtn.style.display = 'block';
                }

                const toggleExpand = () => {
                    const isCollapsed = bodyText.classList.toggle('collapsed');
                    moreBtn.textContent = isCollapsed ? 'More' : 'Minimize';
                };

                bodyText.addEventListener('click', toggleExpand);
                moreBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleExpand(); });

                card.querySelectorAll('[data-sender-id]').forEach(el => {
                    el.addEventListener('click', () => {
                        this.filterBySender(el.dataset.senderId, el.dataset.senderName);
                    });
                });

                card.querySelectorAll('.yp-hashtag').forEach(tag => {
                    tag.addEventListener('click', (e) => {
                        e.preventDefault();
                        this.filterByHashtag(tag.dataset.tag);
                    });
                });

                const menuBtn = card.querySelector('.yp-menu-trigger');
                const drop = card.querySelector('.yp-dropdown');
                menuBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    document.querySelectorAll('.yp-dropdown').forEach(d => { if (d !== drop) d.classList.remove('show'); });
                    drop.classList.toggle('show');
                });

                const mediaBox = card.querySelector('.yp-media-box');
                if (mediaBox && post.type === 'image') {
                    let lastTap = 0;
                    mediaBox.addEventListener('pointerdown', (e) => {
                        const now = Date.now();
                        if (now - lastTap < 300) {
                            this.handleLike(post.id, card);
                            const heart = mediaBox.querySelector('.yp-floating-heart');
                            heart.classList.add('animate');
                            setTimeout(() => heart.classList.remove('animate'), 700);
                        }
                        lastTap = now;
                    });
                }

                card.querySelector('.yp-like-btn').addEventListener('click', () => this.handleLike(post.id, card));

                card.querySelectorAll('.yp-poll-item:not(.voted)').forEach(item => {
                    item.addEventListener('click', async () => {
                        const optId = item.dataset.optId;
                        await this.submitPollVote(post.id, optId, card);
                    });
                });

                card.querySelector('.yp-copy-text-btn').addEventListener('click', () => {
                    const txt = this.extractPureText(post);
                    navigator.clipboard.writeText(txt).then(() => alert('Post text copied!'));
                });

                card.querySelector('.yp-copy-link-btn').addEventListener('click', () => {
                    const exactUrl = `${window.location.origin}${window.location.pathname}#post-${post.id}`;
                    navigator.clipboard.writeText(exactUrl).then(() => alert('Exact post link copied!'));
                });

                const dlBtn = card.querySelector('.yp-dl-img-btn');
                if (dlBtn) {
                    dlBtn.addEventListener('click', () => {
                        window.location.href = `${API_URL.replace('/feed', '/image-proxy')}?post_id=${post.id}`;
                    });
                }

                
                card.querySelectorAll('.yp-smart-share-btn').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        await this.executeSmartShare(post, card);
                    });
                });
            },

            async executeSmartShare(post, card) {
                const text = this.extractPureText(post);
                const exactUrl = `${window.location.origin}${window.location.pathname}#post-${post.id}`;
                const shareText = `${text}\n\n🔗 Link: ${exactUrl}`;
                let fileToShare = null;

                try {
                    
                    if (post.type === 'image' && post.image_url && post.image_download_allowed) {
                        const proxyUrl = `${API_URL.replace('/feed', '/image-proxy')}?post_id=${post.id}`;
                        const imgRes = await fetch(proxyUrl);
                        const blob = await imgRes.blob();
                        fileToShare = new File([blob], `post-${post.id}.jpg`, { type: blob.type || 'image/jpeg' });
                    }
                    
                    else if (post.type === 'poll' && post.poll_data) {
                        const pollBlob = await this.generatePollImageBlob(post);
                        if (pollBlob) {
                            fileToShare = new File([pollBlob], `poll-${post.id}.png`, { type: 'image/png' });
                        }
                    }

                    if (navigator.canShare && fileToShare && navigator.canShare({ files: [fileToShare] })) {
                        await navigator.share({
                            title: post.title || 'Social Update',
                            text: shareText,
                            files: [fileToShare]
                        });
                    } else if (navigator.share) {
                        await navigator.share({
                            title: post.title || 'Social Update',
                            text: shareText
                        });
                    } else {
                        await navigator.clipboard.writeText(shareText);
                        alert('Details copied to clipboard!');
                    }

                    
                    this.recordShareCounter(post.id, card);
                } catch (e) {
                    console.log('Share dismissed or cancelled', e);
                }
            },

            generatePollImageBlob(post) {
                return new Promise((resolve) => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 600;
                    const opts = (post.poll_data && post.poll_data.options) ? post.poll_data.options : [];
                    canvas.height = 200 + (opts.length * 60);
                    const ctx = canvas.getContext('2d');

                    
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    
                    ctx.fillStyle = '#1877f2';
                    ctx.fillRect(0, 0, canvas.width, 10);

                    
                    ctx.fillStyle = '#65676b';
                    ctx.font = 'bold 15px -apple-system, sans-serif';
                    ctx.fillText((post.sender || 'Yojna Portal').toUpperCase() + ' POLL', 30, 42);

                    
                    ctx.fillStyle = '#050505';
                    ctx.font = 'bold 20px -apple-system, sans-serif';
                    const qText = (post.poll_data.question || 'Poll Question').substring(0, 75);
                    ctx.fillText(qText, 30, 80);

                    
                    let startY = 110;
                    opts.forEach((opt, idx) => {
                        ctx.fillStyle = '#f0f2f5';
                        if (ctx.roundRect) {
                            ctx.beginPath();
                            ctx.roundRect(30, startY, 540, 46, 8);
                            ctx.fill();
                        } else {
                            ctx.fillRect(30, startY, 540, 46);
                        }

                        ctx.fillStyle = '#050505';
                        ctx.font = '16px -apple-system, sans-serif';
                        const optText = `${idx + 1}. ${opt.text || ''}`.substring(0, 55);
                        ctx.fillText(optText, 45, startY + 28);
                        startY += 58;
                    });

                    
                    ctx.fillStyle = '#65676b';
                    ctx.font = '13px -apple-system, sans-serif';
                    ctx.fillText('Tap or open link to cast your vote live.', 30, startY + 25);

                    canvas.toBlob((blob) => resolve(blob), 'image/png');
                });
            },

            async recordViewCounter(postId, card) {
                const endpoint = `${API_URL.replace('/feed', '/view')}/${postId}`;
                try {
                    const res = await fetch(endpoint, { method: 'POST' });
                    const data = await res.json();
                    if (data.success) {
                        const vSpan = card.querySelector('.yp-view-count');
                        if (vSpan) vSpan.textContent = data.views;
                    }
                } catch {}
            },

            async recordShareCounter(postId, card) {
                const endpoint = `${API_URL.replace('/feed', '/share')}/${postId}`;
                try {
                    const res = await fetch(endpoint, { method: 'POST' });
                    const data = await res.json();
                    if (data.success) {
                        const sSpan = card.querySelector('.yp-share-count');
                        if (sSpan) sSpan.textContent = data.shares;
                    }
                } catch {}
            },

            async handleLike(postId, card) {
                const btn = card.querySelector('.yp-like-btn');
                if (btn.classList.contains('liked')) return;

                btn.classList.add('liked');
                const countSpan = card.querySelector('.yp-like-count');
                countSpan.textContent = parseInt(countSpan.textContent, 10) + 1;

                const endpoint = `${API_URL.replace('/feed', '/like')}/${postId}`;
                try {
                    const res = await fetch(endpoint, { method: 'POST' });
                    const data = await res.json();
                    if (!data.success) {
                        countSpan.textContent = data.likes;
                    }
                } catch {
                    btn.classList.remove('liked');
                    countSpan.textContent = Math.max(0, parseInt(countSpan.textContent, 10) - 1);
                }
            },

            async submitPollVote(postId, optId, card) {
                const endpoint = `${API_URL.replace('/feed', '/vote')}/${postId}`;
                try {
                    const res = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ option_id: optId })
                    });
                    const data = await res.json();
                    if (data.success) {
                        localStorage.setItem(`yp_voted_${postId}`, optId);
                        const pollWrap = card.querySelector(`#poll-${postId}`);
                        pollWrap.outerHTML = this.renderPoll({ id: postId, type: 'poll', poll_data: data.poll_data });
                    }
                } catch {
                    alert('Vote registration error.');
                }
            },

            locateAndFocusPost(postId) {
                const el = document.getElementById(`post-${postId}`);
                if (el) {
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    el.classList.add('yp-highlight');
                    setTimeout(() => el.classList.remove('yp-highlight'), 2200);
                }
            },

            formatWhatsAppText(text) {
                let out = this.escapeHTML(text);
                out = out.replace(/\*([^\*]+)\*/g, '<strong>$1</strong>');
                out = out.replace(/_([^_]+)_/g, '<em>$1</em>');
                out = out.replace(/~([^~]+)~/g, '<del>$1</del>');
                out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
                out = out.replace(/#([\p{L}\p{N}_\-]+)/gu, (match, tag) => {
                    return `<span class="yp-hashtag" data-tag="${tag.toLowerCase()}">#${tag}</span>`;
                });
                out = out.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer" class="yp-url">$1</a>');
                return out;
            },

            extractPureText(post) {
                let base = '';
                if (post.title) base += `${post.title}\n\n`;
                if (post.content) base += `${post.content}\n`;
                if (post.type === 'poll' && post.poll_data) {
                    base += `\n📊 Poll: ${post.poll_data.question}\n`;
                    post.poll_data.options.forEach(o => { base += `▪ ${o.text}\n`; });
                }
                return base.trim();
            },

            getVideoEmbedUrl(url) {
                const ytMatch = url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?|shorts)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i);
                if (ytMatch) return { type: 'iframe', url: `https://www.youtube.com/embed/${ytMatch[1]}` };
                const vimeoMatch = url.match(/vimeo\.com\/(?:channels\/(?:\\w+\/)?|groups\/([^\\/]*)\/videos\/|album\/(\d+)\/video\/|)(\d+)(?:$|\/|\?)/);
                if (vimeoMatch) return { type: 'iframe', url: `https://player.vimeo.com/video/${vimeoMatch[3]}` };
                return { type: 'video', url: url };
            },

            formatTimeAgo(isoString) {
                const date = new Date(isoString);
                const seconds = Math.floor((new Date() - date) / 1000);
                if (seconds < 60) return 'Just now';
                const m = Math.floor(seconds / 60);
                if (m < 60) return `${m}m ago`;
                const h = Math.floor(m / 60);
                if (h < 24) return `${h}h ago`;
                const d = Math.floor(h / 24);
                if (d < 30) return `${d}d ago`;
                return date.toLocaleDateString();
            },

            escapeHTML(str) {
                return str.replace(/[&<>'"]/g, tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag));
            }
        };

        document.addEventListener('DOMContentLoaded', () => FeedApp.init());
    </script>

<script>
function moveMenu(){

    const menu = document.getElementById("mainMenu");

    if(window.innerWidth <= 768){

        document
            .getElementById("menuFooter")
            .appendChild(menu);

    }else{

        document
            .getElementById("menuHeader")
            .appendChild(menu);

    }

    menu.style.display = "block";
}

moveMenu();

window.addEventListener("resize", moveMenu);
</script>
<script>
document.addEventListener("DOMContentLoaded", () => {

    const currentPath = window.location.pathname;

    document.querySelectorAll(".bottom-nav .nav-item")
    .forEach(link => {

        link.classList.remove("active");

        const linkPath = new URL(link.href).pathname;

        if(
            currentPath === linkPath ||
            (linkPath !== "/" && currentPath.startsWith(linkPath))
        ){
            link.classList.add("active");
        }

    });

});
</script>
