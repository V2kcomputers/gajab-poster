<script>
const socialLinks = [
    "https://yojnaportal.com/whatsapp",
    "https://yojnaportal.com/telegram",
    "https://yojnaportal.com/youtube",
    "https://yojnaportal.com/facebook",
    "https://yojnaportal.com/instagram",
    "https://yojnaportal.com/x"
];

const followBtn = document.getElementById("followLink");

function setRandomLink() {
    const randomLink =
        socialLinks[Math.floor(Math.random() * socialLinks.length)];

    followBtn.href = randomLink;
}

// Page load पर random link
setRandomLink();

// Click के बाद अगली बार के लिए नया random link
followBtn.addEventListener("click", function() {

    setTimeout(() => {
        setRandomLink();
    }, 100);

});
</script>
<script>
const menuBtn = document.getElementById("menuBtn");
const socialMenu = document.getElementById("socialMenu");

menuBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    socialMenu.classList.toggle("show");
});

document.addEventListener("click", () => {
    socialMenu.classList.remove("show");
});
</script>

<div class="channel-followers" id="dateTime"></div>

<script>
function updateDateTime() {

    const now = new Date();

    const day = String(now.getDate()).padStart(2, '0');
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const year = now.getFullYear();

    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const seconds = String(now.getSeconds()).padStart(2, '0');

    document.getElementById("dateTime").textContent =
        `${day}-${month}-${year} ${hours}:${minutes}:${seconds}`;
}

updateDateTime();
setInterval(updateDateTime, 1000);
</script>
<script>
const toggle = document.getElementById('themeToggle');

// Saved theme load
if(localStorage.getItem('theme') === 'dark'){
    document.body.classList.add('dark');
    toggle.checked = true;
}

toggle.addEventListener('change', () => {
    document.body.classList.toggle('dark');

    localStorage.setItem(
        'theme',
        document.body.classList.contains('dark')
            ? 'dark'
            : 'light'
    );
});
</script>
