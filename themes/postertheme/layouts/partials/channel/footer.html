<style>
    .bottom-nav{
    position:fixed;
    bottom:0;

    height:65px;

    background:var(--card-bg);
    border-top:1px solid var(--border);

    display:flex;

    z-index:9999;
}

.bottom-nav .nav-item{
    flex:1;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    color:var(--text);
    text-decoration:none;

    font-size:12px;
    gap:4px;

    transition:.3s;
}

.bottom-nav .nav-item i{
    font-size:22px;
}

.bottom-nav .nav-item:hover,
.bottom-nav .nav-item.active{
    color:var(--green);
}

body{
    padding-bottom:80px;
}

.bottom-nav{
    display:flex;
    justify-content:space-around;
    align-items:center;
    background:linear-gradient(180deg,var(--bg),var(--card-bg));
    border-top:none;
}

.nav-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    color:var(--bg);
    text-decoration:none;
    padding:12px;
}

.nav-item i{
    font-size:20px;
}
.nav-item{
    color:var(--text-light);
    transition:.3s;
    position:relative;
}

.nav-item.active{
    color:var(--green);
    font-weight:700;
}

.nav-item.active i{
    transform:scale(1.15);
}

.nav-item.active::after{
    content:"";
    position:absolute;
    bottom:-2px;
    left:50%;
    transform:translateX(-50%);
    width:24px;
    height:3px;
    background:var(--green);
    border-radius:20px;
}
/* Mobile */
@media (max-width:768px){

    #menuFooter .bottom-nav{
        position:fixed;
        bottom:0;
        left:0;
        width:100%;
        height:65px;
        z-index:9999;
        border-top:1px solid var(--border);
    }

    body{
        padding-bottom:75px;
    }
}

/* Desktop */
@media (min-width:769px){

    #menuHeader .bottom-nav{
        position:static;
        width:auto;
        border-radius:12px;
        padding:0 10px;
    }

    #menuHeader .nav-item{
        flex-direction:row;
    }
}
</style>
<script>
function moveMenu(){

    const menu = document.getElementById("mainMenu");

    if(window.innerWidth <= 768){

        document
            .getElementById("menuFooter")
            .appendChild(menu);

    }else{

        document
            .getElementById("menuHeader")
            .appendChild(menu);

    }

    menu.style.display = "block";
}

moveMenu();

window.addEventListener("resize", moveMenu);
</script>
<script>
document.addEventListener("DOMContentLoaded", () => {

    const currentPath = window.location.pathname;

    document.querySelectorAll(".bottom-nav .nav-item")
    .forEach(link => {

        link.classList.remove("active");

        const linkPath = new URL(link.href).pathname;

        if(
            currentPath === linkPath ||
            (linkPath !== "/" && currentPath.startsWith(linkPath))
        ){
            link.classList.add("active");
        }

    });

});
</script>
