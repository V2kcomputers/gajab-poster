<!-- ================= DESKTOP AD (Bottom-Right Floating) ================= -->
<div id="desktop-ad-wrapper" class="smart-ad-box" style="display:none;">
  <div class="ad-label">ADVERTISEMENT</div>
  <button type="button" class="ad-close-btn" aria-label="Close Ad" onclick="hideAd()">&times;</button>
  <iframe
   id="desktop-ad-iframe"
    src="https://cdn.yojnaportal.com/advertisement/adsterra/adsterra-300x250.html"
    width="300"
    height="250"
    frameborder="0"
    scrolling="no"
    style="border:0;display:block;overflow:hidden;">
</iframe>
</div>
<div id="mobile-ad-wrapper" class="smart-ad-box">
  <div class="ad-label">ADVERTISEMENT</div>
  <button type="button" class="ad-close-btn" aria-label="Close Ad" onclick="hideAd()">&times;</button>
  
  <iframe
   id="mobile-ad-iframe"
    src="https://cdn.yojnaportal.com/advertisement/adsterra/adsterra-320x50.html"
    width="320"
    height="50"
    frameborder="0"
    scrolling="no"
    style="border:0;display:block;overflow:hidden;">
</iframe>
</div>
