<!doctype html>
<html ⚡ lang="en">

<head>

<meta charset="utf-8">

<title>{{ .Title }}</title>

<link rel="canonical" href="{{ .Permalink }}">

<meta name="viewport"
content="width=device-width,minimum-scale=1,initial-scale=1">

<meta name="description"
content="{{ .Description }}">

<script async src="https://cdn.ampproject.org/v0.js"></script>

<script async
custom-element="amp-story"
src="https://cdn.ampproject.org/v0/amp-story-1.0.js">
</script>

<style amp-boilerplate>
body{
visibility:hidden;
}
</style>

<noscript>
<style amp-boilerplate>
body{
visibility:visible;
}
</style>
</noscript>

<style amp-custom>

body{
font-family:Arial,sans-serif;
}

/* Theme Colors */

:root{
    --primary:#0d6efd;
}

body.theme-green{
    --primary:#198754;
}

body.theme-red{
    --primary:#dc3545;
}

body.theme-orange{
    --primary:#fd7e14;
}

/* Overlay */

.overlay{
    width:100%;
    height:100%;
    background:linear-gradient(
        to bottom,
        rgba(0,0,0,.15),
        rgba(0,0,0,.75)
    );
}

/* Content */

.content{
    padding:40px;
    color:#fff;
}

.page-title{
    font-size:42px;
    font-weight:700;
    line-height:1.2;
    margin-bottom:15px;
}

.page-text{
    font-size:24px;
    line-height:1.5;
}

/* Button */

.cta{
    display:inline-block;
    background:var(--primary);
    color:#fff;
    text-decoration:none;
    padding:12px 20px;
    border-radius:10px;
    font-size:18px;
    font-weight:700;
    margin-top:20px;
}

</style>

</head>

<body class="theme-{{ .Params.theme }}">

<amp-story

standalone

title="{{ .Title }}"

publisher="YOJNA PORTAL"

publisher-logo-src="{{ .Params.logo }}"

poster-portrait-src="{{ .Params.cover }}">

{{ range $i, $slide := .Params.slides }}

<amp-story-page
id="page{{ add $i 1 }}"
auto-advance-after="5s">

<!-- Background -->

<amp-story-grid-layer template="fill">

<amp-img
src="{{ $slide.image }}"
width="1080"
height="1920"
layout="responsive"
animate-in="zoom-in">
</amp-img>

</amp-story-grid-layer>

<!-- Overlay -->

<amp-story-grid-layer template="fill">

<div class="overlay"></div>

</amp-story-grid-layer>

<!-- Content -->

<amp-story-grid-layer template="vertical">

<div class="content">

<div
class="page-title"
animate-in="{{ if $slide.animation }}{{ $slide.animation }}{{ else }}fly-in-bottom{{ end }}">

{{ $slide.title }}

</div>

<div
class="page-text"
animate-in="fade-in">

{{ $slide.text }}

</div>

</div>

</amp-story-grid-layer>

</amp-story-page>

{{ end }}

<!-- Last Page -->

<amp-story-page id="lastpage">

<amp-story-grid-layer template="fill">

<amp-img
src="{{ .Params.cover }}"
width="1080"
height="1920"
layout="responsive">
</amp-img>

</amp-story-grid-layer>

<amp-story-grid-layer template="fill">

<div class="overlay"></div>

</amp-story-grid-layer>

<amp-story-grid-layer template="vertical">

<div class="content">

<h1 animate-in="pulse">
{{ .Title }}
</h1>

<p animate-in="fade-in">
Visit: www.yojnaportal.com
</p>

<a
class="cta"
href="https://www.yojnaportal.com">

Read Full Details

</a>

</div>

</amp-story-grid-layer>

</amp-story-page>

</amp-story>

</body>

</html>
