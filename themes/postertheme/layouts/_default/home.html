<script nonce="NjYyMjgzMjkzLDQwNjE2MTI3NTM=">


function formatPostTime(unixTimestamp){


    const now = Date.now();
    const postTime = unixTimestamp * 1000;


    const diffMinutes =
        Math.floor((now - postTime) / 60000);


    const diffHours =
        Math.floor(diffMinutes / 60);


    if(diffMinutes < 2){
        return "Just now";
    }


    if(diffMinutes < 60){
        return `${diffMinutes} minutes ago`;
    }


    if(diffHours < 24){
        return diffHours === 1
            ? "1 hour ago"
            : `${diffHours} hours ago`;
    }


    return new Date(postTime)
        .toLocaleDateString("en-IN",{
            day:"2-digit",
            month:"short",
            year:"numeric"
        });
}


function updateTimes(){


    document
    .querySelectorAll(".time")
    .forEach(el=>{


        const ts =
            Number(el.dataset.time);


        el.textContent =
            formatPostTime(ts);


    });


}


function linkifyText(text){


    text = text.replace(
        /(https?:\/\/[^\s]+)/g,
        '<a href="$1" target="_blank" class="post-link">$1</a>'
    );


    text = text.replace(
        /(^|\s)(#[a-zA-Z0-9_\u0900-\u097F]+)/g,
        function(match,space,tag){


            const keyword =
                tag.slice(1);


            return `${space}<a href="https://poster.yojnaportal.com/search/?q=${encodeURIComponent(keyword)}" class="post-tag">${tag}</a>`;


        }
    );


    return text;


}


let allPosts = [];
let currentPage = 0;
const postsPerPage = 20;


async function loadFeed(){


    const feed =
        document.getElementById(
            "channelFeed"
        );


    // Loading Skeleton


    feed.innerHTML = Array(5).fill(`


        <article class="post-card skeleton-card">


            <div class="post-header">


                <div class="avatar skeleton"></div>


                <div class="meta">


                    <div
                        class="skeleton"
                        style="
                        height:18px;
                        width:70%;
                        margin-bottom:8px;">
                    </div>


                    <div
                        class="skeleton"
                        style="
                        height:12px;
                        width:120px;">
                    </div>


                </div>


            </div>


            <div
                class="skeleton"
                style="
                height:220px;
                margin:0 15px;
                border-radius:12px;">
            </div>


            <div class="post-body">


                <div
                    class="skeleton"
                    style="
                    height:14px;
                    margin-bottom:8px;">
                </div>


                <div
                    class="skeleton"
                    style="
                    height:14px;
                    margin-bottom:8px;">
                </div>


                <div
                    class="skeleton"
                    style="
                    height:14px;
                    width:60%;">
                </div>


            </div>


        </article>


    `).join("");


   const feedSources = [


{
    url:"channel.json",
    name:"Yojna Portal Poster",
    logo:"favicon.ico"
},
{
    url:"https://www.gajabjobs.com/channel.json",
    name:"Gajab Jobs",
    logo:"https://www.gajabjobs.com/favicon.ico"
},




{
    url:"https://www.gajabtools.com/channel.json",
    name:"Gajab Tools",
    logo:"https://www.gajabtools.com/favicon.ico"
},


{
    url:"https://www.yojnaportal.com/channel.json",
    name:"Yojna Portal",
    logo:"https://www.yojnaportal.com/favicon.ico"
}


];


    try{


        let posts = [];


       const results =
await Promise.allSettled(


    feedSources.map(source=>


        fetch(source.url)
        .then(r=>r.json())
        .then(data=>


            data.map(post=>({


                ...post,


                sourceName:
                    source.name,


                sourceLogo:
                    source.logo


            }))


        )


    )


);
        results.forEach(result=>{


            if(
                result.status === "fulfilled"
            ){


                posts.push(
                    ...result.value
                );


            }


        });


        posts.sort(
            (a,b)=>
            new Date(b.date) -
            new Date(a.date)
        );


        allPosts = posts;


        feed.innerHTML = "";


        renderPosts();
        updateSavedButtons();
    }catch(err){


        console.error(err);


        feed.innerHTML =
            "<h3>Feed loading failed</h3>";


    }


}


function renderPosts(){


    const feed =
        document.getElementById(
            "channelFeed"
        );


    const start =
        currentPage * postsPerPage;


    const end =
        start + postsPerPage;


    const chunk =
        allPosts.slice(start,end);


    if(chunk.length === 0){
        return;
    }


    feed.insertAdjacentHTML(


        "beforeend",


        chunk.map(post=>`


        <article class="post-card">


            <div class="post-header">


                <div class="avatar">


    <img
        src="${post.sourceLogo}"
        alt="${post.sourceName}"
        loading="lazy">


      </div>


                <div class="meta">


                 <div class="title">


    ${post.sourceName} <i class="fas fa-check-circle"></i>


</div>


<div
    class="time"
    data-time="${Date.parse(post.date)/1000}">
</div>
    
                </div>


          <button
    class="header-save-btn save-btn"
    data-post='${JSON.stringify(post).replace(/'/g,"&#39;")}'>
    ⭐ Save
</button>
            <div class="menu-wrap">


    <button class="menu-btn">⋮</button>
    
    <div class="menu-dropdown">


        <a href="${post.url}" target="_blank">
            <i class="fas fa-link"></i>
        <span>Open</span>
        </a>


        <button
            class="copy-btn"
            data-text="${(post.description||'').replace(/"/g,'&quot;')}">
             <i class="fas fa-copy"></i>
        <span>Copy Text</span>
        </button>


        <button
            class="whatsapp-btn"
            data-text="${(post.description||'').replace(/"/g,'&quot;')}"
            data-url="${post.url}">
             <i class="fab fa-whatsapp"></i>
        <span>Whatsapp Share</span>
        </button>


        <button
            class="share-btn"
            data-title="${post.title}"
            data-url="${post.url}">
             <i class="fas fa-share"></i>
        <span>Share</span>
        </button>
      
    </div>








    </div>
            </div>
           
                <div class="post-body">
               
                <div
    class="post-text ${post.image ? 'collapsed' : ''}">
           ${ linkifyText(  post.description || "" ) }
    
</div>
            </div>


            ${
                post.image
                ? `
                <div class="post-image">
                    <a href="${post.url}">
                        <img
                            src="${post.image}"
                            alt="${post.title}">
                    </a>
                </div>
                `
                : ""
            }


        
           
           <div class="post-footer">


    <a href="${post.url}" target="_blank" class="action-btn details-btn">
        <i class="fas fa-link"></i>
        <span>Details</span>
    </a>


    <button
        class="action-btn copy-btn"
        data-text="${(post.description||'').replace(/"/g,'&quot;')}">
        <i class="fas fa-copy"></i>
        <span>Copy</span>
    </button>


    <button
        class="action-btn whatsapp-btn"
        data-text="${(post.description||'').replace(/"/g,'&quot;')}"
        data-url="${post.url}">
        <i class="fab fa-whatsapp"></i>
        <span>Share</span>
    </button>


</div>


        </article>


        `).join("")


    );


    updateTimes();
updateSavedButtons();


}


window.addEventListener(
"scroll",
function(){


    if(


        window.innerHeight +
        window.scrollY >=


        document.body.offsetHeight - 500


    ){


        currentPage++;


        renderPosts();


    }


});


loadFeed();


document
.querySelectorAll(".save-btn")
.forEach(btn=>{


    const url =
        btn.dataset.url;


    const savedPosts =
        JSON.parse(
            localStorage.getItem(
                "savedPosts"
            ) || "[]"
        );


    if(
        savedPosts.some(
            p => p.url === url
        )
    ){


        btn.innerHTML =
            "★ Saved";


        btn.classList
            .add("saved");


    }


});


document.addEventListener(
"click",
async function(e){


    if(
        e.target.classList.contains(
            "copy-btn"
        )
    ){


        await navigator.clipboard
        .writeText(
            e.target.dataset.text
        );


        e.target.textContent = "✓ Copied";


        setTimeout(()=>{
            e.target.textContent = "📑 Copy again";
        },1000);


    }


    if(
        e.target.classList.contains(
            "whatsapp-btn"
        )
    ){


        const text =
            e.target.dataset.text;


        const url =
            e.target.dataset.url;


        window.open(
            "https://wa.me/?text=" +
            encodeURIComponent(
                text + "\n\n" + url
            ),
            "_blank"
        );


    }


});


</script>
<script nonce="NjYyMjgzMjkzLDQwNjE2MTI3NTM=">


document.addEventListener("click", function(e){


    if(e.target.classList.contains("menu-btn")){


        const menu = e.target.nextElementSibling;


        document
            .querySelectorAll(".menu-dropdown")
            .forEach(m => {
                if(m !== menu) m.classList.remove("show");
            });


        menu.classList.toggle("show");
        return;
    }


    document
        .querySelectorAll(".menu-dropdown")
        .forEach(m => m.classList.remove("show"));


});




</script>

<script nonce="NjYyMjgzMjkzLDQwNjE2MTI3NTM=">
document.addEventListener("click",function(e){


    const btn =
        e.target.closest(".save-btn");


    if(!btn) return;


    const post =
        JSON.parse(
            btn.dataset.post
                .replace(/&#39;/g,"'")
        );


    let savedPosts =
        JSON.parse(
            localStorage.getItem(
                "savedPosts"
            ) || "[]"
        );


    const exists =
        savedPosts.find(
            p => p.url === post.url
        );


    if(exists){


        savedPosts =
            savedPosts.filter(
                p => p.url !== post.url
            );


        btn.innerHTML =
            "⭐ Save";


        btn.classList.remove(
            "saved"
        );


    }else{


        savedPosts.unshift(post);


        btn.innerHTML =
            "★ Saved";


        btn.classList.add(
            "saved"
        );


    }


    localStorage.setItem(
        "savedPosts",
        JSON.stringify(savedPosts)
    );


});
</script>
