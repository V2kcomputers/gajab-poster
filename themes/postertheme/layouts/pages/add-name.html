<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Canva Style Poster Editor</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#e7e7e7;
  font-family:'Poppins',sans-serif;
  overflow:hidden;
}

/* =========================
   APP
========================= */

.app{
  display:flex;
  height:100vh;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  width:320px;
  background:#fff;
  padding:20px;
  overflow:auto;

  box-shadow:
  0 0 20px rgba(0,0,0,0.08);

  z-index:10;
}

.sidebar h2{
  margin-bottom:20px;
}

.control-group{
  margin-bottom:20px;
}

.control-group label{
  display:block;
  margin-bottom:8px;
  font-size:14px;
  font-weight:600;
}

.control-group input,
.control-group button,
.control-group textarea{
  width:100%;
}

input[type="range"]{
  cursor:pointer;
}

input[type="color"]{
  height:45px;
  border:none;
}

button{
  border:none;
  padding:14px;
  border-radius:12px;
  background:#0a9b32;
  color:#fff;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  margin-bottom:10px;
}

/* =========================
   CANVAS AREA
========================= */

.workspace{
  flex:1;
  overflow:auto;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:40px;
}

/* A4 */

.canvas{
  width:794px;
  height:1123px;

  background:#fff;

  position:relative;

  overflow:hidden;

  box-shadow:
  0 10px 40px rgba(0,0,0,0.15);
}

/* =========================
   LAYERS
========================= */

.layer{
  position:absolute;
  touch-action:none;
  user-select:none;
}

/* SELECTED */

.selected{
  outline:2px dashed #0a84ff;
}

/* IMAGE */

.image-layer img{
  width:100%;
  height:100%;
  pointer-events:none;
}

/* TEXT */

.text-layer{
  min-width:120px;
  min-height:50px;

  padding:10px;

  font-size:40px;
  font-weight:700;
  color:#fff;
  cursor:move;

  outline:none;
text-shadow: 2px 5px 8px #000;
  word-break:break-word;
    resize:none;
  overflow:visible;
}

/* RESIZE HANDLE */

.resize-handle{
  width:14px;
  height:14px;

  background:#0a84ff;

  position:absolute;
  right:-7px;
  bottom:-7px;

  border-radius:50%;
}
/* =========================
   MOBILE TOOLBAR
========================= */

.mobile-toolbar{
  display:none;
}

/* MOBILE */
/* =========================
   MOBILE FLOAT CONTROL
========================= */

.mobile-control-box{

  position:fixed;

  bottom:95px;

  left:50%;

  transform:translateX(-50%);

  width:92%;

  background:#fff;

  border-radius:20px;

  padding:18px;

  z-index:999999;

  box-shadow:
  0 10px 30px rgba(0,0,0,.18);

  display:none;

}

.mobile-control-box.active{
  display:block;
}

.mobile-control-box input{

  width:100%;

}

.mobile-control-box label{

  display:block;

  margin-bottom:10px;

  font-size:14px;

  font-weight:700;

}
@media(max-width:768px){

  body{
    overflow:hidden;
  }

  .app{
    flex-direction:column;
  }

  /* SIDEBAR HIDE */

  .sidebar{
    display:none;
  }

  /* WORKSPACE */

 .workspace{

    width:100%;

    overflow:auto;

    padding:10px 10px 120px;

    display:block;

  }

  .canvas{

    width:100%;

    max-width:100%;

    height:auto;

    aspect-ratio:794 / 1123;

    margin:auto;

  }


  /* CANVAS SCALE */

  /* MOBILE TOOLBAR */

  .mobile-toolbar{

    display:flex;

    position:fixed;

    bottom:0;
    left:0;

    width:100%;

    background:#fff;

    overflow-x:auto;

    gap:12px;

    padding:12px;

    z-index:99999;

    box-shadow:
    0 -5px 20px rgba(0,0,0,.12);

  }

  .mobile-toolbar button{

    min-width:70px;

    height:70px;

    border-radius:18px;

    margin:0;

    flex-shrink:0;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:6px;

    font-size:12px;

    background:#f3f3f3;

    color:#222;

    font-weight:700;

  }

  .mobile-toolbar button.active{
    background:#0a9b32;
    color:#fff;
  }

  .mobile-toolbar button span{
    font-size:24px;
    line-height:1;
  }
    .text-layer{
    font-size:24px !important;
  }

}

</style>
</head>
<body>

<!-- MOBILE CONTROL POPUP -->

<div class="mobile-control-box" id="mobileControlBox">

  <label id="mobileControlLabel">
    Control
  </label>

  <div id="mobileControlArea"></div>
</div>

<div class="mobile-toolbar">

  <button onclick="showControl('color')">
    <span>🎨</span>
    Color
  </button>

  <button onclick="showControl('font')">
    <span>🔠</span>
    Font
  </button>

  <button onclick="showControl('rotate')">
    <span>🔄</span>
    Rotate
  </button>

  <button onclick="showControl('opacity')">
    <span>🌫️</span>
    Opacity
  </button>

  <button onclick="addText()">
    <span>📝</span>
    Text
  </button>

  <button onclick="addImage()">
    <span>🖼️</span>
    Image
  </button>

  <button onclick="downloadCanvas()">
    <span>⬇️</span>
    Save
  </button>

</div>
<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">



    <h2>Poster Editor</h2>

    <!-- IMAGE -->
    <button onclick="addImage()">
      Add Image
    </button>

    <!-- TEXT -->
    <button onclick="addText()">
      Add Text
    </button>

    <!-- DELETE -->
    <button onclick="deleteSelected()">
      Delete Selected
    </button>

    <!-- FRONT -->
    <button onclick="bringFront()">
      Bring Front
    </button>

    <!-- BACK -->
    <button onclick="sendBack()">
      Send Back
    </button>

    <!-- DOWNLOAD -->
    <button onclick="downloadCanvas()">
      Download HD
    </button>

    <!-- TEXT CONTROLS -->
    <div class="control-group">

      <label>Text Color</label>

      <input
        type="color"
        id="textColor"
        value=""
      >

    </div>

    <div class="control-group">

      <label>Font Size</label>

      <input
        type="range"
        id="fontSize"
        min="10"
        max="150"
        value="40"
      >

    </div>

    <div class="control-group">

      <label>Rotate</label>

      <input
        type="range"
        id="rotate"
        min="-180"
        max="180"
        value="0"
      >

    </div>

    <div class="control-group">

      <label>Opacity</label>

      <input
        type="range"
        id="opacity"
        min="0"
        max="1"
        step="0.05"
        value="1"
      >

    </div>
        <!-- MOBILE TOOLBAR -->
<div class="control-group">
  <label>Footer BG</label>
  <input type="color" id="footerBG">
</div>

<div class="control-group">
  <label>Footer Radius</label>
  <input type="range" id="footerRadius" min="0" max="100" value="0">
</div>

<div class="control-group">
  <label>Footer Blur</label>
  <input type="range" id="footerBlur" min="0" max="40" value="0">
</div>

<div class="control-group">
  <label>Footer Shadow</label>
  <input type="range" id="footerShadow" min="0" max="80" value="0">
</div>

  </div>

  <!-- WORKSPACE -->
  <div class="workspace">

    <div
      class="canvas"
      id="canvas"
    ></div>

  </div>

</div>

<input
  type="file"
  id="imageInput"
  accept="image/*"
  hidden
>

<script>

/* =========================
   VARIABLES
========================= */

const canvas =
document.getElementById("canvas");

const imageInput =
document.getElementById("imageInput");

let selectedLayer = null;

let zIndexCounter = 1;

/* =========================
   SELECT LAYER
========================= */

function selectLayer(layer){

  document
  .querySelectorAll(".layer")
  .forEach(el=>{

    el.classList.remove(
      "selected"
    );

  });

  selectedLayer = layer;

  layer.classList.add(
    "selected"
  );

}

/* =========================
   CREATE RESIZE HANDLE
========================= */

function addResizeHandle(layer){

  const handle =
  document.createElement("div");

  handle.className =
  "resize-handle";

  layer.appendChild(handle);

}

/* =========================
   ENABLE DRAG + RESIZE
========================= */

function enableInteract(layer){

  interact(layer)

  .draggable({

    listeners:{

      move(event){

        let x =
        (
          parseFloat(
            layer.getAttribute(
              "data-x"
            )
          ) || 0
        ) + event.dx;

        let y =
        (
          parseFloat(
            layer.getAttribute(
              "data-y"
            )
          ) || 0
        ) + event.dy;

        layer.style.transform =
        `
        translate(${x}px,${y}px)
        rotate(${layer.dataset.rotate || 0}deg)
        `;

        layer.setAttribute(
          "data-x",
          x
        );

        layer.setAttribute(
          "data-y",
          y
        );

      }

    }

  })

.resizable({
  edges:{
    top:true,
    left:true,
    bottom:true,
    right:true
  },

  listeners:{

    move(event){

      let {
        width,
        height
      } = event.rect;

      /* =====================
         TEXT LAYER RESIZE
      ===================== */

      if(
        layer.classList.contains(
          "text-layer"
        )
      ){

        /* WIDTH */

        layer.style.width =
        width + "px";

        layer.style.minHeight =
        height + "px";

        /* AUTO FONT SIZE */

        const autoFont =
        Math.max(
          14,
          width / 8
        );

        layer.style.fontSize =
        autoFont + "px";

      }

      /* =====================
         IMAGE RESIZE
      ===================== */

      else{

        layer.style.width =
        width + "px";

        layer.style.height =
        height + "px";

      }

      /* POSITION FIX */

      let x =
      (
        parseFloat(
          layer.getAttribute(
            "data-x"
          )
        ) || 0
      );

      let y =
      (
        parseFloat(
          layer.getAttribute(
            "data-y"
          )
        ) || 0
      );

      x += event.deltaRect.left;
      y += event.deltaRect.top;

      layer.style.transform =
      `
      translate(${x}px,${y}px)
      rotate(${layer.dataset.rotate || 0}deg)
      `;

      layer.setAttribute(
        "data-x",
        x
      );

      layer.setAttribute(
        "data-y",
        y
      );

    }

  }

});

}

/* =========================
   ADD IMAGE
========================= */

function addImage(){

  imageInput.click();

}

imageInput.addEventListener(
  "change",
  e=>{

    const file =
    e.target.files[0];

    if(!file) return;

    const reader =
    new FileReader();

    reader.onload =
    function(ev){

      const layer =
      document.createElement("div");

      layer.className =
      "layer image-layer";

      layer.style.width =
      "300px";

      layer.style.height =
      "300px";

      layer.style.left =
      "100px";

      layer.style.top =
      "100px";

      layer.style.zIndex =
      zIndexCounter++;

      layer.innerHTML =
      `
      <img src="${ev.target.result}">
      `;

      addResizeHandle(layer);

      canvas.appendChild(layer);

      enableInteract(layer);

      selectLayer(layer);

      layer.addEventListener(
        "mousedown",
        ()=>selectLayer(layer)
      );

    };

    reader.readAsDataURL(file);

  }
);

/* =========================
   PASTE IMAGE
========================= */

document.addEventListener(
  "paste",
  e=>{

    const items =
    e.clipboardData.items;

    for(
      let item of items
    ){

      if(
        item.type.indexOf(
          "image"
        ) !== -1
      ){

        const file =
        item.getAsFile();

        const reader =
        new FileReader();

        reader.onload =
        function(ev){

          const layer =
          document.createElement("div");

          layer.className =
          "layer image-layer";

          layer.style.width =
          "300px";

          layer.style.height =
          "300px";

          layer.style.left =
          "100px";

          layer.style.top =
          "100px";

          layer.style.zIndex =
          zIndexCounter++;

          layer.innerHTML =
          `
          <img src="${ev.target.result}">
          `;

          addResizeHandle(layer);

          canvas.appendChild(layer);

          enableInteract(layer);

          selectLayer(layer);

          layer.addEventListener(
            "mousedown",
            ()=>selectLayer(layer)
          );

        };

        reader.readAsDataURL(
          file
        );

      }

    }

  }
);

/* =========================
   ADD TEXT
========================= */
function addText(){

  const layer =
  document.createElement("div");

  layer.className =
  "layer text-layer";

  layer.contentEditable =
  true;

  layer.innerHTML =
  "Your Text";

  layer.style.left =
  "100px";

  layer.style.top =
  "100px";

  /* IMPORTANT */

  layer.style.zIndex =
  "9999";

  /* SIZE */

  layer.style.width =
  "300px";

  layer.style.minHeight =
  "80px";

  layer.style.padding =
  "15px";

  layer.style.resize =
  "both";

  layer.style.overflow =
  "hidden";

  layer.style.display =
  "block";

  layer.style.cursor =
  "move";

  layer.style.background =
  "transparent";

  layer.style.border =
  "2px dashed transparent";

  layer.style.wordBreak =
  "break-word";

  layer.style.whiteSpace =
  "pre-wrap";

  layer.style.outline =
  "none";

  /* MOBILE */

  if(window.innerWidth < 768){

    layer.style.width =
    "220px";

    layer.style.fontSize =
    "24px";

  }

  addResizeHandle(layer);

  canvas.appendChild(layer);

  enableInteract(layer);

  selectLayer(layer);

  layer.addEventListener(
    "mousedown",
    ()=>{

      selectLayer(layer);

    }
  );

}

/* =========================
   DELETE
========================= */

function deleteSelected(){

  if(selectedLayer){

    selectedLayer.remove();

    selectedLayer = null;

  }

}

/* KEY DELETE */

document.addEventListener(
  "keydown",
  e=>{

    if(
      e.key === "Delete"
    ){

      deleteSelected();

    }

  }
);

/* =========================
   FRONT / BACK
========================= */

function bringFront(){

  if(selectedLayer){

    selectedLayer.style.zIndex =
    zIndexCounter++;

  }

}

function sendBack(){

  if(selectedLayer){

    selectedLayer.style.zIndex =
    1;

  }

}

/* =========================
   CONTROLS
========================= */

const textColor =
document.getElementById("textColor");

const fontSize =
document.getElementById("fontSize");

const rotate =
document.getElementById("rotate");

const opacity =
document.getElementById("opacity");

function updateControls(){

  if(!selectedLayer) return;

  selectedLayer.style.opacity =
  opacity.value;

  selectedLayer.dataset.rotate =
  rotate.value;

  const x =
  selectedLayer.getAttribute(
    "data-x"
  ) || 0;

  const y =
  selectedLayer.getAttribute(
    "data-y"
  ) || 0;

  selectedLayer.style.transform =
  `
  translate(${x}px,${y}px)
  rotate(${rotate.value}deg)
  `;

  if(
    selectedLayer.classList.contains(
      "text-layer"
    )
  ){

    selectedLayer.style.color =
    textColor.value;

    selectedLayer.style.fontSize =
    fontSize.value + "px";

  }

}

[
  textColor,
  fontSize,
  rotate,
  opacity
].forEach(el=>{

  el.addEventListener(
    "input",
    updateControls
  );

});

/* =========================
   DOWNLOAD
========================= */

async function downloadCanvas(){

  document
  .querySelectorAll(
    ".selected"
  )
  .forEach(el=>{

    el.classList.remove(
      "selected"
    );

  });

  const canvasImage =
  await html2canvas(
    canvas,
    {
      scale:4,
      useCORS:true
    }
  );

  const link =
  document.createElement("a");

  link.download =
  "poster.png";

  link.href =
  canvasImage.toDataURL(
    "image/png"
  );

  link.click();

}

</script>

<script>

/* =========================
   URL IMAGE LOAD
========================= */

const params =
new URLSearchParams(
  window.location.search
);

const imageURL =
params.get("img");

if(imageURL){

  addImageFromURL(
    decodeURIComponent(imageURL)
  );

}

/* =========================
   ADD IMAGE FROM URL
========================= */

function addImageFromURL(url){

  const layer =
  document.createElement("div");

  layer.className =
  "layer image-layer";

  layer.style.width =
  "100%";

  layer.style.height =
  "auto";

  layer.style.left =
  "0";

  layer.style.top =
  "0";

  layer.style.zIndex =
  "1";

  const img =
document.createElement("img");

img.crossOrigin =
"anonymous";

img.src =
url + (
  url.includes("?")
  ? "&"
  : "?"
) + "t=" + Date.now();

/* FALLBACK */

img.onerror = ()=>{

  img.removeAttribute(
    "crossorigin"
  );

  img.src =
  url + (
    url.includes("?")
    ? "&"
    : "?"
  ) + "nocors=" + Date.now();

};

img.style.width =
"100%";

img.style.height =
"auto";

img.style.display =
"block";

/* IMAGE LOAD */

img.onload = ()=>{

  const imageHeight =
  img.offsetHeight;

  createFooterText(
    imageHeight
  );

};

layer.appendChild(img);

canvas.appendChild(layer);

}
/* =========================
   AUTO FOOTER TEXT
========================= */

function createFooterText(imageHeight){

  /* REMOVE OLD */

  const old =
  document.getElementById(
    "footerContainer"
  );

  if(old){
    old.remove();
  }

  /* =====================
     MAIN CONTAINER
  ===================== */

  const container =
  document.createElement("div");

  container.className =
  "layer text-layer";

  container.id =
  "footerContainer";

  container.style.left =
  "0px";

  container.style.top =
  imageHeight + "px";

  container.style.width =
  "100%";

  container.style.minHeight =
  "180px";

  container.style.padding =
  "2px";

  container.style.zIndex =
  "9";

  container.style.display =
  "flex";

  container.style.flexDirection =
  "column";

  container.style.alignItems =
  "center";

  container.style.justifyContent =
  "center";

  container.style.textAlign =
  "center";

  container.style.cursor =
  "move";

  /* =====================
     LOCAL STORAGE STYLE
  ===================== */

  const footerBG =
  localStorage.getItem(
    "footer_bg"
  ) || "rgb(254, 225, 225)";

  const footerColor =
  localStorage.getItem(
    "footer_color"
  ) || "#fff";

  const footerRadius =
  localStorage.getItem(
    "footer_radius"
  ) || "0";

  const footerBlur =
  localStorage.getItem(
    "footer_blur"
  ) || "0";

  const footerShadow =
  localStorage.getItem(
    "footer_shadow"
  ) || "0";

  container.style.background =
  footerBG;

  container.style.color =
  footerColor;

  container.style.borderRadius =
  footerRadius + "px";

  container.style.backdropFilter =
  `blur(${footerBlur}px)`;

  container.style.boxShadow =
  `0 0 ${footerShadow}px rgba(0,0,0,.5)`;

  /* =====================
     H2
  ===================== */

  const h2 =
  document.createElement("h2");

  h2.contentEditable =
  true;

  h2.innerHTML =
  localStorage.getItem(
    "poster_h2"
  ) ||
  "YOJNA PORTAL";

  h2.style.width =
  "100%";

  h2.style.fontWeight =
  "900";

  h2.style.outline =
  "none";

  h2.style.wordBreak =
  "break-word";

  h2.style.fontSize =
  window.innerWidth < 768
  ? "28px"
  : "60px";

  /* =====================
     H5
  ===================== */

  const h5 =
  document.createElement("h5");

  h5.contentEditable =
  true;

  h5.innerHTML =
  localStorage.getItem(
    "poster_h5"
  ) ||
  "Mo. 9999999999";

  h5.style.width =
  "100%";

  h5.style.marginTop =
  "10px";

  h5.style.outline =
  "none";

  h5.style.wordBreak =
  "break-word";

  h5.style.fontSize =
  window.innerWidth < 768
  ? "16px"
  : "28px";

  /* =====================
     SAVE TEXT
  ===================== */

  h2.addEventListener(
    "input",
    ()=>{

      localStorage.setItem(
        "poster_h2",
        h2.innerHTML
      );

    }
  );

  h5.addEventListener(
    "input",
    ()=>{

      localStorage.setItem(
        "poster_h5",
        h5.innerHTML
      );

    }
  );

  /* =====================
     APPEND
  ===================== */

  container.appendChild(h2);

  container.appendChild(h5);

  canvas.appendChild(container);

  /* =====================
     INTERACT
  ===================== */

  addResizeHandle(container);

  enableInteract(container);

  selectLayer(container);

  container.addEventListener(
    "mousedown",
    ()=>selectLayer(container)
  );

}
</script>
<script>

/* =========================
   MOBILE CONTROL POPUP
========================= */

const mobileControlBox =
document.getElementById(
  "mobileControlBox"
);

const mobileControlArea =
document.getElementById(
  "mobileControlArea"
);

const mobileControlLabel =
document.getElementById(
  "mobileControlLabel"
);

function showControl(type){

  mobileControlBox.classList.add(
    "active"
  );

  mobileControlArea.innerHTML = "";

  let clone;

  if(type === "color"){

    mobileControlLabel.innerHTML =
    "Text Color";

    clone =
    textColor.cloneNode(true);

  }

  if(type === "font"){

    mobileControlLabel.innerHTML =
    "Font Size";

    clone =
    fontSize.cloneNode(true);

  }

  if(type === "rotate"){

    mobileControlLabel.innerHTML =
    "Rotate";

    clone =
    rotate.cloneNode(true);

  }

  if(type === "opacity"){

    mobileControlLabel.innerHTML =
    "Opacity";

    clone =
    opacity.cloneNode(true);

  }

  clone.addEventListener(
    "input",
    e=>{

      if(type === "color"){

        textColor.value =
        e.target.value;

      }

      if(type === "font"){

        fontSize.value =
        e.target.value;

      }

      if(type === "rotate"){

        rotate.value =
        e.target.value;

      }

      if(type === "opacity"){

        opacity.value =
        e.target.value;

      }

      updateControls();

    }
  );

  mobileControlArea.appendChild(
    clone
  );

}

/* CLOSE WHEN CLICK OUTSIDE */

document.addEventListener(
  "click",
  e=>{

    if(
      !e.target.closest(
        ".mobile-control-box"
      ) &&

      !e.target.closest(
        ".mobile-toolbar button"
      )
    ){

      mobileControlBox.classList.remove(
        "active"
      );

    }

  }
);

</script>

<script>
  const footerBG =
document.getElementById("footerBG");

const footerRadius =
document.getElementById("footerRadius");

const footerBlur =
document.getElementById("footerBlur");

const footerShadow =
document.getElementById("footerShadow");

[
  footerBG,
  footerRadius,
  footerBlur,
  footerShadow
].forEach(el=>{

  el.addEventListener(
    "input",
    ()=>{

      const box =
      document.getElementById(
        "footerContainer"
      );

      if(!box) return;

      box.style.background =
      footerBG.value;

      box.style.borderRadius =
      footerRadius.value + "px";

      box.style.backdropFilter =
      `blur(${footerBlur.value}px)`;

      box.style.boxShadow =
      `0 0 ${footerShadow.value}px rgba(0,0,0,.5)`;

      localStorage.setItem(
        "footer_bg",
        footerBG.value
      );

      localStorage.setItem(
        "footer_radius",
        footerRadius.value
      );

      localStorage.setItem(
        "footer_blur",
        footerBlur.value
      );

      localStorage.setItem(
        "footer_shadow",
        footerShadow.value
      );

    }
  );

});
</script>
</body>
</html>
