<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Blob Poster Editor</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#ececec;
  font-family:Arial,sans-serif;
  padding:20px;
}

.container{
  width:100%;
  max-width:1000px;
  margin:auto;
}

.poster-box{
  background:#fff;
  border:6px solid red;
  overflow:hidden;
  border-radius:12px;
}

.poster-image{
  width:100%;
  display:block;
}

.shop-section{
  background:#000;
  border-top:6px solid red;
  padding:35px 20px;
  text-align:center;
}

#shopName{
  color:#ff2020;
  font-size:72px;
  font-weight:900;
  line-height:1.1;
  text-transform:uppercase;
  word-break:break-word;
  font-family:'Poppins',sans-serif;
}

#shopAddress{
  color:#fff;
  font-size:24px;
  margin-top:12px;
  line-height:1.5;
}

.download-btn{
  width:100%;
  margin-top:20px;
  padding:18px;
  border:none;
  border-radius:16px;
  background:#0a9b32;
  color:#fff;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
}

@media(max-width:768px){

  #shopName{
    font-size:42px;
  }

  #shopAddress{
    font-size:18px;
  }

}

</style>
</head>
<body>

<div class="container">

  <!-- POSTER -->
  <div
    class="poster-box"
    id="posterBox"
  >

    <!-- IMAGE -->
    <img
      id="posterImage"
      class="poster-image"
      src=""
      alt="Poster"
    >

    <!-- FOOTER -->
    <div
      class="shop-section"
      id="shopSection"
    >

      <div
        id="shopName"
        contenteditable="true"
      >
        SHOP NAME
      </div>

      <div
        id="shopAddress"
        contenteditable="true"
      >
        Address / Mobile Number
      </div>

    </div>

  </div>

  <!-- DOWNLOAD -->
  <button
    class="download-btn"
    onclick="downloadPoster()"
  >
    Download Poster
  </button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>

/* =========================
   ELEMENTS
========================= */

const posterImage =
document.getElementById("posterImage");

const shopName =
document.getElementById("shopName");

const shopAddress =
document.getElementById("shopAddress");

const shopSection =
document.getElementById("shopSection");

/* =========================
   URL PARAMS
========================= */

const params =
new URLSearchParams(window.location.search);

/* =========================
   IMAGE PARAM
========================= */

const imageURL =
params.get("img");

/* =========================
   LOAD IMAGE AS BLOB
========================= */

if(imageURL){

  loadBlobImage(
    decodeURIComponent(imageURL)
  );

}

async function loadBlobImage(url){

  try{

    const response =
    await fetch(
      url + "?t=" + Date.now()
    );

    if(!response.ok){

      throw new Error(
        "Image fetch failed"
      );

    }

    const blob =
    await response.blob();

    const blobURL =
    URL.createObjectURL(blob);

    posterImage.onload = () => {

      console.log(
        "Blob image loaded"
      );

    };

    posterImage.src =
    blobURL;

  }catch(err){

    console.log(err);

    alert(
      "Image failed to load"
    );

  }

}

/* =========================
   NAME PARAM
========================= */

const name =
params.get("name");

if(name){

  shopName.innerHTML =
  decodeURIComponent(name);

}

/* =========================
   ADDRESS PARAM
========================= */

const address =
params.get("address");

if(address){

  shopAddress.innerHTML =
  decodeURIComponent(address);

}

/* =========================
   BG PARAM
========================= */

const bg =
params.get("bg");

if(bg){

  shopSection.style.background =
  decodeURIComponent(bg);

}

/* =========================
   TEXT COLOR PARAM
========================= */

const color =
params.get("color");

if(color){

  shopName.style.color =
  decodeURIComponent(color);

}

/* =========================
   LOCAL STORAGE
========================= */

if(localStorage.getItem("shopName")){

  shopName.innerHTML =
  localStorage.getItem("shopName");

}

if(localStorage.getItem("shopAddress")){

  shopAddress.innerHTML =
  localStorage.getItem("shopAddress");

}

shopName.addEventListener("input", ()=>{

  localStorage.setItem(
    "shopName",
    shopName.innerHTML
  );

});

shopAddress.addEventListener("input", ()=>{

  localStorage.setItem(
    "shopAddress",
    shopAddress.innerHTML
  );

});

/* =========================
   WAIT IMAGE LOAD
========================= */

function waitImageLoad(img){

  return new Promise((resolve,reject)=>{

    if(img.complete){

      resolve();

    }else{

      img.onload = ()=>resolve();

      img.onerror = ()=>reject();

    }

  });

}

/* =========================
   DOWNLOAD
========================= */

async function downloadPoster(){

  try{

    await waitImageLoad(
      posterImage
    );

    const canvas =
    await html2canvas(
      document.getElementById("posterBox"),
      {
        scale:3,
        useCORS:true,
        allowTaint:false,
        backgroundColor:null
      }
    );

    const link =
    document.createElement("a");

    link.download =
    "poster.png";

    link.href =
    canvas.toDataURL(
      "image/png"
    );

    link.click();

  }catch(err){

    console.log(err);

    alert(
      "Download failed"
    );

  }

}

</script>

</body>
</html>
