

<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />

<title>Professional Poster Editor</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700;900&display=swap"
rel="stylesheet"
/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  background:#edf0f5;
  overflow:hidden;
}

/* =========================
APP
========================= */

.editor{
  display:flex;
  width:100%;
  height:100vh;
}

/* =========================
LEFT ICONS
========================= */

.left-icons{

  width:70px;

  background:#fff;

  border-right:1px solid #ddd;

  display:flex;

  flex-direction:column;

  align-items:center;

  padding:10px 0;

  gap:12px;

  z-index:1000;

}

.left-icons button{

  width:52px;
  height:52px;

  border:none;

  border-radius:16px;

  background:#f5f5f5;

  font-size:22px;

  cursor:pointer;

  transition:.2s;

}

.left-icons button:hover{

  background:#0a9b32;
  color:#fff;

}

/* =========================
LEFT PANEL
========================= */

.left-panel{

  width:280px;

  background:#fff;

  border-right:1px solid #ddd;

  overflow:auto;

  padding:20px;

}

.panel{
  display:none;
}

.panel.active{
  display:block;
}

.panel h2{
  margin-bottom:20px;
}


/* =========================
SMART TOOLBAR
========================= */

.top-toolbar{

  display:flex;

  align-items:center;

  gap:12px;

  padding:12px;

  overflow-x:auto;

}

.tool-item{

  position:relative;

  flex:none;

}

.tool-control{

  position:absolute;

  top:65px;

  left:50%;

  transform:translateX(-50%);

  min-width:260px;

  background:#f5f5f5;

  border:1px solid #ddd;

  border-radius:24px;

  padding:20px;

  box-shadow:
  0 10px 35px rgba(0,0,0,.12);

  display:none;

  z-index:999999;

}

/* SHOW */



.tool-control.show{
  display:block;
}

.tool-control input[type=color]{

  width:70px;
  height:50px;

  border:none;

  background:none;

}

.tool-control input[type=range]{

  width:160px;

}

.align-popup{

  display:none;

  gap:8px;

}

.align-popup.show{
  display:flex;
}

.mini-btn{

  width:32px;
  height:32px;

  font-size:18px;

}

.delete-btn{

  background:#ffe5e5;

  color:#d10000;

}



/* GROUP */

.tool-group{

  display:flex;

  align-items:center;

  gap:8px;

  padding-right:10px;

  border-right:1px solid #e5e5e5;

  flex:none;

}

.tool-group:last-child{
  border-right:none;
}
/* =========================
TOP TOOLBAR
========================= */

.top-toolbar{

  position:fixed;

  top:10px;

  left:50%;

  transform:translateX(-50%);

  display:flex;

  align-items:center;

  gap:8px;

  padding:8px 12px;

  background:#f7f7f7;

  border:1px solid #dcdcdc;

  border-radius:22px;

  box-shadow:
  0 5px 20px rgba(0,0,0,.08);

  z-index:99999;

  overflow:visible; /* IMPORTANT */

}

/* =========================
TOOL ITEM
========================= */

.tool-item{

  position:relative;

  flex:none;

}

/* =========================
POPUP CONTROL
========================= */

.tool-control{

  position:absolute;

  top:65px;

  left:50%;

  transform:translateX(-50%);

  min-width:260px;

  background:#f5f5f5;

  border:1px solid #ddd;

  border-radius:24px;

  padding:20px;

  box-shadow:
  0 10px 35px rgba(0,0,0,.12);

  display:none;

  z-index:999999;

}

/* SHOW */

.tool-control.show{
  display:block;
}

/* =========================
CONTROL TITLE
========================= */

.control-title{

  font-size:15px;

  font-weight:700;

  margin-bottom:14px;

}

/* =========================
RANGE ROW
========================= */

.range-row{

  display:flex;

  align-items:center;

  gap:14px;

  margin-bottom:22px;

}

.range-row input[type=range]{

  flex:1;

}

/* NUMBER BOX */

.range-value{

  width:52px;

  height:48px;

  border-radius:14px;

  border:1px solid #ddd;

  background:#fff;

  text-align:center;

  font-size:20px;

}

/* =========================
ALIGN BUTTONS
========================= */

.align-tools{

  display:flex;

  gap:10px;

  margin-top:10px;

}

.align-tools .icon-btn{

  flex:1;

}

/* =========================
ICON BUTTON
========================= */

.icon-btn{

  width:46px;

  height:46px;

  border:none;

  border-radius:14px;

  background:#ececec;

  cursor:pointer;

  font-size:22px;

  transition:.2s;

}

.icon-btn:hover{

  background:#e2d7ff;

  color:#6d28d9;

}

/* ACTIVE */

.icon-btn.active{

  background:#e2d7ff;

  color:#6d28d9;

}

/* =========================
NO SCROLLBAR
========================= */

.top-toolbar::-webkit-scrollbar{
  display:none;
}

.top-toolbar{
  scrollbar-width:none;
}
/* SELECT */

.tool-select{

  height:42px;

  border:none;

  border-radius:12px;

  padding:0 14px;

  background:#f5f5f5;

  font-size:15px;

  font-weight:600;

  outline:none;

}

/* ICON BUTTON */

.icon-btn{

  width:40px;

  height:40px;

  border:none;

  border-radius:12px;

  background:#f3f3f3;

  font-size:20px;

  cursor:pointer;

  transition:.2s;

}

.icon-btn:hover{

  background:#ede9fe;

  color:#6d28d9;

}

/* TEXT BUTTON */

.toolbar-text-btn{

  border:none;

  background:none;

  font-size:15px;

  font-weight:600;

  cursor:pointer;

  padding:0 8px;

  color:#333;

}

/* SIZE */

.size-box{

  background:#f5f5f5;

  border-radius:14px;

  padding:4px;

}

.size-box input{

  width:60px;

  border:none;

  background:transparent;

  text-align:center;

  font-size:18px;

  font-weight:700;

  outline:none;

}

/* COLOR */

.color-box{

  position:relative;

}

.color-box input[type=color]{

  width:34px;

  height:8px;

  border:none;

  background:none;

  cursor:pointer;

}

.tool-icon{

  font-size:28px;

  font-weight:700;

}

/* =========================
CANVAS AREA
========================= */

.canvas-area{

  flex:1;

  overflow:auto;

  padding-top:70px;

  display:flex;

  justify-content:center;

  align-items:flex-start;

}

.canvas-wrapper{

  position:relative;

  width:794px;
  height:1123px;

  background:#fff;

  margin:20px;

  overflow:hidden;

  box-shadow:
  0 10px 40px rgba(0,0,0,.15);

}

.canvas-container{
  touch-action:none;
}

/* =========================
RIGHT PANEL
========================= */

.right-panel{

  width:320px;

  background:#fff;

  border-left:1px solid #ddd;

  padding:20px;

  overflow:auto;

}

.right-panel h2{
  margin-bottom:20px;
}

.export-btn{

  width:100%;

  border:none;

  padding:14px;

  border-radius:14px;

  background:#0a9b32;

  color:#fff;

  font-weight:700;

  margin-bottom:12px;

  cursor:pointer;

}

/* =========================
TEXT STYLES
========================= */

.text-style{

  padding:18px;

  border-radius:14px;

  background:#f6f6f6;

  margin-bottom:15px;

  cursor:pointer;

  font-weight:700;

}

.neon{

  background:#000;

  color:#0ff;

  text-shadow:
  0 0 10px #0ff,
  0 0 20px #0ff;

}

/* =========================
SHAPES
========================= */

.shape-grid{

  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:10px;

}

.shape-btn{

  height:70px;

  border:none;

  border-radius:16px;

  background:#f4f4f4;

  font-size:30px;

  cursor:pointer;

}

/* =========================
UPLOAD
========================= */

.upload-box{

  border:2px dashed #ccc;

  padding:30px;

  border-radius:20px;

  text-align:center;

  cursor:pointer;

  margin-bottom:20px;

}

.recent-images{

  display:grid;

  grid-template-columns:repeat(2,1fr);

  gap:10px;

}

.recent-images img{

  width:100%;

  border-radius:14px;

  cursor:pointer;

}

.effect-box{
  display:none;
  width:100%;
  margin-top:10px;
  padding:12px;
  border-radius:12px;
  background:#1f1f1f;
  border:1px solid rgba(255,255,255,0.08);
}

.effect-box.active{
  display:block;
}

.effect-control{
  margin-bottom:14px;
}

.effect-control label{
  display:block;
  font-size:13px;
  margin-bottom:6px;
  color:#000;
}

.effect-control input[type="range"]{
  width:100%;
}

.effect-control input[type="color"]{
  width:100%;
  height:45px;
  border:none;
  background:none;
  cursor:pointer;
}

.effect-grid{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.effect-btn{
  padding:12px;
  border:none;
  border-radius:12px;
  background:#2b2b2b;
  color:#fff;
  cursor:pointer;
  font-size:15px;
  transition:0.2s;
}

.effect-btn:hover{
  background:#3b3b3b;
}

/* =========================
CUSTOMIZE BOX
========================= */

.effect-custom-box{

  margin-top:20px;

  padding:15px;

  border-radius:18px;

  background:#f7f7f7;

}

.effect-control{

  margin-bottom:15px;

}

.effect-control label{

  display:block;

  margin-bottom:8px;

  font-size:14px;

  font-weight:700;

}

.effect-control input[type=range]{

  width:100%;

}

.effect-control input[type=color]{

  width:100%;

  height:45px;

  border:none;

  border-radius:12px;

}
.mobile-show {display: none;}
@media(max-width:768px){

  body{
    overflow:hidden;
  }

  .editor{
    flex-direction:column;
  }

  /* BOTTOM BAR */

  .left-icons{

    position:fixed;

    bottom:0;

    left:0;

    width:100%;

    height:75px;

    flex-direction:row;

    justify-content:flex-start;

    overflow-x:auto;

    gap:12px;

    padding:10px;

    border-right:none;

    border-top:1px solid #ddd;

    z-index:99999;

    background:#fff;

  }

  .left-icons button{

    min-width:55px;

    height:55px;

    border-radius:16px;

    font-size:24px;

    flex:none;

  }

  /* LEFT PANEL */

  .left-panel{

    position:fixed;

    left:0;

    right:0;

    bottom:75px;

    width:100%;

    height:260px;

    display:none;

    overflow:auto;

    box-shadow:
    0 -5px 30px rgba(0,0,0,.15);

  }

    display:block;
  }

  /* RIGHT PANEL */

  .right-panel{
    display:none;
  }


  .canvas-area{

    width:100%;

    overflow:auto;

    padding:
    10px
    10px
    180px
    10px;

    display:block;

  }

  .canvas-wrapper{

    height:auto;

    max-width:100%;

    margin:0 auto;

  }
  .right-panel{

    position:fixed;

    left:0;

    right:0;

    width:100%;

    height:300px;

    background:#fff;

    z-index:99999;

    border-radius:20px 20px 0 0;

    overflow:auto;

    display:none;

    padding:20px;

    box-shadow:
    0 -5px 30px rgba(0,0,0,.15);

  }

  .right-panel.show{
    display:block;
  }
  .mobile-show {display: block;}


}

/* =========================================================
MOBILE SMART TOOLBAR
========================================================= */

  TOOLBAR
  ========================= */

  }

  }

  .top-toolbar::-webkit-scrollbar{

  TOOL ITEM

  ========================= */

  }

  SELECT
  ========================= */

  }

  /* =========================
  POPUP CONTROL
  ========================= */

  .tool-control{

  MINI BUTTON
  ========================= */

  .mini-btn{

  }

  ========================= */

  .align-popup{

    display:none;

  .align-popup.show{

  GROUP
  ========================= */

  .tool-group{

    flex:none;

  }

  /* =========================
  TEXT BUTTON
  ========================= */

    white-space:nowrap;

  RANGE ROW
  ========================= */

    gap:12px;

  }

  }

  /* =========================
  RANGE VALUE
  ========================= */

  .range-value{

    width:52px;

    height:44px;

    border-radius:12px;

  }

  TOOL ICON
  ========================= */

  DELETE BTN
  ========================= */

/* =========================
SCROLLBAR
========================= */

::-webkit-scrollbar{
  width:6px;
  height:6px;
}

::-webkit-scrollbar-thumb{
  background:#bbb;
  border-radius:20px;

</style>

<body>

<div class="editor">

  <!-- LEFT ICONS -->

  <div class="left-icons">
    <button onclick="toggleToolbar()" class="mobile-show">
    🎛️
  </button>


     <button onclick="openPanel('textPanel')">
    🅣
  </button>

  <button onclick="openPanel('shapePanel')">
    ⬜
  </button>

  <button onclick="openPanel('imagePanel')">
    🖼️
  </button>

  <button onclick="openPanel('toolPanel')">
    ✏️
  </button>

  <!-- FONT -->

  <button onclick="openPanel('fontPanel')">
    🔤
  </button>

  <!-- EFFECT -->

  <button onclick="openPanel('effectPanel')">
    ✨
  </button>
  <button onclick="openPanel('imageEffectPanel')">
  🪄
</button>

  <!-- TOOLBAR -->

  
  <!-- EXPORT -->

  <button onclick="toggleExportPanel()" class="mobile-show">
    ⬇️
  </button>

  </div>

  <!-- LEFT PANEL -->

  <div class="left-panel">


    <!-- IMAGE EFFECT PANEL -->

<div
class="panel"
id="imageEffectPanel"
>

<h2>Image Effects</h2>

<div class="effect-grid">

  <!-- CROP -->

<button
class="effect-btn"
onclick="enableCropMode()"
onmousedown="event.preventDefault()"
>
  ✂️ Crop
</button>
<button
class="effect-btn"
id="applyCropBtn"
onclick="applyCrop()"
onmousedown="event.preventDefault()"
style="display:none;"
>
  ✅ Apply Crop
</button>

  <!-- BRIGHTNESS -->

  <div class="effect-control">

    <label>Brightness</label>

    <input
    type="range"
    id="brightnessRange"
    min="-1"
    max="1"
    step="0.1"
    value="0"
    oninput="applyImageFilters()"
    >

  </div>

  <!-- CONTRAST -->

  <div class="effect-control">

    <label>Contrast</label>

    <input
    type="range"
    id="contrastRange"
    min="-1"
    max="1"
    step="0.1"
    value="0"
    oninput="applyImageFilters()"
    >

  </div>

  <!-- SATURATION -->

  <div class="effect-control">

    <label>Saturation</label>

    <input
    type="range"
    id="saturationRange"
    min="-1"
    max="1"
    step="0.1"
    value="0"
    oninput="applyImageFilters()"
    >

  </div>

  <!-- BLUR -->

  <div class="effect-control">

    <label>Blur</label>

    <input
    type="range"
    id="blurRange"
    min="0"
    max="1"
    step="0.01"
    value="0"
    oninput="applyImageFilters()"
    >

  </div>

  <!-- GRAYSCALE -->

  <button
  class="effect-btn"
  onclick="toggleGrayscale()"
  >
    Black & White
  </button>

  <!-- REMOVE FILTER -->

  <button
  class="effect-btn"
  onclick="resetImageFilters()"
  >
    Reset Effects
  </button>

</div>

</div>
    <!-- FONT PANEL -->

<div
class="panel"
id="fontPanel"
>

  <h2>Fonts</h2>

  <div class="font-grid">

    <button
    class="font-btn"
    style="font-family:Poppins"
    onclick="setFontFamily('Poppins')"
    >
      Poppins
    </button>

    <button
    class="font-btn"
    style="font-family:Arial"
    onclick="setFontFamily('Arial')"
    >
      Arial
    </button>

    <button
    class="font-btn"
    style="font-family:Impact"
    onclick="setFontFamily('Impact')"
    >
      Impact
    </button>

    <button
    class="font-btn"
    style="font-family:Georgia"
    onclick="setFontFamily('Georgia')"
    >
      Georgia
    </button>

  </div>

</div>

<!-- EFFECT PANEL -->

<div class="panel" id="effectPanel">

  <h2>Effects</h2>

  <div class="effect-grid">

    <!-- SHADOW -->
    <button
      class="effect-btn"
      onclick="toggleEffectControls('shadowControls'); applyShadow();">
      Shadow
    </button>

    <div class="effect-custom-box effect-box" id="shadowControls">

      <div class="effect-control">
        <label>Shadow X</label>

        <input
          type="range"
          id="shadowX"
          min="-50"
          max="50"
          value="0"
          oninput="updateShadowEffect()">
      </div>

      <div class="effect-control">
        <label>Shadow Y</label>

        <input
          type="range"
          id="shadowY"

<script>

/* =========================
FABRIC
========================= */

const canvas =
new fabric.Canvas(
  "canvas",
  {
    preserveObjectStacking:true,
    backgroundColor:"#ffffff"
  }
);

canvas.renderAll();
/* =========================
RESPONSIVE FIX
========================= */

function fitCanvasToMobile(){

  const wrapper =
  document.querySelector(".canvas-wrapper");

  if(window.innerWidth <= 768){

    const scale =
    wrapper.clientWidth / 794;

    wrapper.style.height =
    (1123 * scale) + "px";

    canvas.setZoom(scale);

    canvas.setDimensions({

      width:794 * scale,
      height:1123 * scale

    });

  }else{

    canvas.setZoom(1);

    canvas.setDimensions({

      width:794,
      height:1123

    });

    wrapper.style.height =
    "1123px";

  }

  autoFitImages();

canvas.renderAll();

}

window.addEventListener(
  "resize",
  fitCanvasToMobile
);

window.addEventListener(
  "load",
  fitCanvasToMobile
);
function autoFitImages(){

  const canvasWidth =
  canvas.getWidth();

  canvas.getObjects().forEach(obj=>{

    if(obj.type === "image"){

      obj.scaleToWidth(canvasWidth);

      obj.set({
        left:0
      });

    }

  });

  canvas.renderAll();

}


let currentPanel = null;

/* =========================
OPEN PANEL
========================= */

function openPanel(id){

  const leftPanel =
  document.querySelector(".left-panel");

  const toolbar =
  document.querySelector(".top-toolbar");

  /* SAME PANEL CLICK */

  if(
    window.innerWidth <= 768 &&
    currentPanel === id &&
    leftPanel.classList.contains("show")
  ){

    leftPanel.classList.remove("show");

    toolbar.classList.remove("show");

    currentPanel = null;

    return;

  }

  /* HIDE ALL */

  document
  .querySelectorAll(".panel")
  .forEach(panel=>{

    panel.classList.remove("active");

  });

  /* SHOW NEW */

  document
  .getElementById(id)
  .classList.add("active");

  currentPanel = id;

  /* MOBILE */

  if(window.innerWidth <= 768){

    leftPanel.classList.add("show");

    toolbar.classList.remove("show");

    document
    .querySelector(".right-panel")
    ?.classList.remove("show");

  }

}

/* =========================
HIDE PANELS
========================= */

function closeAllPanels(){

  document
  .querySelector(".left-panel")
  ?.classList.remove("show");

  document
  .querySelector(".top-toolbar")
  ?.classList.remove("show");

  document
  .querySelector(".right-panel")
  ?.classList.remove("show");

  currentPanel = null;

}
canvas.on(
  "mouse:down",
  function(){

    if(window.innerWidth <= 768){

      closeAllPanels();

    }

  }
);
/* =========================
TOGGEL TOOLBAR
========================= */

function toggleToolbar(){

  const toolbar =
  document.querySelector(".top-toolbar");

  const leftPanel =
  document.querySelector(".left-panel");

  const rightPanel =
  document.querySelector(".right-panel");

  if(window.innerWidth <= 768){

    leftPanel.classList.remove("show");

    rightPanel?.classList.remove("show");

  }

  toolbar.classList.toggle("show");

}
/* =========================
TEXT
========================= */

function addText(text,size){

  const textbox =
  new fabric.Textbox(
    text,
    {

      left:100,
      top:100,

      fontSize:size,

      fontFamily:'Poppins',

      fill:'#000',

      fontWeight:'700',

      width:300

    }
  );

  canvas.add(textbox);

  canvas.setActiveObject(textbox);

}

function addNeonText(){

  const text =
  new fabric.Textbox(
    "NEON TEXT",
    {

      left:150,
      top:150,

      fontSize:40,

      fill:'#00ffff',

      shadow:'0 0 20px #00ffff',

      fontWeight:'900'

    }
  );

  canvas.add(text);

}

function addRect(){

  const rect =
  new fabric.Rect({

    left:100,
    top:100,

    width:300,
    height:120,

    fill:'#7c1414',

    rx:20,
    ry:20

  });

  canvas.add(rect);

}

function addCircle(){

  const circle =
  new fabric.Circle({

    left:100,
    top:100,

    radius:80,

    fill:'#0a9b32'

  });

  canvas.add(circle);

}

function addTriangle(){

  const triangle =
  new fabric.Triangle({

    left:100,
    top:100,

    width:150,
    height:150,

    fill:'#ff9900'

  });

  canvas.add(triangle);

}

/* =========================
UPLOAD IMAGE
========================= */

const imageUpload =
document.getElementById(
  "imageUpload"
);

imageUpload.addEventListener(
  "change",
  function(e){

    const file =
    e.target.files[0];

    if(!file) return;

    const reader =
    new FileReader();

    reader.onload =
    function(f){

      fabric.Image.fromURL(
        f.target.result,
        function(img){

          img.set({

            left:50,
            top:50

          });

          img.scaleToWidth(300);

          canvas.add(img);

          saveRecentImage(
            f.target.result
          );

        }
      );

    };

    reader.readAsDataURL(file);

  }
);

/* =========================
RECENT IMAGES
========================= */

function saveRecentImage(src){

  let images =
  JSON.parse(
    localStorage.getItem(
      "recentImages"
    ) || "[]"
  );

  images.unshift(src);

  images =
  images.slice(0,6);

  localStorage.setItem(
    "recentImages",
    JSON.stringify(images)
  );

  loadRecentImages();

}

function loadRecentImages(){

  const container =
  document.getElementById(
    "recentImages"
  );

  container.innerHTML = "";

  let images =
  JSON.parse(
    localStorage.getItem(
      "recentImages"
    ) || "[]"
  );

  images.forEach(src=>{

    const img =
    document.createElement("img");

    img.src = src;

    img.onclick = ()=>{

      fabric.Image.fromURL(
        src,
        function(image){

          image.set({

            left:100,
            top:100

          });

          image.scaleToWidth(300);

          canvas.add(image);

        }
      );

    };

    container.appendChild(img);

  });

}

loadRecentImages();

DRAW
========================= */

  canvas.isDrawingMode = true;

}

function disableDrawing(){

  canvas.isDrawingMode = false;

}

function makeBold(){

  const obj =
  canvas.getActiveObject();

  if(obj){

    obj.set(
      "fontWeight",
      obj.fontWeight === 'bold'
      ? 'normal'
      : 'bold'

    canvas.renderAll();

/* =========================
PROJECT TITLE
========================= */

const projectTitle =
document.getElementById(
  "projectTitle"
);

const savedTitle =
localStorage.getItem(
  "project_title"
);

if(savedTitle){

  projectTitle.value =
  savedTitle;

}

  "input",
  function(){

    localStorage.setItem(
      "project_title",
      this.value
    );

  }
);

/* =========================
DOWNLOAD PNG
========================= */

function downloadPNG(){

  const fileName =
  (
    projectTitle.value ||
    "poster"
  ).trim();

  const link =
  document.createElement("a");

  link.download =
  fileName + ".png";

  link.href =
  canvas.toDataURL({
    format:'png',
    quality:1
  });

  link.click();

}
/* =========================
TRANSPARENT PNG
========================= */

function downloadTransparentPNG(){

  const fileName =
  (
    projectTitle.value ||
    "poster"
  ).trim();

  // OLD BG SAVE
  const oldBg =
  canvas.backgroundColor;

  // TEMP REMOVE BG
  canvas.setBackgroundColor(
    null,
    canvas.renderAll.bind(canvas)
  );

  const link =
  document.createElement("a");

  link.download =
  fileName + "-transparent.png";

  link.href =
  canvas.toDataURL({
    format:'png',
    quality:1
  });

  link.click();

  // RESTORE BG
  canvas.setBackgroundColor(
    oldBg,
    canvas.renderAll.bind(canvas)
  );

}
/* =========================
DOWNLOAD JPG
========================= */

function downloadJPG(){

  const fileName =
  (
    projectTitle.value ||
    "poster"
  ).trim();

  const link =
  document.createElement("a");

  link.download =
  fileName + ".jpg";

  link.href =
  canvas.toDataURL({
    format:'jpeg',
    quality:1
  });

  link.click();

}

/* =========================
PRINT
========================= */

function printCanvas(){

  const data =
  canvas.toDataURL();

  const win =
  window.open("");

  win.document.write(`
    <img
    src="${data}"
    style="width:100%;"
    onload="window.print();"
    >
  `);

}

/* =========================
SAVE JSON
========================= */

function downloadJSON(){

  const data =
  JSON.stringify(
    canvas.toJSON()
  );

  const blob =
  new Blob(
    [data],
    {
      type:"application/json"
    }

<script>

/* =========================================================
UNDO / REDO HISTORY
========================================================= */

let history = [];
let historyStep = -1;
let isRedoing = false;

/* SAVE HISTORY */

function saveHistory(){

  if(isRedoing) return;

  historyStep++;

  if(historyStep < history.length){

    history.length = historyStep;

  }

  history.push(
    JSON.stringify(canvas)
  );

}

/* INITIAL SAVE */

saveHistory();

/* AUTO SAVE */

canvas.on(
  "object:added",
  saveHistory
);

canvas.on(
  "object:modified",
  saveHistory
);

canvas.on(
  "object:removed",
  saveHistory
);

/* UNDO */

function undo(){

  if(historyStep <= 0) return;

  isRedoing = true;

  historyStep--;

  canvas.loadFromJSON(

    history[historyStep],

    function(){

      canvas.renderAll();

      isRedoing = false;

    }

  );

}

/* REDO */

function redo(){

  if(
    historyStep >=
    history.length - 1
  ) return;

  isRedoing = true;

  historyStep++;

  canvas.loadFromJSON(

    history[historyStep],

    function(){

      canvas.renderAll();

      isRedoing = false;

    }

  );

}

/* =========================================================
LAYER UP
========================================================= */

function layerUp(){

  const obj =
  canvas.getActiveObject();

  if(!obj) return;

  canvas.bringForward(obj);

  canvas.renderAll();

  saveHistory();

}

/* =========================================================
LAYER DOWN
========================================================= */

function layerDown(){

  const obj =
  canvas.getActiveObject();

  if(!obj) return;

  canvas.sendBackwards(obj);

  canvas.renderAll();

  saveHistory();

}

/* =========================================================
LOCK / UNLOCK
========================================================= */

function toggleLock(){

  const obj =
  canvas.getActiveObject();

  if(!obj) return;

  const lockBtn =
  document.getElementById(
    "lockBtn"
  );

  const isLocked =
  obj.isLocked === true;

  /* =====================
     UNLOCK
  ===================== */

  if(isLocked){

    obj.set({

      selectable:true,
      evented:true,

      lockMovementX:false,
      lockMovementY:false,

      lockScalingX:false,
      lockScalingY:false,

      lockRotation:false,

      hasControls:true,
      hasBorders:true,

      opacity:1,

      isLocked:false

    });

    // TOOLBAR ICON
    if(lockBtn){

      lockBtn.innerHTML = "🔓";

    }

    // OBJECT ICON
    addLockIcon(obj,false);

  }

  /* =====================
     LOCK
  ===================== */

  else{

    obj.set({

      selectable:true,
      evented:true,

      lockMovementX:true,
      lockMovementY:true,

      lockScalingX:true,
      lockScalingY:true,

      lockRotation:true,

      hasControls:false,
      hasBorders:false,

      opacity:1,

      isLocked:true

    });

    // TOOLBAR ICON
    if(lockBtn){

      lockBtn.innerHTML = "🔒";

    }

    // OBJECT ICON
    addLockIcon(obj,true);

  }

  canvas.setActiveObject(obj);

  canvas.renderAll();

  saveHistory();

}

SELECT LOCKED OBJECT
========================================================= */

canvas.on(

    if(!opt.target) return;

DUPLICATE

/* =========================================================
DELETE
========================================================= */

function deleteLayer(){

  const obj =
  canvas.getActiveObject();

  if(!obj) return;

  canvas.remove(obj);

  canvas.renderAll();

  saveHistory();

}

/* =========================================================
DELETE KEY SUPPORT
========================================================= */

/* =========================================================
SAFE DELETE KEY
========================================================= */

document.addEventListener(

  "keydown",

  function(e){

    const obj =
    canvas.getActiveObject();

    if(!obj) return;

    /* =====================
       TEXT EDIT MODE
    ===================== */

    const isEditingText =

      (
        obj.type === "textbox" ||
        obj.type === "i-text"
      )

      &&

      obj.isEditing;

    /* =====================
       DELETE OBJECT
    ===================== */

    if(

      (
        e.key === "Delete" ||
        e.key === "Backspace"
      )

      &&

      !isEditingText

    ){

      e.preventDefault();

      canvas.remove(obj);

      canvas.renderAll();

      saveHistory();

    }

    /* =====================
       CTRL + Z
    ===================== */

    if(
      e.ctrlKey &&
      e.key.toLowerCase() === "z"
    ){

      e.preventDefault();

      undo();

    }

    /* =====================
       CTRL + Y
    ===================== */

    if(
      e.ctrlKey &&
      e.key.toLowerCase() === "y"
    ){

      e.preventDefault();

      redo();

    }

  }

);

/* =========================================================
PARTIAL TEXT COLOR
========================================================= */

function applySelectedTextColor(color){

<script>
  /* =========================================================
CANVAS DRAG & DROP IMAGE UPLOAD
========================================================= */

function initCanvasDragDrop(){

  const canvasContainer =
  canvas.upperCanvasEl;

  /* =====================
     PREVENT DEFAULT
  ===================== */

  [
    "dragenter",
    "dragover",
    "dragleave",
    "drop"
  ].forEach(eventName=>{

    canvasContainer.addEventListener(

      eventName,

      function(e){

        e.preventDefault();

        e.stopPropagation();

      },

      false

    );

  });

  /* =====================
     CANVAS HIGHLIGHT
  ===================== */

  [
    "dragenter",
    "dragover"
  ].forEach(eventName=>{

    canvasContainer.addEventListener(

      eventName,

      function(){

        canvasContainer.style.outline =
        "3px dashed #7c3aed";

        canvasContainer.style.outlineOffset =
        "-6px";

      },

      false

    );

  });

  /* =====================
     REMOVE HIGHLIGHT
  ===================== */

  [
    "dragleave",
    "drop"
  ].forEach(eventName=>{

    canvasContainer.addEventListener(

      eventName,

      function(){

        canvasContainer.style.outline =
        "none";

      },

      false

    );

  });

  /* =====================
     DROP IMAGE
  ===================== */

  canvasContainer.addEventListener(

    "drop",

    function(e){

      const dt =
      e.dataTransfer;

      const files =
      dt.files;

      if(!files.length) return;

      [...files].forEach(file=>{

        if(
          !file.type.startsWith(
            "image/"
          )
        ) return;

        const reader =
        new FileReader();

        reader.onload =
        function(event){

          fabric.Image.fromURL(

            event.target.result,

            function(img){

              /* DROP POSITION */

              const pointer =
              canvas.getPointer(e);

              img.set({

                left:pointer.x,
                top:pointer.y,

                originX:"center",
                originY:"center"

              });

              /* AUTO SCALE */

              if(
                img.width > 500
              ){

                img.scaleToWidth(300);

              }

              canvas.add(img);

              canvas.setActiveObject(img);

              canvas.renderAll();

              saveRecentImage(
                event.target.result
              );

              saveHistory();

            }

          );

        };

        reader.readAsDataURL(file);

      });

    },

    false

  );

}

/* =========================================================
INIT
========================================================= */

initCanvasDragDrop();
</script>

function applyImageFilters(){

    obj.filters.push(

      new fabric.Image.filters.Brightness({
        brightness:brightness

  /* CONTRAST */

  const contrast =
  parseFloat(
    document.getElementById(
      "contrastRange"
    ).value
  );

  if(contrast !== 0){

    obj.filters.push(

      new fabric.Image.filters.Contrast({
        contrast:contrast

  /* SATURATION */

  const saturation =
  parseFloat(
    document.getElementById(

  );

  if(saturation !== 0){

    obj.filters.push(

      new fabric.Image.filters.Saturation({

  ){

    alert("Please select image first");

    return;

  }

  // IMAGE MEMORY
  croppingImage = activeImg;

  // BUTTON CLICK SE DESELECT NA HO
  canvas.discardActiveObject();

  // OLD CROP REMOVE
  if(cropRect){

    canvas.remove(cropRect);

  }

  // CREATE CROP BOX
  cropRect =
  new fabric.Rect({

    left:activeImg.left + 20,
    top:activeImg.top + 20,

    width:
    activeImg.width *
    activeImg.scaleX * 0.6,

    height:
    activeImg.height *
    activeImg.scaleY * 0.6,

    fill:'rgba(0,0,0,0.2)',

    stroke:'#7c3aed',
    strokeWidth:2,

    strokeDashArray:[8,8],

    cornerColor:'#7c3aed',

    transparentCorners:false,

    cornerSize:14,

    borderScaleFactor:2,

    selectable:true,
    evented:true

  });

  canvas.add(cropRect);

  // IMAGE KO LOCK NAHI HATANA
  canvas.bringToFront(cropRect);

  // IMPORTANT
  // IMAGE MEMORY SAFE RAHEGI
  // CROPPER ACTIVE RAHEGA

  canvas.setActiveObject(cropRect);

  canvas.renderAll();

}

/* =========================
APPLY CROP
========================= */

function applyCrop(){

  if(
    !cropRect ||
    !croppingImage
  ) return;

  const img =
  croppingImage;

  const scaleX =
  img.scaleX;

  const scaleY =
  img.scaleY;

  /* CROP AREA */

  const cropX =
  (cropRect.left - img.left) / scaleX;

  const cropY =
  (cropRect.top - img.top) / scaleY;

  const cropWidth =
  cropRect.width * cropRect.scaleX / scaleX;

  const cropHeight =
  cropRect.height * cropRect.scaleY / scaleY;

  /* APPLY */

  img.set({

    cropX:cropX,
    cropY:cropY,

    width:cropWidth,
    height:cropHeight

  });

  /* RESET SCALE */

  img.set({

    scaleX:scaleX,
    scaleY:scaleY

  });

  canvas.remove(cropRect);

  cropRect = null;

 canvas.discardActiveObject();

canvas.setActiveObject(img);

canvas.renderAll();


}

/* =========================
SHOW / HIDE APPLY BUTTON
========================= */

canvas.on(
  "selection:created",
  updateCropButton
);

canvas.on(
  "selection:updated",
  updateCropButton
);

canvas.on(
  "selection:cleared",
  function(){

    document.getElementById(
      "applyCropBtn"
    ).style.display = "none";

  }
);

function updateCropButton(){

  const obj =
  canvas.getActiveObject();

  const btn =
  document.getElementById(
    "applyCropBtn"
  );

  // IMAGE SELECTED
  // YA CROP MODE ACTIVE

  if(

    (
      obj &&
      obj.type === "image"
    )

    ||

    cropRect

  ){

    btn.style.display =
    "block";

  }

  else{

    btn.style.display =
    "none";

  }

}
/* =========================
ENTER KEY = APPLY CROP
========================= */

document.addEventListener(
  "keydown",
  function(e){

    if(
      e.key === "Enter" &&
      cropRect
    ){

      e.preventDefault();

      applyCrop();

    }

  }
);
</script>
