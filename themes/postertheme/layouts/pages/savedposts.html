
{{ define "main" }}


<style>
.channel-feed{
    max-width:850px;
    margin:70px auto;
    padding:15px;
}

.post-card{
    background:#fff;
    border-radius:16px;
    overflow:hidden;
    margin-bottom:20px;
    box-shadow:0 2px 12px rgba(0,0,0,.08);
}

.post-header{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:15px;
}

.avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    overflow:hidden;
    border:1px solid #eee;
    flex-shrink:0;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.meta{
    flex:1;
    min-width:0;
}

.title{
    font-weight:700;
    display:flex;
    align-items:center;
    gap:6px;
}

.verified-badge{
    width:18px;
    height:18px;
    border-radius:50%;
    background:#1d9bf0;
    color:#fff;
    font-size:11px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
}

.date{
    font-size:13px;
    color:#666;
    margin-top:4px;
}

.post-image img{
    width:100%;
    display:block;
}

.post-body{
    padding:15px;
}

.post-text{
    white-space:pre-line;
    line-height:1.5;
}

.header-save-btn{
    margin-left:auto;
    border:none;
    background:#fff7ed;
    color:#f59e0b;
    padding:8px 14px;
    border-radius:999px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
}

.header-save-btn:hover{
    background:#fef3c7;
}

.header-save-btn.saved{
    background:#f59e0b;
    color:#fff;
}
.post-footer{
    display:flex;
    justify-content:center;
    gap:12px;
    padding:14px;
    border-top:1px solid #eee;
}

.action-btn{
    width:46px;
    height:46px;
    border:none;
    border-radius:14px;
    background:#f8fafc;
    color:#222;
    text-decoration:none;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:22px;
    transition:.25s ease;
    box-shadow:
        0 2px 8px rgba(0,0,0,.08),
        inset 0 1px 0 rgba(255,255,255,.8);
}

.action-btn:hover{
    transform:translateY(-2px);
}

.remove-saved{
    background:#fee2e2;
}

.remove-saved:hover{
    background:#ef4444;
    color:#fff;
}

.empty-state{
    text-align:center;
    padding:50px 20px;
    color:#666;
    font-size:16px;
}

.menu-wrap{
    position:relative;
}

.menu-btn{
    width:36px;
    height:36px;
    border:none;
    background:none;
    font-size:22px;
    cursor:pointer;
    border-radius:50%;
}

.menu-btn:hover{
    background:#f3f4f6;
}

.menu-dropdown{
    position:absolute;
    right:0;
    top:40px;
    min-width:180px;
    background:#fff;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
    display:none;
    z-index:999;
}

.menu-dropdown.show{
    display:block;
}

.menu-dropdown a,
.menu-dropdown button{
    width:100%;
    border:none;
    background:none;
    padding:12px;
    text-align:left;
    cursor:pointer;
    display:block;
    color:#333;
}

.menu-dropdown a:hover,
.menu-dropdown button:hover{
    background:#f5f5f5;
}
</style>


   <div class="channel-feed">

    <div id="savedFeed"></div>

</div>
<script>
    const savedPosts =
JSON.parse(
    localStorage.getItem(
        "savedPosts"
    ) || "[]"
);

const feed =
document.getElementById(
    "savedFeed"
);

feed.innerHTML = savedPosts.map(post=>`

<article class="post-card">

    <div class="post-header">

    <div class="avatar">
        <img
            src="${post.sourceLogo}"
            alt="${post.sourceName}">
    </div>

    <div class="meta">

        <div class="title">

            ${post.sourceName}

            <span class="verified-badge">
                ✓
            </span>

        </div>

        <div class="date">
            Saved Post
        </div>

    </div>
    <a
    href="${post.url}"
    target="_blank"
    class="header-share-btn">

 <button
    class="header-save-btn save-btn">
    🔗 Open  
</button> </a>
    <div class="menu-wrap">

        <button class="menu-btn">
            ⋮
        </button>

        <div class="menu-dropdown">

            <a
                href="${post.url}"
                target="_blank">

                🔗 Open

            </a>
            <button
    class="action-btn share-post"
    data-title="${post.title || ''}"
    data-text="${post.description || ''}"
    data-url="${post.url}">
    📤
</button>
            <button
                class="remove-saved"
                data-url="${post.url}">

                🗑️ Remove

            </button>

        </div>

    </div>

</div>
    ${
        post.image
        ? `
        <div class="post-image">

            <a
                href="${post.url}"
                target="_blank">

                <img
                    src="${post.image}"
                    alt="${post.title}">

            </a>

        </div>
        `
        : ""
    }

    <div class="post-body">

        <div class="post-text">

            ${post.description || ""}

        </div>

    </div>

    <div class="post-footer">

        <a
            href="${post.url}"
            target="_blank"
            class="action-btn">

            🔗

        </a>
        <button
    class="action-btn share-post"
    data-title="${post.title || ''}"
    data-text="${post.description || ''}"
    data-url="${post.url}">
    📤
</button>
        <button
            class="action-btn remove-saved"
            data-url="${post.url}">

            🗑️

        </button>

    </div>

</article>

`).join("");
if(savedPosts.length===0){

    feed.innerHTML = `

    <article class="post-card">

        <div class="post-body">

            No saved posts found.

        </div>

    </article>

    `;

}
document.addEventListener(
"click",
function(e){

    const btn =
    e.target.closest(
        ".remove-saved"
    );

    if(!btn) return;

    const url =
    btn.dataset.url;

    let posts =
    JSON.parse(
        localStorage.getItem(
            "savedPosts"
        ) || "[]"
    );

    posts =
    posts.filter(
        p => p.url !== url
    );

    localStorage.setItem(
        "savedPosts",
        JSON.stringify(posts)
    );

    btn.closest(
        ".post-card"
    ).remove();

});
</script>
<script>
    document.addEventListener("click",function(e){

    if(e.target.classList.contains("menu-btn")){

        const menu =
            e.target.nextElementSibling;

        document
            .querySelectorAll(".menu-dropdown")
            .forEach(m=>{

                if(m!==menu){
                    m.classList.remove("show");
                }

            });

        menu.classList.toggle("show");
        return;
    }

    document
        .querySelectorAll(".menu-dropdown")
        .forEach(m=>
            m.classList.remove("show")
        );

});
</script>
<script>
document.addEventListener("click", async function(e){

    const btn = e.target.closest(".share-post");

    if(!btn) return;

    const title = btn.dataset.title || "";
    const text  = btn.dataset.text || "";
    const url   = btn.dataset.url || "";

    const shareText =
`${title}

${text}

${url}`;

    if(navigator.share){

        try{

            await navigator.share({
                title: title,
                text: text,
                url: url
            });

        }catch(err){}

    }else{

        window.open(
            "https://wa.me/?text=" +
            encodeURIComponent(shareText),
            "_blank"
        );

    }

});
</script>

{{ end }}
