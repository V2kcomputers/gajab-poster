<script>

function formatPostTime(unixTimestamp){

    const now = Date.now();
    const postTime = unixTimestamp * 1000;

    const diffMinutes =
        Math.floor((now - postTime) / 60000);

    const diffHours =
        Math.floor(diffMinutes / 60);

    if(diffMinutes < 2){
        return "Just now";
    }

    if(diffMinutes < 60){
        return `${diffMinutes} minutes ago`;
    }

    if(diffHours < 24){
        return diffHours === 1
            ? "1 hour ago"
            : `${diffHours} hours ago`;
    }

    return new Date(postTime)
        .toLocaleDateString("en-IN",{
            day:"2-digit",
            month:"short",
            year:"numeric"
        });
}

function updateTimes(){

    document
    .querySelectorAll(".time")
    .forEach(el=>{

        const ts =
            Number(el.dataset.time);

        el.textContent =
            formatPostTime(ts);

    });

}

function linkifyText(text){

    text = text.replace(
        /(https?:\/\/[^\s]+)/g,
        '<a href="$1" target="_blank" class="post-link">$1</a>'
    );

    text = text.replace(
        /(^|\s)(#[a-zA-Z0-9_\u0900-\u097F]+)/g,
        function(match,space,tag){

            const keyword =
                tag.slice(1);

            return `${space}<a href="/search/?q=${encodeURIComponent(keyword)}" class="post-tag">${tag}</a>`;

        }
    );

    return text;

}

let allPosts = [];
let currentPage = 0;
const postsPerPage = 20;

async function loadFeed(){

    const feed =
        document.getElementById(
            "channelFeed"
        );

    // Loading Skeleton

    feed.innerHTML = Array(5).fill(`

        <article class="post-card skeleton-card">

            <div class="post-header">

                <div class="avatar skeleton"></div>

                <div class="meta">

                    <div
                        class="skeleton"
                        style="

                        width:70%;
                        margin-bottom:8px;">
                    </div>

                    <div
                        class="skeleton"
                        style="
                        height:12px;
                        width:120px;">
                    </div>

                </div>

            </div>

            <div
                class="skeleton"
                style="
                height:220px;
                margin:0 15px;
                border-radius:12px;">
            </div>

            <div class="post-body">

                <div
                    class="skeleton"
                    style="
                    height:14px;
                    margin-bottom:8px;">
                </div>

                <div
                    class="skeleton"
                    style="
                    height:14px;
                    margin-bottom:8px;">
                </div>

                <div
                    class="skeleton"
                    style="
                    height:14px;
                    width:60%;">
                </div>

            </div>

        </article>

    `).join("");

   const feedSources = [

{
    url:"/channel.json",
    name:"Yojna Portal Poster",
    logo:"/favicon.ico"
},

{
    url:"https://www.gajabtools.com/channel.json",
    name:"Yojna Portal",
    logo:"https://www.gajabtools.com/favicon.ico"
},

{
    url:"https://www.yojnaportal.com/channel.json",
    name:"Yojna Portal",
    logo:"https://www.yojnaportal.com/favicon.ico"
}

];

    try{

        let posts = [];

       const results =
await Promise.allSettled(

    feedSources.map(source=>

        fetch(source.url)
        .then(r=>r.json())
        .then(data=>

            data.map(post=>({

                ...post,

                sourceName:
                    source.name,

                sourceLogo:
                    source.logo

            }))

        )

    )

);
        results.forEach(result=>{

            if(
                result.status === "fulfilled"
            ){

                posts.push(
                    ...result.value
                );

            }

        });

        posts.sort(
            (a,b)=>
            new Date(b.date) -
            new Date(a.date)
        );

        allPosts = posts;

        feed.innerHTML = "";

        renderPosts();
        updateSavedButtons();
    }catch(err){

        console.error(err);

        feed.innerHTML =
            "<h3>Feed loading failed</h3>";

    }

}

function renderPosts(){

    const feed =
        document.getElementById(
            "channelFeed"
        );

    const start =
        currentPage * postsPerPage;

    const end =
        start + postsPerPage;

    const chunk =
        allPosts.slice(start,end);

    if(chunk.length === 0){
        return;
    }

    feed.insertAdjacentHTML(

        "beforeend",

        chunk.map(post=>`

        <article class="post-card">

            <div class="post-header">

                <div class="avatar">

    <img
        src="${post.sourceLogo}"
        alt="${post.sourceName}"
        loading="lazy">

      </div>

                <div class="meta">

                 <div class="title">

    ${post.sourceName}

    <span class="verified-badge">
        <svg
            viewBox="0 0 24 24"
            width="14"
            height="14"
            fill="white">

            <path d="M9.55 18.2L3.8 12.45l1.4-1.4 4.35 4.35 9.25-9.25 1.4 1.4z"/>

        </svg>
    </span>

</div>

<div
    class="time"
    data-time="${Date.parse(post.date)/1000}">
</div>
    
                </div>

          <button
    class="header-save-btn save-btn"
    data-post='${JSON.stringify(post).replace(/'/g,"&#39;")}'>
    ⭐ Save
</button>
            <div class="menu-wrap">

    <button class="menu-btn">⋮</button>
    
    <div class="menu-dropdown">

        <a href="${post.url}" target="_blank">
            🔗 Open
        </a>

        <button
            class="copy-btn"
            data-text="${(post.description||'').replace(/"/g,'&quot;')}">
            📑 Copy Text
        </button>

        <button
            class="whatsapp-btn"
            data-text="${(post.description||'').replace(/"/g,'&quot;')}"
            data-url="${post.url}">
            📤 WhatsApp
        </button>

        <button
            class="share-btn"
            data-title="${post.title}"
            data-url="${post.url}">
            🖇️ Share Link
        </button>
      
    </div>




    </div>
            </div>
           
                <div class="post-body">
               
                <div
    class="post-text ${post.image ? 'collapsed' : ''}">
           ${ linkifyText(  post.description || "" ) }
    
</div>
            </div>

            ${
                post.image
                ? `
                <div class="post-image">
                    <a href="${post.url}">
                        <img
                            src="${post.image}"
                            alt="${post.title}">
                    </a>
                </div>
                `
                : ""
            }

        
           
            <div class="post-footer">
               
                <a
                    href="${post.url}"
                    target="_blank"
                    class="action-btn">
                    🔗
                </a>

                <button
                    class="action-btn copy-btn"
                    data-text="${(post.description||'').replace(/"/g,'&quot;')}">
                    📑
                </button>

                <button
                    class="action-btn whatsapp-btn"
                    data-text="${(post.description||'').replace(/"/g,'&quot;')}"
                    data-url="${post.url}">
                    📤
                </button>

            </div>

        </article>

        `).join("")

    );

    updateTimes();
updateSavedButtons();

}

window.addEventListener(
"scroll",
function(){

loadFeed();

document
.querySelectorAll(".save-btn")

document.addEventListener(
"click",
async function(e){

    if(
        e.target.classList.contains(

        )
    ){

        await navigator.clipboard
        .writeText(
            e.target.dataset.text
        );

            "whatsapp-btn"
        )
    ){

        const text =
            e.target.dataset.text;

        const url =
            e.target.dataset.url;

        window.open(
            "https://wa.me/?text=" +
            encodeURIComponent(
                text + "\n\n" + url
            ),
            "_blank"
        );

    }

});

</script>

        return;

    document
        .querySelectorAll(".menu-dropdown")
        .forEach(m => m.classList.remove("show"));

});


</script>

<script>
document.addEventListener("click",function(e){

    const btn =
        e.target.closest(".save-btn");

    if(!btn) return;

    const post =
        JSON.parse(
            btn.dataset.post
                .replace(/&#39;/g,"'")
        );

    let savedPosts =
        JSON.parse(
            localStorage.getItem(
                "savedPosts"
            ) || "[]"
        );

    const exists =
        savedPosts.find(
            p => p.url === post.url
        );

    if(exists){

        savedPosts =
            savedPosts.filter(
                p => p.url !== post.url
            );

        btn.innerHTML =
            "⭐ Save";

        btn.classList.remove(
            "saved"
        );

    }else{

        savedPosts.unshift(post);

        btn.innerHTML =
            "★ Saved";

        btn.classList.add(
            "saved"
        );

    }

    localStorage.setItem(
        "savedPosts",
        JSON.stringify(savedPosts)
    );

});
</script>

            btn.innerHTML =
            "★ Saved";

            btn.classList.add(
                "saved"
            );

        }else{

            btn.innerHTML =
            "⭐ Save";

            btn.classList.remove(
                "saved"
            );

        }

    });

}
</script>
