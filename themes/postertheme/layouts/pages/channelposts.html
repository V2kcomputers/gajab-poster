
{{ define "main" }}

<div class="channel-feed">

{{ range first 20 (where site.RegularPages "Type" "poster") }}

<article class="post-card">

    <div class="post-header">
        <div class="avatar">{{ .Params.icon }}</div>

        <div class="meta">
            <div class="title">{{ .Title }}</div>
  
<div class="time"
     data-time="{{ .Date.Unix }}">
</div>
    </div>
    </div>
<div class="post-body">

    {{ with index .Params.Hindi_Sharing 0 }}

    <div class="post-text collapsed">
        {{ . }}
    </div>

    <button class="read-more-btn">
        Read More...
    </button>

    {{ end }}

</div>



    {{ if .Params.imagePoster }}
    <div class="post-image">
       <a href="{{ .Permalink }}"> <img src="{{ .Params.imagePoster }}" alt="{{ .Title }}"></a>
    </div>
    {{ end }}




    <div class="post-footer">

        <a href="{{ .RelPermalink }}" class="btn">
           Complete
        </a>
         <button class="btn copy-btn" data-text="{{ index .Params.Hindi_Sharing 0 }}"> Copy Text</button>
        <button
            class="btn share-btn"
            data-title="{{ .Title }}"
            data-url="{{ .Permalink }}">
            Share Post
        </button>

    </div>

</article>

{{ end }}

</div>

<style>
.channel-feed{
    max-width:850px;
    margin:auto;
    padding:15px;
}

.post-card{
    background:#fff;
    border-radius:16px;
    overflow:hidden;
    margin-bottom:20px;
    box-shadow:0 2px 12px rgba(0,0,0,.08);
}

.post-header{
    display:flex;
    align-items:center;
    gap:12px;
    padding:15px;
}

.avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f1f5f9;
    font-size:22px;
}

.title{
    font-weight:700;
}

.date{
    font-size:13px;
    color:#666;
}

.post-image img{
    width:100%;
    display:block;
}

.post-body{
    padding:15px;
}

.post-footer{
    display:flex;
    gap:10px;
    padding:15px;
    border-top:1px solid #eee;
}

.btn{
    background:#16a34a;
    color:#fff;
    text-decoration:none;
    border:none;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
}

.post-text{
    white-space: pre-line;   /* line breaks preserve */
    line-height: 1.7;
}

.post-text.collapsed{
    display: -webkit-box;
    -webkit-line-clamp: 4;   /* 4 lines */
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.read-more-btn{
    margin-top:10px;
    background:none;
    border:none;
    color:#16a34a;
    font-weight:600;
    cursor:pointer;
    padding:0;
}

.post-link{
    color:#2563eb;
    text-decoration:none;
    word-break:break-word;
}

.post-link:hover{
    text-decoration:underline;
}

.post-tag{
    color:#16a34a;
    font-weight:600;
    text-decoration:none;
}

.post-tag:hover{
    text-decoration:underline;
}
</style>

<script>
document.addEventListener("click", async function(e){

    if(!e.target.classList.contains("share-btn")) return;

    const title = e.target.dataset.title;
    const url = e.target.dataset.url;

    try{

        if(navigator.share){
            await navigator.share({
                title:title,
                url:url
            });
        }else{
            await navigator.clipboard.writeText(url);
            alert("Link copied");
        }

    }catch(err){}
});
</script>
<script>
document.addEventListener("click", function(e){

    if(!e.target.classList.contains("read-more-btn")) return;

    const text = e.target.previousElementSibling;

    if(text.classList.contains("collapsed")){
        text.classList.remove("collapsed");
        e.target.textContent = "Show Less";
    }else{
        text.classList.add("collapsed");
        e.target.textContent = "Continue...";
    }

});
</script>


<script>
function formatPostTime(unixTimestamp){

    const now = Date.now();
    const postTime = unixTimestamp * 1000;

    const diffMinutes = Math.floor((now - postTime) / 60000);
    const diffHours = Math.floor(diffMinutes / 60);

    if(diffMinutes < 2){
        return "Just now";
    }

    if(diffMinutes < 60){
        return `${diffMinutes} minutes ago`;
    }

    if(diffHours < 24){
        return diffHours === 1
            ? "1 hour ago"
            : `${diffHours} hours ago`;
    }

    const postDate = new Date(postTime);
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);

    if(
        postDate.getDate() === yesterday.getDate() &&
        postDate.getMonth() === yesterday.getMonth() &&
        postDate.getFullYear() === yesterday.getFullYear()
    ){
        return "Yesterday";
    }

    return postDate.toLocaleString("en-IN", {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit"
    });
}

function updateTimes(){
    document.querySelectorAll(".time").forEach(el=>{
        const ts = Number(el.dataset.time);
        el.textContent = formatPostTime(ts);
    });
}

updateTimes();
setInterval(updateTimes, 60000);


</script>
<script>

document.addEventListener("click", async function(e){

    if(!e.target.classList.contains("copy-btn")) return;

    try{

        await navigator.clipboard.writeText(
            e.target.dataset.text
        );

        const old = e.target.textContent;

        e.target.textContent = "✓ Copied";

        setTimeout(()=>{
            e.target.textContent = old;
        },1500);

    }catch(err){
        alert("Copy failed");
    }

});


</script>
<script>

function linkifyText(text){

    // URLs
    text = text.replace(
        /(https?:\/\/[^\s]+)/g,
        '<a href="$1" target="_blank" class="post-link">$1</a>'
    );

    // Hashtags => /search/?q=
    text = text.replace(
        /(^|\s)(#[a-zA-Z0-9_\u0900-\u097F]+)/g,
        function(match, space, tag){

            const keyword = tag.slice(1); // remove #

            return `${space}<a href="/search/?q=${encodeURIComponent(keyword)}" class="post-tag">${tag}</a>`;
        }
    );

    return text.replace(/\n/g,'<br>');
}

document.querySelectorAll(".post-text").forEach(el=>{
    el.innerHTML = linkifyText(el.textContent);
});

</script>
{{ end }}
