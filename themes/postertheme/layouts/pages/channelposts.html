
{{ define "main" }}

<div class="channel-feed">
<div id="remotePosts"></div>
<div id="channelFeed"></div>
</div>

<style>



.post-header{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:15px;
}
a:link {text-decoration: none;}
.meta{
    flex:1;
    min-width:0;
}

.menu-wrap{
    position:relative;
    flex-shrink:0;
}

.menu-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    width:36px;
    height:36px;
    border:none;
    background:none;
    color:#444;
    font-size:22px;
    cursor:pointer;
    border-radius:50%;
}

.menu-btn:hover{
    background:#f3f4f6;
}



.menu-dropdown{
    position:absolute;
    right:0;
    top:35px;
    background:#fff;
    min-width:180px;
    border-radius:10px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
    display:none;
    z-index:999;
}

.menu-dropdown.show{
    display:block;
}

.menu-dropdown a,
.menu-dropdown button{
    width:100%;
    border:none;
    background:none;
    text-align:left;
    padding:12px;
    cursor:pointer;
    display:block;
    color:#333;
}

.menu-dropdown a:hover,
.menu-dropdown button:hover{
    background:#f5f5f5;
}


.channel-feed{
    max-width:850px;
    margin:auto;
    padding:15px;
}

.post-card{
    background:#fff;
    border-radius:16px;
    overflow:hidden;
    margin-bottom:20px;
    box-shadow:0 2px 12px rgba(0,0,0,.08);
}

.avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f1f5f9;
    font-size:22px;
}

.title{
    font-weight:700;
}

.date{
    font-size:13px;
    color:#666;
}

.post-image img{
    width:100%;
    display:block;
}

.post-body{
    padding:15px;
}

.post-text{
    white-space: pre-line;
    line-height: 1.4;
    cursor:pointer;
    margin-top: -50px;
}

.post-text.collapsed::after{
    content:" ...more";
    color:#16a34a;
    font-weight:600;
}

.post-text.collapsed{
    display: -webkit-box;
    -webkit-line-clamp: 4;   /* 4 lines */
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.read-more-btn{
    margin-top:0px;
    background:none;
    border:none;
    color:#16a34a;
    font-weight:600;
    cursor:pointer;
    padding:0;
}

.post-link{
    color:#2563eb;
    text-decoration:none;
    word-break:break-word;
}

.post-link:hover{
    text-decoration:underline;
}

.post-tag{
    color:#16a34a;
    font-weight:600;
    text-decoration:none;
}

.post-tag:hover{
    text-decoration:underline;
}

.post-footer{
    display:flex;
    justify-content:center;
    gap:12px;
    padding:14px;
    border-top:1px solid #eee;
}

.action-btn{
    width:46px;
    height:46px;
    border:none;
    border-radius:14px;
    background:#f8fafc;
    color:#222;
    text-decoration:none;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:22px;
    transition:.25s ease;
    box-shadow:
        0 2px 8px rgba(0,0,0,.08),
        inset 0 1px 0 rgba(255,255,255,.8);
}

.action-btn:hover{
    transform:translateY(-2px);
    background:#16a34a;
    color:#fff;
}

.action-btn:active{
    transform:scale(.92);
}

.action-btn span{
    line-height:1;
}
.copy-btn{
    background:#eff6ff;
}

.whatsapp-btn{
    background:#dcfce7;
}

.share-btn{
    background:#fef3c7;
}

.post-link{
    background:#e0f2fe;
}

</style>


<script>

function formatPostTime(unixTimestamp){

    const now = Date.now();
    const postTime = unixTimestamp * 1000;

    const diffMinutes =
        Math.floor((now - postTime) / 60000);

    const diffHours =
        Math.floor(diffMinutes / 60);

    if(diffMinutes < 2){
        return "Just now";
    }

    if(diffMinutes < 60){
        return `${diffMinutes} minutes ago`;
    }

    if(diffHours < 24){
        return diffHours === 1
            ? "1 hour ago"
            : `${diffHours} hours ago`;
    }

    return new Date(postTime)
        .toLocaleDateString("en-IN",{
            day:"2-digit",
            month:"short",
            year:"numeric"
        });
}

function updateTimes(){

    document
    .querySelectorAll(".time")
    .forEach(el=>{

        const ts =
            Number(el.dataset.time);

        el.textContent =
            formatPostTime(ts);

    });

}

function linkifyText(text){

    text = text.replace(
        /(https?:\/\/[^\s]+)/g,
        '<a href="$1" target="_blank" class="post-link">$1</a>'
    );

    text = text.replace(
        /(^|\s)(#[a-zA-Z0-9_\u0900-\u097F]+)/g,
        function(match,space,tag){

            const keyword =
                tag.slice(1);

            return `${space}<a href="/search/?q=${encodeURIComponent(keyword)}" class="post-tag">${tag}</a>`;

        }
    );

    return text;

}

let allPosts = [];
let currentPage = 0;
const postsPerPage = 20;

async function loadFeed(){

    const feed =
        document.getElementById(
            "channelFeed"
        );

    const feedSources = [

        "/channel.json",

        "https://www.gajabtools.com/channel.json",
         "https://www.yojnaportal.com/channel.json",
        "https://poster.yojnaportal.com/channel.json"

    ];

    try{

        let posts = [];

        const results =
            await Promise.allSettled(

                feedSources.map(url=>

                    fetch(url)
                    .then(r=>r.json())

                )

            );

        results.forEach(result=>{

            if(
                result.status === "fulfilled"
            ){

                posts.push(
                    ...result.value
                );

            }

        });

        posts.sort(
            (a,b)=>
            new Date(b.date) -
            new Date(a.date)
        );

        allPosts = posts;

        renderPosts();

    }catch(err){

        console.error(err);

        feed.innerHTML =
            "<h3>Feed loading failed</h3>";

    }

}

function renderPosts(){

    const feed =
        document.getElementById(
            "channelFeed"
        );

    const start =
        currentPage * postsPerPage;

    const end =
        start + postsPerPage;

    const chunk =
        allPosts.slice(start,end);

    if(chunk.length === 0){
        return;
    }

    feed.insertAdjacentHTML(

        "beforeend",

        chunk.map(post=>`

        <article class="post-card">

            <div class="post-header">

                <div class="avatar">
                    📢
                </div>

                <div class="meta">

                    <div class="title">
                        ${post.title}
                    </div>

                    <div
                        class="time"
                        data-time="${
                            Date.parse(post.date)/1000
                        }">
                    </div>

                </div>
            <div class="menu-wrap">

    <button class="menu-btn">⋮</button>

    <div class="menu-dropdown">

        <a href="${post.url}" target="_blank">
            🔗 Open
        </a>

        <button
            class="copy-btn"
            data-text="${(post.description||'').replace(/"/g,'&quot;')}">
            📑 Copy Text
        </button>

        <button
            class="whatsapp-btn"
            data-text="${(post.description||'').replace(/"/g,'&quot;')}"
            data-url="${post.url}">
            📤 WhatsApp
        </button>

        <button
            class="share-btn"
            data-title="${post.title}"
            data-url="${post.url}">
            🖇️ Share Link
        </button>

    </div>




    </div>
            </div>
                <div class="post-body">

                <div
                    class="post-text collapsed">

                    ${
                        linkifyText(
                            post.description || ""
                        )
                    }

                </div>

            </div>

            ${
                post.image
                ? `
                <div class="post-image">
                    <a href="${post.url}">
                        <img
                            src="${post.image}"
                            alt="${post.title}">
                    </a>
                </div>
                `
                : ""
            }

        

            <div class="post-footer">

                <a
                    href="${post.url}"
                    target="_blank"
                    class="action-btn">
                    🔗
                </a>

                <button
                    class="action-btn copy-btn"
                    data-text="${(post.description||'').replace(/"/g,'&quot;')}">
                    📑
                </button>

                <button
                    class="action-btn whatsapp-btn"
                    data-text="${(post.description||'').replace(/"/g,'&quot;')}"
                    data-url="${post.url}">
                    📤
                </button>

            </div>

        </article>

        `).join("")

    );

    updateTimes();

}

window.addEventListener(
"scroll",
function(){

    if(

        window.innerHeight +
        window.scrollY >=

        document.body.offsetHeight - 500

    ){

        currentPage++;

        renderPosts();

    }

});

loadFeed();



document.addEventListener(
"click",
async function(e){

    if(
        e.target.classList.contains(
            "copy-btn"
        )
    ){

        await navigator.clipboard
        .writeText(
            e.target.dataset.text
        );

        e.target.textContent = "✓";

        setTimeout(()=>{
            e.target.textContent = "📑";
        },1000);

    }

    if(
        e.target.classList.contains(
            "whatsapp-btn"
        )
    ){

        const text =
            e.target.dataset.text;

        const url =
            e.target.dataset.url;

        window.open(
            "https://wa.me/?text=" +
            encodeURIComponent(
                text + "\n\n" + url
            ),
            "_blank"
        );

    }

});

</script>
<script>

document.addEventListener("click", function(e){

    if(e.target.classList.contains("menu-btn")){

        const menu = e.target.nextElementSibling;

        document
            .querySelectorAll(".menu-dropdown")
            .forEach(m => {
                if(m !== menu) m.classList.remove("show");
            });

        menu.classList.toggle("show");
        return;
    }

    document
        .querySelectorAll(".menu-dropdown")
        .forEach(m => m.classList.remove("show"));

});


</script>
<script>
document.addEventListener("click", async function(e){

    if(!e.target.classList.contains("share-btn")) return;

    const title = e.target.dataset.title;
    const url = e.target.dataset.url;

    try{

        if(navigator.share){
            await navigator.share({
                title:title,
                url:url
            });
        }else{
            await navigator.clipboard.writeText(url);
            alert("Link copied");
        }

    }catch(err){}
});


document.addEventListener("click", function(e){

    if(!e.target.classList.contains("whatsapp-btn")) return;

    const text = e.target.dataset.text;
    const url = e.target.dataset.url;

    const shareText = text + "\n\n" + url;

    window.open(
        "https://wa.me/?text=" + encodeURIComponent(shareText),
        "_blank"
    );

});
</script>
<script>

document.addEventListener("click", function(e){

    const text = e.target.closest(".post-text");

    if(!text) return;

    text.classList.toggle("collapsed");

});

</script>

{{ end }}
